.nb-block-input.h3{font-size:15px;font-weight:600;line-height:1.5;color:var(--text0);padding-top:2px}
.nb-block-input.code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg3);border-radius:6px;padding:8px 10px;line-height:1.6}
.nb-block-quote-wrap{flex:1;display:flex;border-left:3px solid var(--accent2);padding-left:10px;margin:2px 0}
.nb-block-input.quote{font-style:italic;color:var(--text2)}
.nb-block-todo-wrap{flex:1;display:flex;align-items:flex-start;gap:8px}
.nb-todo-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border4);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:3px;color:var(--bg0);transition:all .1s}
.nb-todo-check.on{background:var(--accent2);border-color:var(--accent2)}
.nb-block-input.todo-done{color:var(--text4);text-decoration:line-through}
.nb-block-toggle-wrap{flex:1}
.nb-toggle-hdr{display:flex;align-items:center;gap:6px}
.nb-toggle-caret{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);transition:transform .12s;font-size:10px;margin-top:3px}
.nb-toggle-caret.open{transform:rotate(90deg)}
.nb-toggle-body{margin-top:4px;padding:6px 0 6px 22px;border-left:2px solid var(--border);margin-left:7px}
.nb-toggle-body textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text2);font-size:12.5px;line-height:1.7;font-family:'Inter',sans-serif;resize:none;padding:0}
.nb-toggle-body textarea::placeholder{color:var(--text4)}
.nb-block-img-wrap{flex:1;display:flex;flex-direction:column;gap:5px;padding:2px 0}
.nb-block-img-wrap img{max-width:100%;border-radius:8px;display:block;border:1px solid var(--border)}
.nb-block-img-empty{border:1.5px dashed var(--border3);border-radius:8px;padding:16px;text-align:center;font-size:11.5px;color:var(--text3);cursor:pointer;transition:all .12s}
.nb-block-img-empty:hover{background:var(--bg3);border-color:var(--border4);color:var(--text1)}
.nb-block-img-cap{width:100%;background:transparent;border:none;outline:none;color:var(--text3);font-size:11px;font-style:italic;padding:0}
.nb-block-img-cap::placeholder{color:var(--text4)}
.nb-slash-menu{position:absolute;z-index:20;top:100%;left:18px;margin-top:2px;background:var(--bg2);border:1px solid var(--border3);border-radius:var(--r-md);box-shadow:0 12px 28px #0008;padding:4px;min-width:210px;max-height:280px;overflow-y:auto}
.nb-slash-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text1)}
.nb-slash-item.sel,.nb-slash-item:hover{background:var(--bg4)}
.nb-slash-item-icon{width:22px;height:22px;border-radius:5px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:var(--text2)}
.nb-slash-item-sub{font-size:9.5px;color:var(--text4);margin-left:auto;white-space:nowrap}
.nb-block-typebtn{width:20px;height:20px;border-radius:5px;border:none;background:transparent;color:var(--text4);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity .1s;font-size:10px;margin-top:1px}
.nb-block-row:hover .nb-block-typebtn{opacity:1}
.nb-block-typebtn:hover{color:var(--text0);background:var(--bg3)}
.notebook-empty{color:var(--text3);font-size:12px;padding:20px 2px;text-align:center}
/* LIBRETA DE CUENTA — vista agregada de todas las libretas de proyecto + notas propias de la cuenta */
.nb-filter-row{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px;flex-shrink:0}
.nb-filter-chip{padding:3px 8px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-size:10px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .12s;white-space:nowrap}
.nb-filter-chip:hover{color:var(--text1);border-color:var(--border3)}
.nb-filter-chip.on{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent2)}
.nb-tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:20px;font-size:9.5px;font-weight:500;line-height:1.5;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin:3px 0 0}
.nb-tag-account{background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent2)}
.nb-tag-task{background:var(--bg3);border:1px solid var(--border3);color:var(--text2)}
.nb-tag-task.done{opacity:.55}
.notebook-page-top .nb-tag{margin:0}
/* Bitácora de experimentos por lanzamiento — reutiliza el look de las notas de pizarra */
.exp-panel{height:100%;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;max-width:440px}
.exp-panel-form{display:flex;flex-direction:column}
.exp-panel-list{display:flex;flex-direction:column;gap:8px}
.sysmap-tplsave-overlay{position:fixed;inset:0;background:#00000066;z-index:600;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.auto-launch-banner{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--r-lg);padding:10px 14px;margin:14px 20px 0}
.auto-launch-icon{font-size:18px;color:var(--accent2);flex-shrink:0}
.auto-launch-text{flex:1;min-width:0}
.auto-launch-title{font-size:12px;font-weight:600;color:var(--text0)}
.auto-launch-sub{font-size:11px;color:var(--text2);margin-top:2px}
.sysmap-tplsave-box{width:340px;max-width:92vw;background:var(--bg2);border:1px solid var(--border3);border-radius:var(--r-lg);padding:16px;box-shadow:0 20px 60px #000a}
.sysmap-tplsave-title{font-size:13.5px;font-weight:600;color:var(--text0);margin-bottom:6px}
.sysmap-tplsave-sub{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:10px}
.sysmap-empty-wrap{display:flex;flex-direction:column;align-items:center;padding-top:10px}
.sysmap-tpl-install{margin-top:6px;width:100%;max-width:360px}
.sysmap-tpl-install-lbl{font-size:11px;color:var(--text3);text-align:center;margin-bottom:8px}
.sysmap-tpl-install-list{display:flex;flex-direction:column;gap:6px}
.sysmap-tpl-install-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);padding:9px 12px;color:var(--text0);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;text-align:left}
.sysmap-tpl-install-btn:hover{border-color:var(--accent2);background:var(--bg3)}
.sysmap-tpl-install-btn span:nth-child(2){flex:1}
.sysmap-tpl-install-count{font-size:10px;color:var(--text4);flex-shrink:0}
.sysmap-zoom-ctrl{display:flex;align-items:center;gap:3px;margin-left:6px}
.sysmap-status-dot{width:7px;height:7px;border-radius:50%;background:#3ecf6a;box-shadow:0 0 5px #3ecf6a99;flex-shrink:0}
.sysmap-status-dot.off{background:var(--text4);box-shadow:none}
.sysmap-flask{flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#c77dff;opacity:.9}
.sysmap-card-badges{display:flex;align-items:center;gap:5px;flex-shrink:0}
/* Popover flotante compacto de fases — se abre con doble click, vive dentro del canvas para heredar pan/zoom */
.sysmap-popover{position:absolute;width:216px;background:var(--bg2);border:1px solid var(--border3);border-radius:var(--r-lg);box-shadow:0 14px 40px #000a;z-index:20;animation:sysdrawerIn .12s ease;overflow:hidden}
.sysmap-popover-hdr{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;border-bottom:1px solid var(--border2)}
.sysmap-popover-title{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:var(--text0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysmap-popover-x{flex-shrink:0;background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:2px 4px;border-radius:4px}
.sysmap-popover-x:hover{background:var(--bg4);color:var(--text0)}
.sysmap-popover-body{max-height:220px;overflow-y:auto;padding:6px}
.sysmap-popover-body::-webkit-scrollbar{width:2px}
.sysmap-popover-body::-webkit-scrollbar-thumb{background:var(--bg4)}
.sysmap-popover-phase{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;font-size:11px;color:var(--text1);cursor:pointer}
.sysmap-popover-phase:hover{background:var(--bg3)}
.sysmap-popover-phase.active{background:var(--bg3);color:var(--text0)}
.sysmap-popover-phase-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysmap-popover-phase-count{font-size:9.5px;color:var(--text4);flex-shrink:0}
.sysmap-popover-empty{font-size:10.5px;color:var(--text4);padding:8px}
.sysmap-popover-ftr{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-top:1px solid var(--border2)}
.sysmap-popover-toggle{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3)}
.sysmap-popover-expand{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--accent2);background:transparent;border:none;cursor:pointer;padding:3px 4px;border-radius:5px}
.sysmap-popover-expand:hover{background:var(--bg3);color:var(--text0)}
.sysmap-popover-icon-btn{flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;padding:3px;border-radius:5px;color:var(--text3)}
.sysmap-popover-icon-btn:hover{background:var(--bg3);color:#c77dff}
.sysmap-popover-icon-btn.on{color:#c77dff;background:var(--bg3)}
/* Panel lateral de pasos de una fase — se abre a la derecha del popover, conectado con un conector */
.sysmap-stepspanel{position:absolute;width:216px;background:var(--bg2);border:1px solid var(--border3);border-radius:var(--r-lg);box-shadow:0 14px 40px #000a;z-index:19;animation:sysdrawerIn .12s ease;overflow:hidden}
.sysmap-stepspanel-connector{position:absolute;background:var(--border4);z-index:18}
.sysmap-stepspanel-hdr{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border2);font-size:11px;font-weight:600;color:var(--text0)}
.sysmap-stepspanel-body{max-height:240px;overflow-y:auto;padding:6px}
.sysmap-stepspanel-body::-webkit-scrollbar{width:2px}
.sysmap-stepspanel-body::-webkit-scrollbar-thumb{background:var(--bg4)}
.sysmap-step-row{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;font-size:11px;color:var(--text1)}
.sysmap-step-row:hover{background:var(--bg3)}
.sysmap-step-dot{width:4px;height:4px;border-radius:50%;background:var(--text4);flex-shrink:0}
.sysmap-step-empty{font-size:10.5px;color:var(--text4);padding:8px}
/* Panel flotante de experimentos — se abre debajo del popover de fases */
.sysmap-exppanel{position:absolute;width:216px;background:var(--bg2);border:1px solid var(--border3);border-radius:var(--r-lg);box-shadow:0 14px 40px #000a;z-index:19;animation:sysdrawerIn .12s ease;overflow:hidden}
.sysmap-exppanel-hdr{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border2);font-size:11px;font-weight:600;color:var(--text0)}
.sysmap-exppanel-body{max-height:200px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.sysmap-exp-card{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:7px 8px}
.sysmap-exp-obj{font-size:11px;color:var(--text0);font-weight:500;margin-bottom:3px}
.sysmap-exp-opts{font-size:9.5px;color:var(--text3);line-height:1.4}

/* Panel de detalle de sistema — flotante vertical, anclado a la derecha */
.sysdrawer-overlay{position:fixed;inset:0;background:#00000066;z-index:500;display:flex;align-items:stretch;justify-content:flex-end;padding:20px;pointer-events:none}
.sysdrawer{width:400px;max-width:92vw;max-height:100%;background:var(--bg2);border:1px solid var(--border3);border-radius:var(--r-xl);box-shadow:0 20px 60px #000a;display:flex;flex-direction:column;animation:sysdrawerIn .16s ease;overflow:hidden;pointer-events:auto}
.sysdrawer.sysdrawer-wide{width:1100px}
.sysmap-overlay.embedded{position:relative;inset:auto;width:100%;height:100%;background:transparent;z-index:auto}
@keyframes sysdrawerIn{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
.sysdrawer-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border2);flex-shrink:0}
.sysdrawer-title{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--text0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysdrawer-body{flex:1;overflow-y:auto;padding:14px 16px 24px}
.sysdrawer-section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center}
.sysdrawer-comp-list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.sysdrawer-comp-row{display:flex;align-items:center;gap:8px;padding:4px 2px;border-radius:6px}
.sysdrawer-comp-row:hover{background:var(--bg3)}
.sysdrawer-comp-text{flex:1;min-width:0;font-size:12.5px;color:var(--text1)}
.sysdrawer-comp-text.done{text-decoration:line-through;color:var(--text3)}
.sysdrawer-exp-form{display:flex;flex-direction:column;gap:7px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-md);padding:10px;margin-bottom:10px}
.sysdrawer-exp-list{display:flex;flex-direction:column;gap:8px}
.sysdrawer-exp-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-md);padding:9px 11px}
.sysdrawer-exp-top{display:flex;align-items:flex-start;gap:6px}
.sysdrawer-exp-obj{flex:1;min-width:0;font-size:12.5px;color:var(--text0);font-weight:500}
.sysdrawer-exp-opts{display:flex;gap:6px;margin-top:7px}
.sysdrawer-opt-btn{flex:1;font-size:11px;padding:5px 7px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysdrawer-opt-btn:hover{border-color:var(--border4);color:var(--text0)}
.sysdrawer-opt-btn.win{border-color:var(--green-border);background:var(--green-bg);color:var(--green)}
.sysdrawer-exp-date{font-size:10px;color:var(--text4);margin-top:6px}
.syscycle-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.syscycle-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-md);padding:9px 11px}
.syscycle-date{font-size:11px;font-weight:600;color:var(--text0);margin-bottom:4px}
.syscycle-phases{font-size:10.5px;color:var(--text3);margin-bottom:4px}
.syscycle-exps{display:flex;flex-direction:column;gap:2px}
.syscycle-exp-row{font-size:10.5px;color:var(--text2)}

/* Fases y tareas — acordeón dentro del panel de sistema */
.sysphase{border:1px solid var(--border2);border-radius:var(--r-md);margin-bottom:6px;overflow:hidden;background:var(--bg3)}
.sysphase.dragging{opacity:.4}
.sysphase-hdr{display:flex;align-items:center;gap:6px;padding:8px 9px;cursor:pointer}
.sysphase-hdr:hover{background:var(--bg4)}
.sysphase-grip{cursor:grab;color:var(--text4);font-size:12px;flex-shrink:0;letter-spacing:-1px}
.sysphase-grip:active{cursor:grabbing}
.sysphase-name{flex:1;min-width:0;background:transparent;border:none;color:var(--text0);font-size:12.5px;font-weight:500;font-family:'Inter',sans-serif;padding:2px 0}
.sysphase-name:focus{outline:none}
.sysphase-count{font-size:10px;color:var(--text4);flex-shrink:0}
.sysphase-body{padding:2px 9px 9px 27px;border-top:1px solid var(--border2)}
.sysphase-task-row{display:flex;align-items:center;gap:7px;padding:3px 0;border-radius:5px}
.sysphase-task-row.dragging{opacity:.4}
.sysphase-task-row.drop-before{box-shadow:0 -2px 0 var(--accent)}
.sysphase-task-grip{cursor:grab;color:var(--text4);font-size:11px;flex-shrink:0;letter-spacing:-1px}
.sysphase-task-grip:active{cursor:grabbing}
.sysphase-task-text{flex:1;min-width:0;background:transparent;border:none;color:var(--text1);font-size:12px;font-family:'Inter',sans-serif;padding:2px 0}
.sysphase-task-text:focus{outline:none}
.sysphase-add-row{display:flex;align-items:center;gap:7px;padding:4px 0}
.sysphase-add-row input{flex:1;background:transparent;border:none;border-bottom:1px dashed var(--border3);color:var(--text2);font-size:12px;font-family:'Inter',sans-serif;padding:3px 0}
.sysphase-add-row input:focus{outline:none;border-color:var(--accent)}
.sysimport-box{display:flex;flex-direction:column;gap:7px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-md);padding:10px;margin-bottom:10px}
.sysimport-box textarea{width:100%;min-height:90px;background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r-sm,6px);color:var(--text1);font-size:11.5px;font-family:'JetBrains Mono',monospace;padding:7px;resize:vertical}
.sysimport-box textarea:focus{outline:none;border-color:var(--accent)}

/* Recurrence modal */
.rec-trigger{display:flex;align-items:center;gap:8px;width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:9px 11px;color:var(--text1);font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .1s}
.rec-trigger:hover{border-color:var(--border4)}
.rec-trigger span:first-of-type{flex:1;text-align:left}
.rec-clear{color:var(--text4);padding:2px 4px;border-radius:4px}
.rec-clear:hover{color:var(--text0);background:var(--bg4)}
.rec-body{display:flex;flex-direction:column;gap:14px}
.rec-type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.rec-type-btn{padding:9px 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .1s;text-align:center}
.rec-type-btn:hover{border-color:var(--border4);color:var(--text0)}
.rec-type-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.rec-section{display:flex;flex-direction:column;gap:10px}
.rec-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2)}
.rec-num{width:56px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;color:var(--text0);font-size:12.5px;font-family:'JetBrains Mono',monospace;text-align:center}
.rec-num:focus{outline:none;border-color:var(--accent)}
.rec-daychips{display:flex;gap:5px}
.rec-daychip{width:32px;height:32px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);color:var(--text3);font-size:11.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .1s}
.rec-daychip:hover{border-color:var(--border4);color:var(--text0)}
.rec-daychip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.rec-presets{display:flex;gap:6px;flex-wrap:wrap}
.rec-preset-btn{padding:5px 10px;border-radius:6px;background:transparent;border:1px solid var(--border2);color:var(--text3);font-size:10.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .1s}
.rec-preset-btn:hover{border-color:var(--accent);color:var(--accent2)}
.rec-choice{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;font-size:12.5px;color:var(--text2);transition:all .1s}
.rec-choice:hover{border-color:var(--border4)}
.rec-choice.active{border-color:var(--accent);background:var(--accent-bg);color:var(--text0)}
.rec-choice .rec-num{margin:0 2px}
.rec-radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border4);flex-shrink:0;position:relative}
.rec-choice.active .rec-radio{border-color:var(--accent)}
.rec-choice.active .rec-radio::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
.rec-divider{height:1px;background:var(--border);margin:-2px 0}
.rec-label-sm{font-size:10.5px;color:var(--text4);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.rec-summary{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text3);background:var(--bg3);border-radius:7px;padding:9px 11px}
.task-check{width:15px;height:15px;border-radius:4px;border:1px solid var(--border3);flex-shrink:0;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;justify-self:center}
.task-bell{width:18px;height:18px;display:flex;align-items:center;justify-content:center;justify-self:center;color:var(--text4);flex-shrink:0}
.task-bell.on{color:var(--red,#e6675f)}
.task-check:hover{border-color:var(--accent-border)}
.task-check.inprog{background:var(--accent-bg);border-color:var(--accent-border)}
.task-check.done{background:var(--green-bg,#3ab87a14);border-color:var(--green,#3ab87a)}
.task-name{flex:1;font-size:12.5px;color:var(--text0);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-mark-btn{font-size:9.5px;background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text2);padding:5px 0;width:100%;cursor:pointer;font-family:'Inter',sans-serif;transition:all .1s;flex-shrink:0;text-align:center}
.task-mark-btn:hover{border-color:var(--border4);color:var(--text0)}
.task-mark-btn.on{background:var(--green-bg,#3ab87a14);border-color:var(--green,#3ab87a);color:var(--green,#3ab87a)}
.task-add-row{display:flex;align-items:center;gap:6px;margin-top:10px;background:transparent;border:1px dashed var(--border3);border-radius:var(--r-md);padding:2px 6px 2px 12px;transition:all .12s}
.task-add-row:focus-within{border-color:var(--border4)}
.task-add-row .finput{flex:1;background:transparent;border:none;padding:8px 0;font-size:11px;color:var(--text2)}
.task-add-row .finput:focus{border-color:transparent}
.task-add-submit{background:transparent;border:none;color:var(--text3);font-size:15px;line-height:1;width:26px;height:26px;flex-shrink:0;cursor:pointer;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:all .12s}
.task-add-submit:hover{color:var(--accent2);background:var(--accent-bg)}
.panel-sec-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding:4px 4px 8px;display:flex;align-items:center;gap:5px}
.panel-sec-count{font-weight:400;color:var(--text4);text-transform:none;letter-spacing:0}
.panel-divider{height:1px;background:var(--border);margin:16px 0 14px}
/* MODAL TABS — línea inferior minimalista */
.modal-tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);padding:0 2px}
.modal-tab{background:transparent;border:none;color:var(--text3);font-size:12.5px;font-family:'Inter',sans-serif;padding:8px 1px 10px;cursor:pointer;position:relative;transition:color .12s}
.modal-tab:hover{color:var(--text1)}
.modal-tab.on{color:var(--accent2)}
.modal-tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
/* MODAL HEADER — avatar de proyecto */
.modal-avatar{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.modal-avatar::before{content:'';position:absolute;inset:0;background:var(--proj-color,#888);opacity:.16;border-radius:inherit}
/* COMPLETADAS — dentro de Historial */
.done-task-row{display:flex;align-items:center;gap:9px;padding:6px 4px;border-radius:var(--r-sm)}
.done-task-row:hover{background:var(--bg3)}
.done-task-row:hover .rem-del{opacity:1}
.done-task-name{flex:1;font-size:12px;color:var(--text3);text-decoration:line-through;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-task-reopen{font-size:9px;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text3);padding:3px 8px;cursor:pointer;font-family:'Inter',sans-serif;opacity:0;transition:all .1s;flex-shrink:0}
.done-task-row:hover .done-task-reopen{opacity:1}
.done-task-reopen:hover{border-color:var(--border4);color:var(--text1)}
/* HABITS WEEKLY GRID */
.habit-grid-hdr{display:grid;grid-template-columns:1fr repeat(7,22px) 52px;gap:5px;align-items:center;padding:0 2px 6px}
.habit-grid-daylbl{text-align:center;font-size:8.5px;color:var(--text4);font-weight:600}
.habit-grid-daylbl.today{color:var(--accent2)}
.habit-grid-row{display:grid;grid-template-columns:1fr repeat(7,22px) 52px;gap:5px;align-items:center;padding:5px 2px}
.habit-grid-name{font-size:11.5px;color:var(--text0);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.habit-grid-name:hover{color:var(--accent2)}
.habit-grid-cell{width:22px;height:22px;border-radius:4px;background:var(--bg1);border:1px solid var(--border2);cursor:pointer;transition:all .12s;margin:0 auto}
.habit-grid-cell:hover{border-color:var(--border4)}
.habit-grid-cell.today{border-style:dashed}
.habit-mark-btn{font-size:9px;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text3);padding:4px 0;cursor:pointer;font-family:'Inter',sans-serif;transition:all .1s}
.habit-mark-btn:hover{border-color:var(--border4);color:var(--text1)}

/* ═══════════════════════════════════════════
   PROJECT DASHBOARD — Chronos 2.0
   ═══════════════════════════════════════════ */
.dashboard-view{grid-column:1/-1;grid-row:2;overflow-y:auto;background:var(--bg0);display:flex;flex-direction:column}
.dashboard-view::-webkit-scrollbar{width:6px}
.dashboard-view::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.dash-header{padding:20px 26px 0;flex-shrink:0}
.dash-back{background:transparent;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px;padding:0 0 12px;transition:color .1s}
.dash-back:hover{color:var(--text1)}
.dash-head-row{display:flex;align-items:flex-start;gap:14px}
.dash-avatar{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.dash-avatar::before{content:'';position:absolute;inset:0;background:var(--proj-color,#888);opacity:.16;border-radius:inherit}
.dash-title-block{flex:1;min-width:0}
.dash-title-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dash-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:var(--text0);letter-spacing:-.2px}
.dash-cat-pill{font-size:10px;color:var(--text3);border:1px solid var(--border2);border-radius:20px;padding:2px 9px}
.dash-status-pill{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-radius:20px;padding:2px 9px}
.dash-status-pill.active{color:var(--green);background:var(--green-bg);border:1px solid var(--green-border)}
.dash-status-pill.archived{color:var(--text3);background:var(--bg3);border:1px solid var(--border2)}
.dash-desc{font-size:12px;color:var(--text2);margin-top:4px;max-width:640px;line-height:1.5}
.dash-meta-row{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.dash-meta-item{font-size:10.5px;color:var(--text3)}
.dash-meta-item b{color:var(--text1);font-weight:500}
.dash-head-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;align-items:center}
.dash-date-nav{display:flex;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);padding:3px 4px;margin-right:2px}
.dash-date-btn{width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dash-date-btn:hover{background:var(--bg3);color:var(--text1)}
.dash-date-lbl{font-size:10.5px;color:var(--text1);padding:0 8px;cursor:pointer;text-transform:capitalize;white-space:nowrap}
.dash-tabs{display:flex;gap:2px;padding:16px 26px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.dash-tab{background:transparent;border:none;color:var(--text3);font-size:12px;font-family:'Inter',sans-serif;padding:8px 12px 10px;cursor:pointer;position:relative;transition:color .12s;border-radius:6px 6px 0 0}
.dash-tab-icon{display:flex;align-items:center;justify-content:center;padding:9px 14px 11px}
.dash-tab-icon:hover{background:var(--bg3);color:var(--text1)}
.dash-tab-icon.on{color:var(--accent2)}
.dash-tab:hover{color:var(--text1)}
.dash-tab.on{color:var(--accent2)}
.dash-tab.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.dash-body{padding:20px 26px 100px;flex:1;display:flex;flex-direction:column;gap:18px}
.dash-stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
/* ── Bento del resumen — bloque de foco + hábitos/recordatorios/tareas/racha/actividad ── */
.bento-row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.bento-blk{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r-xl);padding:16px 18px;min-width:0}
.bento-hero{grid-column:span 7;background:linear-gradient(150deg,var(--bg2) 0%,var(--bg1) 65%)}
.bento-side{grid-column:span 5;display:flex;flex-direction:column;gap:12px}
.bento-third{grid-column:span 4}
@media (max-width:1100px){.bento-hero,.bento-side{grid-column:span 12}.bento-third{grid-column:span 6}}
.bento-eyebrow{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text3);margin-bottom:12px}
.hero-focus-row{display:flex;align-items:flex-end;gap:22px}
.hero-ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0}
.hero-ring-wrap svg{transform:rotate(-90deg)}
.hero-ring-bg{fill:none;stroke:var(--border2);stroke-width:6}
.hero-ring-fg{fill:none;stroke:var(--accent2);stroke-width:6;stroke-linecap:round}
.hero-ring-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-ring-time .t{font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:500;color:var(--text0)}
.hero-ring-time .l{font-size:8.5px;color:var(--text3);margin-top:1px}
.hero-focus-info{flex:1;min-width:0}
.hero-focus-proj{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11.5px;color:var(--text2);font-weight:500}
.hero-focus-proj .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hero-focus-task{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;color:var(--text0);line-height:1.3;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hero-focus-ctrl{display:flex;gap:8px}
.hero-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:'Inter',sans-serif}
.hero-btn-pause{background:var(--bg4);color:var(--text1);border:1px solid var(--border3)}
.hero-btn-pause:hover{background:var(--bg5)}
.hero-btn-stop{background:var(--accent2);color:var(--bg0)}
.hero-btn-stop:hover{filter:brightness(1.1)}
.hero-idle{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:8px 0}
.hero-idle-txt{font-size:13px;color:var(--text2)}
.bento-habit-dots{display:flex;gap:6px;flex-wrap:wrap}
.bhdot{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;border:1.5px solid var(--border3);color:var(--text4);cursor:pointer;flex-shrink:0}
.bhdot.on{background:var(--green);border-color:var(--green);color:var(--bg0)}
.bento-rem-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--border);font-size:12px;color:var(--text2);cursor:pointer}
.bento-rem-row:first-of-type{border-top:none;padding-top:0}
.bento-rem-row:hover{color:var(--text0)}
.bento-rem-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
.bento-tk-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--border)}
.bento-tk-row:first-of-type{border-top:none;padding-top:0}
.bento-tk-check{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--border3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--bg0)}
.bento-tk-check.done{background:var(--green);border-color:var(--green)}
.bento-tk-name{font-size:12px;color:var(--text1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.bento-tk-name.done{color:var(--text4);text-decoration:line-through}
.bento-streak-num{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;color:var(--text0);display:flex;align-items:baseline;gap:7px}
.bento-streak-num span{font-size:11px;color:var(--text3);font-weight:500}
.bento-streak-bars{display:flex;gap:4px;margin-top:12px;align-items:flex-end;height:30px}
.bento-streak-bars i{flex:1;background:var(--border2);border-radius:3px;display:block}
.bento-streak-bars i.on{background:var(--accent2)}
.bento-wk-chart{display:flex;align-items:stretch;gap:6px;height:44px;margin-top:8px}
.bento-wk-wrap{flex:1;height:100%;display:flex;align-items:flex-end}
.bento-wk-bar{width:100%;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--accent2) 0%,var(--accentd) 100%);min-height:2px}
.bento-wk-lbls{display:flex;gap:6px;margin-top:6px}
.bento-wk-lbls span{flex:1;text-align:center;font-size:9px;color:var(--text4);font-family:'JetBrains Mono',monospace}
.dash-stat-card{background:linear-gradient(155deg,var(--bg2) 0%,var(--bg1) 65%);border:1px solid var(--border2);border-radius:var(--r-xl);padding:15px 16px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;transition:border-color .15s}
.dash-stat-card:hover{border-color:var(--border3)}
.dash-stat-lbl{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-stat-val{font-size:21px;font-weight:600;color:var(--text0);font-family:'JetBrains Mono',monospace;line-height:1.15;font-variant-numeric:tabular-nums}
.dash-stat-sub{font-size:10px;color:var(--text3)}
.dash-stat-icon{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dash-stat-icon.editable{cursor:pointer;transition:transform .1s}
.dash-stat-icon.editable:hover{transform:scale(1.08)}
.stat-icon-pop{position:absolute;top:26px;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:80;padding:9px;width:190px}
.stat-icon-pop-grid{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.stat-icon-pop-item{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border2);background:var(--bg4);box-sizing:border-box;transition:all .1s}
.stat-icon-pop-reset{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--border3);border-radius:var(--r-sm);color:var(--text3);font-size:10px;padding:5px 0;cursor:pointer;font-family:'Inter',sans-serif}
.stat-icon-pop-reset:hover{color:var(--text1);border-color:var(--border4)}
.editable-label{cursor:text;display:inline-flex;align-items:center;gap:5px}
.editable-label-pencil{font-size:9px;opacity:0;color:var(--text4);transition:opacity .1s}
.editable-label:hover .editable-label-pencil{opacity:1}
.label-edit-input{background:var(--bg2);border:1px solid var(--accent-border);border-radius:4px;color:var(--text0);font-size:11px;font-weight:600;padding:1px 6px;font-family:'Inter',sans-serif;outline:none;max-width:180px}
.dash-cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
/* Fila superior del resumen: Proyectos / Notas rápidas / Hábitos, las 3 alineadas y del mismo ancho */
.dash-top-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.dash-top-row .dash-panel,.dash-top-row .qn-panel,.dash-top-row .habitos-mini-panel{width:auto;min-width:0}
@media (max-width:900px){.dash-top-row{grid-template-columns:1fr}}
.dash-panel{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r-xl);display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s}
.dash-panel:hover{border-color:var(--border3)}
.dash-panel-hdr{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);gap:8px}
.dash-panel-title{font-size:12px;font-weight:600;color:var(--text0);flex:1}
.dash-panel-title.panel-icon{display:inline-flex;align-items:center;flex:0 0 auto;color:var(--text2);cursor:default}
.dash-panel-link{font-size:10px;color:var(--accent2);background:transparent;border:none;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:3px}
.dash-panel-link:hover{opacity:.7}
.dash-panel-body{padding:6px 8px;display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto}
.dash-panel-body::-webkit-scrollbar{width:3px}
.dash-panel-body::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}
.dash-timeline-row{display:flex;gap:14px;align-items:stretch}
.dash-timeline-row .dash-timeline-wrap{flex:1;min-width:0}
.qn-panel{width:280px;flex-shrink:0;background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden}
.qn-hdr{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);gap:8px}
.qn-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.qn-input{display:flex;gap:6px}
.qn-input input{flex:1;font-size:11.5px}
.qn-list{display:flex;flex-direction:column;overflow-y:auto;max-height:180px}
.qn-list::-webkit-scrollbar{width:3px}
.qn-list::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}
.qn-item{display:flex;flex-direction:column;gap:6px;font-size:11.5px;line-height:1.4;padding:6px 2px;border-bottom:1px solid var(--border)}
.qn-item:last-child{border-bottom:none}
.qn-item-row{display:flex;align-items:flex-start;gap:7px}
.qn-item-check{flex-shrink:0;width:14px;height:14px;margin-top:1px;border-radius:4px;border:1px solid var(--border3);background:transparent;color:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;transition:all .12s;padding:0}
.qn-item-check:hover{border-color:var(--green-border);color:var(--green)}
.qn-item-text-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qn-item-text{white-space:pre-wrap;word-break:break-word;color:var(--text1)}
.qn-item-remind{font-size:9.5px;color:var(--amber);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:3px}
.qn-item-clock{flex-shrink:0;width:14px;height:14px;margin-top:1px;border:none;background:transparent;color:var(--text4);cursor:pointer;opacity:0;transition:opacity .12s,color .12s;padding:0;display:flex;align-items:center;justify-content:center}
.qn-item:hover .qn-item-clock{opacity:1}
.qn-item-clock:hover{color:var(--amber)}
.qn-item-clock.on{opacity:1;color:var(--amber)}
.qn-remind-row{display:flex;align-items:center;gap:6px;padding-left:21px}
.qn-remind-input{flex:1;min-width:0;font-size:10.5px;padding:5px 6px;color-scheme:dark}
.qn-datepop{position:fixed;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-md);box-shadow:0 10px 28px rgba(0,0,0,.45);z-index:200;padding:10px;display:flex;flex-direction:column;gap:8px}
.qn-datepop-chips{display:flex;gap:6px;flex-wrap:wrap}
.qn-chip{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:11px;padding:5px 10px;border-radius:999px;cursor:pointer;transition:all .12s;font-family:'Inter',sans-serif}
.qn-chip:hover{background:var(--bg4);color:var(--text0)}
.qn-chip.sel{background:var(--accent2,#4a9de0);border-color:var(--accent2,#4a9de0);color:#fff}
.qn-chip-time{padding:5px 9px;font-family:'JetBrains Mono',monospace;font-size:10.5px}
.qn-datepop-custom{display:flex;gap:6px}
.qn-datepop-input{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text1);font-size:11px;padding:5px 7px;color-scheme:dark;font-family:'JetBrains Mono',monospace}
.qn-datepop-time{flex:0 0 84px}
.qn-datepop-actions{display:flex;align-items:center;gap:6px;padding-top:2px;border-top:1px solid var(--border);margin-top:2px}
.qn-datepop-remove{background:transparent;border:none;color:var(--text4);font-size:10.5px;cursor:pointer;padding:0}
.qn-datepop-remove:hover{color:var(--red,#e05555)}
.qn-item-del{flex-shrink:0;background:transparent;border:none;color:var(--text4);cursor:pointer;font-size:10.5px;padding:0 2px;opacity:0;transition:opacity .12s;margin-top:1px}
.qn-item:hover .qn-item-del{opacity:1}
.qn-item-del:hover{color:var(--red,#e05555)}
@media (max-width:900px){.dash-timeline-row{flex-direction:column}.qn-panel{width:auto}}

<script>
const{useState,useEffect,useRef,useCallback,useMemo}=React;

const e=React.createElement;

// ── SOUNDS ──
const SOUNDS={
  chime:{label:'Chime',freq:880,type:'sine',dur:0.6},
  gentle:{label:'Gentle',freq:528,type:'sine',dur:0.8},
  nudge:{label:'Nudge',freq:660,type:'triangle',dur:0.3},
  bell:{label:'Bell',freq:1046,type:'sine',dur:1.0},
  soft:{label:'Soft',freq:440,type:'sine',dur:0.5},
};

// UI micro-sounds — independent from notification sounds
// Each has hover + click variants
const UI_SOUNDS = {
  none:    { label: 'Ninguno' },
  clack:   { label: 'Clack' },        // keyboard-like
  wood:    { label: 'Madera' },        // muted wood tap
  glass:   { label: 'Cristal' },       // glassy ping
  plastic: { label: 'Plástico' },      // soft plastic
  sine:    { label: 'Suave' },         // smooth sine blip
  tick:    { label: 'Reloj' },         // clock tick
  drop:    { label: 'Gota' },          // water drop
  pop:     { label: 'Pop' },           // bubble pop
  metal:   { label: 'Metal' },         // metallic ping
  thump:   { label: 'Golpe' },         // deep thump
};

// Global UI sound config — read by playUI(), written by SoundCfgModal
let _uiSoundCfg = { hoverSound:'clack', clickSound:'glass', uiVol:0.25, uiEnabled:true };
function setUISoundCfg(cfg){ _uiSoundCfg = cfg; }

function _uiTone(ctx, now, type, freq, vol, dur){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.connect(g); g.connect(getMasterBus(ctx));
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.start(now); osc.stop(now + dur);
}

let _uiClickGuard=false;
function playUI(kind){ // kind: 'hover' | 'click'
  if(kind==='click') _uiClickGuard=true; // evita que el listener global lo repita
  if(!_uiSoundCfg.uiEnabled) return;
  const key = kind === 'hover' ? _uiSoundCfg.hoverSound : _uiSoundCfg.clickSound;
  if(!key || key === 'none') return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  const vol = Math.min(1, Math.max(0.001, _uiSoundCfg.uiVol));
  const resume = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
  resume.then(()=>{
    const now = ctx.currentTime;
    if(key === 'clack'){
      // Short noise burst — simulates a keyboard key
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.03, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
      const src = ctx.createBufferSource();
      const filt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      src.buffer = buf;
      filt.type = 'bandpass'; filt.frequency.value = kind==='hover'?3200:2400; filt.Q.value=1.2;
      src.connect(filt); filt.connect(g); g.connect(getMasterBus(ctx));
      g.gain.setValueAtTime(vol*(kind==='hover'?0.55:1), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.04);
      src.start(now);
    } else if(key === 'wood'){
      // Low thud — bandpassed noise + sine
      const buf = ctx.createBuffer(1, ctx.sampleRate*0.05, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length)**2;
      const src = ctx.createBufferSource();
      const filt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      src.buffer=buf; filt.type='lowpass'; filt.frequency.value=300;
      src.connect(filt); filt.connect(g); g.connect(getMasterBus(ctx));
      g.gain.setValueAtTime(vol*(kind==='hover'?0.4:0.85), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.06);
      src.start(now);
      _uiTone(ctx, now, 'sine', kind==='hover'?180:140, vol*0.3*(kind==='hover'?0.4:1), 0.05);
    } else if(key === 'glass'){
      // High-pitch sine blip with quick decay
      const f = kind==='hover' ? 1600 : 1200;
      _uiTone(ctx, now, 'sine', f, vol*(kind==='hover'?0.4:0.9), kind==='hover'?0.07:0.12);
      if(kind==='click') _uiTone(ctx, now+0.02, 'sine', f*0.75, vol*0.4, 0.1);
    } else if(key === 'plastic'){
      // Mid-range soft click
      const buf = ctx.createBuffer(1, ctx.sampleRate*0.025, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length)**1.5;
      const src = ctx.createBufferSource();
      const filt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      src.buffer=buf; filt.type='bandpass'; filt.frequency.value=1800; filt.Q.value=0.8;
      src.connect(filt); filt.connect(g); g.connect(getMasterBus(ctx));
      g.gain.setValueAtTime(vol*(kind==='hover'?0.3:0.75), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.035);
      src.start(now);
    } else if(key === 'sine'){
      // Smooth minimal blip
      const f = kind==='hover' ? 540 : 480;
      _uiTone(ctx, now, 'sine', f, vol*(kind==='hover'?0.25:0.6), kind==='hover'?0.06:0.1);

    } else if(key === 'tick'){
      // Clock tick — two-layer noise transient, very short
      const len = ctx.sampleRate * 0.018;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.18));
      const src=ctx.createBufferSource(), filt=ctx.createBiquadFilter(), g=ctx.createGain();
      src.buffer=buf; filt.type='highpass'; filt.frequency.value=kind==='hover'?5000:4200;
      src.connect(filt); filt.connect(g); g.connect(getMasterBus(ctx));
      g.gain.setValueAtTime(vol*(kind==='hover'?0.5:0.9), now);
      src.start(now);
      // soft sub-click underneath
      _uiTone(ctx, now, 'sine', kind==='hover'?800:600, vol*0.15, 0.015);

    } else if(key === 'drop'){
      // Water drop — fast pitch-drop sine
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(getMasterBus(ctx));
      osc.type='sine';
      const f0=kind==='hover'?1400:1100, f1=kind==='hover'?600:400;
      const dur=kind==='hover'?0.09:0.14;
      osc.frequency.setValueAtTime(f0, now);
      osc.frequency.exponentialRampToValueAtTime(f1, now+dur);
      g.gain.setValueAtTime(vol*(kind==='hover'?0.35:0.75), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
      osc.start(now); osc.stop(now+dur);

    } else if(key === 'pop'){
      // Bubble pop — very short sine with hard attack
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(getMasterBus(ctx));
      osc.type='sine';
      const f=kind==='hover'?320:220;
      osc.frequency.setValueAtTime(f*2.5, now);
      osc.frequency.exponentialRampToValueAtTime(f, now+0.025);
      g.gain.setValueAtTime(vol*(kind==='hover'?0.4:0.85), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.055);
      osc.start(now); osc.stop(now+0.06);
      // noise burst on click
      if(kind==='click'){
        const len=ctx.sampleRate*0.012, buf=ctx.createBuffer(1,len,ctx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
        const src2=ctx.createBufferSource(), g2=ctx.createGain();
        src2.buffer=buf; src2.connect(g2); g2.connect(getMasterBus(ctx));
        g2.gain.setValueAtTime(vol*0.3, now); src2.start(now);
      }

    } else if(key === 'metal'){
      // Metallic ping — triangle wave + detuned overtone
      const dur=kind==='hover'?0.08:0.18;
      const f=kind==='hover'?2200:1800;
      _uiTone(ctx, now, 'triangle', f, vol*(kind==='hover'?0.3:0.7), dur);
      _uiTone(ctx, now+0.004, 'triangle', f*1.34, vol*(kind==='hover'?0.12:0.3), dur*0.7);
      // short noise transient attack
      const len=ctx.sampleRate*0.008, buf=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=ctx.createBufferSource(), filt=ctx.createBiquadFilter(), g=ctx.createGain();
      src.buffer=buf; filt.type='bandpass'; filt.frequency.value=3500; filt.Q.value=2;
      src.connect(filt); filt.connect(g); g.connect(getMasterBus(ctx));
      g.gain.setValueAtTime(vol*(kind==='hover'?0.2:0.5), now); src.start(now);

    } else if(key === 'thump'){
      // Deep thump — low sine with fast decay + body noise
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(getMasterBus(ctx));
      osc.type='sine';
      const f=kind==='hover'?90:65;
      osc.frequency.setValueAtTime(f*3, now);
      osc.frequency.exponentialRampToValueAtTime(f, now+0.04);
      g.gain.setValueAtTime(vol*(kind==='hover'?0.45:0.9), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+(kind==='hover'?0.07:0.12));
      osc.start(now); osc.stop(now+0.15);
      // body noise
      const len=ctx.sampleRate*0.05, buf=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length)**1.5;
      const src=ctx.createBufferSource(), filt=ctx.createBiquadFilter(), g2=ctx.createGain();
      src.buffer=buf; filt.type='lowpass'; filt.frequency.value=200;
      src.connect(filt); filt.connect(g2); g2.connect(getMasterBus(ctx));
      g2.gain.setValueAtTime(vol*(kind==='hover'?0.2:0.5), now);
      g2.gain.exponentialRampToValueAtTime(0.0001, now+0.05); src.start(now);
    }
  }).catch(()=>{});
}
let _audioCtx=null;
let _masterBus=null;
function getAudioCtx(){
  if(!_audioCtx||_audioCtx.state==='closed'){
    try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();_masterBus=null;}catch(e){return null;}
  }
  return _audioCtx;
}
// Limitador maestro — todos los sonidos (recordatorios + micro-sonidos UI) pasan
// por un compresor + gain de salida para que, si suenan dos al mismo tiempo,
// no se distorsionen ni se "reventen".
function getMasterBus(ctx){
  if(!_masterBus||_masterBus.context!==ctx){
    const comp=ctx.createDynamicsCompressor();
    const now=ctx.currentTime;
    try{
      comp.threshold.setValueAtTime(-20,now);
      comp.knee.setValueAtTime(22,now);
      comp.ratio.setValueAtTime(14,now);
      comp.attack.setValueAtTime(0.002,now);
      comp.release.setValueAtTime(0.22,now);
    }catch(err){}
    const g=ctx.createGain();
    g.gain.value=0.88;
    comp.connect(g); g.connect(ctx.destination);
    _masterBus=comp;
  }
  return _masterBus;
}
// Espaciador de recordatorios — si dos avisos se disparan casi juntos, el
// segundo espera un mínimo de tiempo en vez de sonar encima del primero.
let _nextSoundSlot=0;
function playSound(key,vol){
  vol=vol!=null?vol:0.5;
  const ctx=getAudioCtx();
  if(!ctx)return;
  const MIN_GAP=300; // ms
  const nowMs=Date.now();
  const slot=Math.max(nowMs,_nextSoundSlot);
  _nextSoundSlot=slot+MIN_GAP;
  const wait=slot-nowMs;
  if(wait>0){setTimeout(()=>_playSoundNow(ctx,key,vol),wait);}else{_playSoundNow(ctx,key,vol);}
}
function _playSoundNow(ctx,key,vol){
  const resume=ctx.state==='suspended'?ctx.resume():Promise.resolve();
  resume.then(()=>{
    const s=SOUNDS[key]||SOUNDS.chime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(getMasterBus(ctx));
    osc.type=s.type||'sine';
    osc.frequency.setValueAtTime(s.freq,ctx.currentTime);
    gain.gain.setValueAtTime(Math.min(1,Math.max(0.01,vol)),ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s.dur);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+s.dur);
    if(key==='chime'||key==='bell'){
      const osc2=ctx.createOscillator();
      const gain2=ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(getMasterBus(ctx));
      osc2.type='sine';
      osc2.frequency.setValueAtTime(s.freq*1.5,ctx.currentTime+0.08);
      gain2.gain.setValueAtTime(Math.min(1,Math.max(0.01,vol*0.6)),ctx.currentTime+0.08);
      gain2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+s.dur*0.8);
      osc2.start(ctx.currentTime+0.08);
      osc2.stop(ctx.currentTime+s.dur);
    }
  }).catch(()=>{});
}

// ── SUPABASE SYNC ENGINE ──
// Table: chronos(user_id text PK, data jsonb, updated_at timestamptz)
// Zero OAuth — paste URL + anon key once, syncs forever automatically.
const SB = {
  K_URL: 'sb_url', K_ANON: 'sb_anon', K_UID: 'sb_uid',
  _load(k){ try{ return localStorage.getItem(k)||''; }catch{ return ''; } },
  _save(k,v){ try{ localStorage.setItem(k,v); }catch{} },

  get url(){ return this._load(this.K_URL); },
  get anon(){ return this._load(this.K_ANON); },
  get uid(){ return this._load(this.K_UID); },
  configured(){ return !!(this.url && this.anon && this.uid); },

  init(){
    return this.configured();
  },

  configure(url, anon){
    const cleanUrl = url.replace(/\/+$/,'');
    const uid = anon.slice(-16); // stable uid from anon key
    this._save(this.K_URL, cleanUrl);
    this._save(this.K_ANON, anon);
    this._save(this.K_UID, uid);
  },

  async push(data){
    if(!this.configured()) return;
    const resp = await fetch(`${this.url}/rest/v1/chronos`, {
      method: 'POST',
      headers: {
        'apikey': this.anon,
        'Authorization': 'Bearer '+this.anon,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates',
      },
      body: JSON.stringify({ user_id: this.uid, data, updated_at: new Date().toISOString() }),
    });
    if(!resp.ok) throw new Error(await resp.text());
  },

  async pull(){
    if(!this.configured()) return null;
    const resp = await fetch(`${this.url}/rest/v1/chronos?user_id=eq.${this.uid}&select=data`, {
      headers: { 'apikey': this.anon, 'Authorization': 'Bearer '+this.anon },
    });
    if(!resp.ok) throw new Error(await resp.text());
    const rows = await resp.json();
    return rows.length > 0 ? rows[0].data : null;
  },

  disconnect(){
    [this.K_URL, this.K_ANON, this.K_UID].forEach(k=>this._save(k,''));
  },

  // ── DIRTY/SYNCED TRACKING ──
  // Guarda cuándo hubo un cambio local pendiente de subir (markDirty) y cuándo
  // se confirmó que ese cambio llegó a Supabase (markSynced). Esto evita que,
  // al recargar la página antes de que termine el push de 3s (o el de
  // beforeunload), el pull inicial reemplace el estado local recién guardado
  // en localStorage con datos remotos más viejos — la causa de que hábitos
  // (u otros datos) marcados justo antes de recargar "desaparezcan".
  K_DIRTY: 'chr4_dirty_at', K_SYNCED: 'chr4_synced_at',
  markDirty(){ this._save(this.K_DIRTY, String(Date.now())); },
  markSynced(){ this._save(this.K_SYNCED, String(Date.now())); },
  isDirty(){
    const d=Number(this._load(this.K_DIRTY)||0);
    const s=Number(this._load(this.K_SYNCED)||0);
    return d>s;
  },
};

// ═══════════════════════════════════════════
// HABITS — recurrence helpers
// ═══════════════════════════════════════════
function dayKeyFromTs(ts){const d=new Date(new Date(ts).toLocaleString('en-US',{timeZone:'America/Santiago'}));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateFromDayKey(k){return new Date(k+'T12:00:00Z');}

// ═══════════════════════════════════════════
// TASK RECURRENCE ENGINE
// ═══════════════════════════════════════════
function addDaysToKey(dateStr,n){
  const d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysInMonthOf(y,m){ return new Date(y,m+1,0).getDate(); } // m is 0-indexed
function dateKeyOf(y,m,day){ return `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }
// Returns the date-key (YYYY-MM-DD) of the Nth business day (mon-fri) of month m (0-indexed) / year y.
// Weekends only are excluded (no holiday calendar). If n exceeds the number of business days
// in the month, falls back to the last business day found.
function nthBusinessDayOfMonthKey(y,m,n){
  const totalDays=daysInMonthOf(y,m);
  let count=0,lastBiz=null;
  for(let day=1;day<=totalDays;day++){
    const dow=new Date(y,m,day).getDay();
    if(dow!==0&&dow!==6){
      count++;
      lastBiz=day;
      if(count===Math.max(1,n||1))return dateKeyOf(y,m,day);
    }
  }
  return dateKeyOf(y,m,lastBiz||totalDays);
}
function weekdayKeyOf(dateStr){ const d=new Date(dateStr+'T00:00:00'); return DOW_KEYS[d.getDay()]; }
function mondayOfWeekKey(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=d.getDay();
  d.setDate(d.getDate()+(dow===0?-6:1-dow));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weeksBetweenKeys(mondayA,mondayB){
  const a=new Date(mondayA+'T00:00:00').getTime();
  const b=new Date(mondayB+'T00:00:00').getTime();
  return Math.round((b-a)/(7*86400000));
}
// Given the date a task last occurred on, returns the next occurrence date per its recurrence rule
function computeNextOccurrence(fromDateStr,rec){
  if(!rec||rec.type==='none')return null;
  if(rec.type==='daily'){
    return addDaysToKey(fromDateStr,Math.max(1,rec.interval||1));
  }
  if(rec.type==='weekly'){
    const days=(rec.days&&rec.days.length)?rec.days:[weekdayKeyOf(fromDateStr)];
    const interval=Math.max(1,rec.interval||1);
    const anchorMonday=mondayOfWeekKey(fromDateStr);
    for(let i=1;i<=7*interval*8;i++){
      const cand=addDaysToKey(fromDateStr,i);
      if(!days.includes(weekdayKeyOf(cand)))continue;
      if(weeksBetweenKeys(anchorMonday,mondayOfWeekKey(cand))%interval===0)return cand;
    }
    return addDaysToKey(fromDateStr,7*interval);
  }
  if(rec.type==='monthly'){
    const d=new Date(fromDateStr+'T00:00:00');
    let y=d.getFullYear(),m=d.getMonth()+1;
    if(m>11){m=0;y++;}
    if(rec.monthMode==='first')return dateKeyOf(y,m,1);
    if(rec.monthMode==='last')return dateKeyOf(y,m,daysInMonthOf(y,m));
    if(rec.monthMode==='bizday')return nthBusinessDayOfMonthKey(y,m,rec.bizDayN||1);
    const day=Math.min(rec.monthDay||d.getDate(),daysInMonthOf(y,m));
    return dateKeyOf(y,m,day);
  }
  return null;
}
// ── FASES — registro de actividad diaria + tareas internas pendientes ──
// La campanita ya no depende solo de la fecha término. Se activa desde que la
// fase arranca (fecha inicio) mientras tenga tareas internas sin completar,
// y se apaga para el día de hoy en cuanto registras ✓ o ✕ de actividad.
function stepActedToday(s,dateKey){ return !!(s.actLog&&s.actLog[dateKey]); }
function stepHasPendingWork(s){
  const subs=s.subtasks||[];
  if(subs.length>0) return subs.some(t=>!t.done); // hay tareas internas sin marcar
  return !s.done; // sin desglose interno: se guía por el estado de la fase misma
}
function stepNeedsAction(s,dateKey,taskActedToday){
  if(s.done||!s.dueDate)return false;
  const start=s.startDate||s.dueDate;
  if(dateKey<start)return false; // la fase todavía no empieza
  if(taskActedToday)return false; // ya registraste avance/no-avance hoy a nivel de proyecto
  if(stepActedToday(s,dateKey))return false; // compat con registros antiguos por fase
  return stepHasPendingWork(s);
}
// Sugiere una fecha de término automática para una fase nueva: continúa donde
// terminó la fase anterior (+3 días de duración por defecto). Siempre editable a mano.
function suggestPhaseDate(existingSteps){
  const dated=(existingSteps||[]).filter(s=>s.dueDate).sort((a,b)=>a.dueDate<b.dueDate?1:-1);
  const base=dated[0]?new Date(dated[0].dueDate+'T00:00:00'):new Date();
  base.setDate(base.getDate()+3);
  return `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(base.getDate()).padStart(2,'0')}`;
}

// Short, human-readable Spanish summary of a recurrence rule, e.g. "Cada 2 semanas · lunes y jueves"
function recurrenceLabel(rec){
  if(!rec||rec.type==='none')return'No se repite';
  if(rec.type==='daily'){
    const n=rec.interval||1;
    return n===1?'Cada día':'Cada '+n+' días';
  }
  if(rec.type==='weekly'){
    const n=rec.interval||1;
    const set=new Set(rec.days||[]);
    const isWeekdays=['mon','tue','wed','thu','fri'].every(k=>set.has(k))&&set.size===5;
    const isWeekend=set.size===2&&set.has('sat')&&set.has('sun');
    const isAll=set.size===7;
    let daysTxt='';
    if(isAll)daysTxt='todos los días';
    else if(isWeekdays)daysTxt='de lunes a viernes';
    else if(isWeekend)daysTxt='fines de semana';
    else{
      const labels=WEEK_DAYS.filter(w=>set.has(w.k)).map(w=>w.full);
      if(labels.length===1)daysTxt=labels[0];
      else if(labels.length>1)daysTxt=labels.slice(0,-1).join(', ')+' y '+labels[labels.length-1];
    }
    return(n===1?'Cada semana':'Cada '+n+' semanas')+(daysTxt?' · '+daysTxt:'');
  }
  if(rec.type==='monthly'){
    if(rec.monthMode==='first')return'El primer día de cada mes';
    if(rec.monthMode==='last')return'El último día de cada mes';
    if(rec.monthMode==='bizday')return'El '+(rec.bizDayN||1)+'° día hábil de cada mes';
    return'El día '+(rec.monthDay||1)+' de cada mes';
  }
  return'';
}
// Builds the next occurrence of a recurring task: fresh id, next due date per its
// recurrence rule, steps carried over as a reset checklist (all marked pending again)
function spawnNextTaskOccurrence(task){
  if(!task.recurrence||task.recurrence.type==='none')return null;
  const fromDate=task.dueDate||dayKey();
  const nextDate=computeNextOccurrence(fromDate,task.recurrence);
  if(!nextDate)return null;
  return{
    id:uid(),
    projectId:task.projectId,
    name:task.name,
    status:'pending',
    priority:task.priority||'mid',
    createdAt:Date.now(),
    dueDate:nextDate,
    recurrence:task.recurrence,
    steps:(task.steps||[]).map(s=>({...s,id:uid(),done:false}))
  };
}

const WEEK_DAYS=[
  {k:'mon',l:'L',full:'lunes'},{k:'tue',l:'M',full:'martes'},{k:'wed',l:'X',full:'miércoles'},
  {k:'thu',l:'J',full:'jueves'},{k:'fri',l:'V',full:'viernes'},{k:'sat',l:'S',full:'sábado'},{k:'sun',l:'D',full:'domingo'}
];
const DOW_KEYS=['sun','mon','tue','wed','thu','fri','sat']; // matches Date.getDay()
const MONTHS_SHORT=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const ORDINAL_LABELS={1:'primer',2:'segundo',3:'tercer',4:'cuarto',last:'último'};
const ORDINAL_SHORT={1:'1er',2:'2do',3:'3er',4:'4to',last:'Últ.'};

function nthWeekdayInfo(date){
  const d=date.getDate();
  const ordinal=Math.ceil(d/7);
  const lastDateOfMonth=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
  const isLast=(d+7)>lastDateOfMonth;
  return{ordinal,isLast};
}

// Habit recurrence now shares the exact same engine as task recurrence
// (none/daily/weekly/monthly with interval, days, monthMode, monthDay).
// habitOccursOn keeps legacy branches (monthly_date/monthly_ordinal) so
// habits saved before this change keep working.
// Un recordatorio con fecha (nota rápida de proyecto con remindAt) cuenta
// como "pendiente" — misma vara que un hábito o una tarea vencida — desde
// que su fecha/hora ya pasó, hasta que se marca hecho o se le quita la fecha.
function noteReminderDue(n){
  return!!(n&&n.remindAt&&!n.remindDone&&!n.done&&n.remindAt<=Date.now());
}
function habitOccursOn(habit,date){
  const r=habit.recurrence;
  if(!r||r.type==='none')return false;
  const y=date.getFullYear(),mo=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');
  const dateKey=`${y}-${mo}-${d}`;

  // ── legacy shapes ──
  if(r.type==='monthly_date'){
    if(r.day==='last'){
      const lastDate=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
      return date.getDate()===lastDate;
    }
    return date.getDate()===Number(r.day);
  }
  if(r.type==='monthly_ordinal'){
    if(DOW_KEYS[date.getDay()]!==r.weekday) return false;
    const{ordinal,isLast}=nthWeekdayInfo(date);
    return r.ordinal==='last'?isLast:ordinal===Number(r.ordinal);
  }

  // ── current shape (same as task recurrence) ──
  const anchorKey=habit.createdAt?dayKeyFromTs(habit.createdAt):dateKey;
  if(r.type==='daily'){
    const n=Math.max(1,r.interval||1);
    const diff=Math.round((new Date(dateKey+'T00:00:00')-new Date(anchorKey+'T00:00:00'))/86400000);
    return ((diff%n)+n)%n===0;
  }
  if(r.type==='weekly'){
    const days=(r.days&&r.days.length)?r.days:[weekdayKeyOf(anchorKey)];
    if(!days.includes(DOW_KEYS[date.getDay()]))return false;
    const n=Math.max(1,r.interval||1);
    const diffWeeks=weeksBetweenKeys(mondayOfWeekKey(anchorKey),mondayOfWeekKey(dateKey));
    return ((diffWeeks%n)+n)%n===0;
  }
  if(r.type==='monthly'){
    const lastDate=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
    if(r.monthMode==='first')return date.getDate()===1;
    if(r.monthMode==='last')return date.getDate()===lastDate;
    if(r.monthMode==='bizday')return dateKey===nthBusinessDayOfMonthKey(date.getFullYear(),date.getMonth(),r.bizDayN||1);
    const day=Math.min(r.monthDay||1,lastDate);
    return date.getDate()===day;
  }
  return false;
}

// ═══════════════════════════════════════════
// PANEL ORDERING — "lo más próximo a terminar hoy primero, si no hay
// nada pendiente sigue en orden cronológico"
// Cada tipo de ítem expone una marca de tiempo "efectiva" (próxima fecha en
// que vence/toca hacerse). sortByProximity ordena ascendente por esa marca;
// los ítems sin ninguna fecha quedan al final, ordenados por fecha de creación.
// ═══════════════════════════════════════════
function sortByProximity(list,getDueTs,getCreatedTs){
  return[...list].sort((a,b)=>{
    const da=getDueTs(a),db=getDueTs(b);
    const aHas=da!=null,bHas=db!=null;
    if(aHas&&bHas)return da-db;
    if(aHas&&!bHas)return -1;
    if(!aHas&&bHas)return 1;
    return(getCreatedTs(a)||0)-(getCreatedTs(b)||0);
  });
}
// Aplica uno de los modos de orden disponibles para un panel (proximidad,
// alfabético, más recientes, completadas primero, pendientes primero).
const PANEL_SORT_OPTIONS=[
  {k:'todayFirst',label:'Pendiente hoy primero'},
  {k:'proximity',label:'Más próximas a vencer'},
  {k:'alpha',label:'Orden alfabético'},
  {k:'recent',label:'Más recientes primero'},
  {k:'done',label:'Completadas primero'},
  {k:'pending',label:'Pendientes primero'},
];
const SYSTEM_SORT_OPTIONS=[
  {k:'sequence',label:'Orden de la plantilla (secuencia)'},
  ...PANEL_SORT_OPTIONS
];
function applySortMode(list,mode,cfg){
  const{getDueTs,getCreatedTs,getName,getDone,getOrder}=cfg;
  const arr=[...list];
  if(mode==='sequence'&&getOrder)return arr.sort((a,b)=>{
    const oa=getOrder(a),ob=getOrder(b);
    if(oa==null&&ob==null)return (getCreatedTs(a)||0)-(getCreatedTs(b)||0);
    if(oa==null)return 1;
    if(ob==null)return -1;
    return oa-ob;
  });
  if(mode==='alpha')return arr.sort((a,b)=>(getName(a)||'').localeCompare(getName(b)||'','es',{sensitivity:'base'}));
  if(mode==='recent')return arr.sort((a,b)=>(getCreatedTs(b)||0)-(getCreatedTs(a)||0));
  if(mode==='done')return arr.sort((a,b)=>((getDone(b)?1:0)-(getDone(a)?1:0))||((getCreatedTs(a)||0)-(getCreatedTs(b)||0)));
  if(mode==='pending')return arr.sort((a,b)=>((getDone(a)?1:0)-(getDone(b)?1:0))||((getCreatedTs(a)||0)-(getCreatedTs(b)||0)));
  return sortByProximity(arr,getDueTs,getCreatedTs);
}
function taskDueTs(t){
  if(!t.dueDate)return null;
  return new Date(t.dueDate+'T12:00:00').getTime();
}
function systemDueTs(s){
  if(s.status==='paused')return null;
  return s.nextRun||null;
}
// Próxima ocurrencia pendiente de un hábito (hoy o en el futuro más cercano),
// combinada con su hora programada — así "las 9am" ordena antes que "las 6pm".
function nextHabitDueTs(h){
  const log=h.log||[];
  const base=new Date();base.setHours(0,0,0,0);
  for(let i=0;i<366;i++){
    const d=new Date(base.getTime()+i*86400000);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(habitOccursOn(h,d)&&!log.includes(key)){
      const[hh,mm]=(h.time||'09:00').split(':').map(Number);
      const dt=new Date(d);dt.setHours(hh||0,mm||0,0,0);
      return dt.getTime();
    }
  }
  return null;
}

function habitDaysLabel(h){
  const r=h.recurrence||{};
  if(r.type==='monthly_date') return r.day==='last'?'Último día':'Día '+r.day;
  if(r.type==='monthly_ordinal'){
    const wd=WEEK_DAYS.find(w=>w.k===r.weekday);
    return (ORDINAL_SHORT[r.ordinal]||r.ordinal)+' '+(wd?wd.l:'');
  }
  if(r.type==='daily'){
    const n=r.interval||1;
    return n===1?'Diario':'Cada '+n+'d';
  }
  if(r.type==='weekly'){
    if(!(r.days||[]).length) return '—';
    return WEEK_DAYS.filter(w=>r.days.includes(w.k)).map(w=>w.l).join(' · ');
  }
  if(r.type==='monthly'){
    if(r.monthMode==='first')return'1er día';
    if(r.monthMode==='last')return'Último día';
    if(r.monthMode==='bizday')return(r.bizDayN||1)+'° hábil';
    return'Día '+(r.monthDay||1);
  }
  return '—';
}

// Last time a habit was marked done, formatted dd-mm-yyyy (or 'Nunca')
function habitLastDoneLabel(log){
  if(!log||!log.length) return 'Nunca';
  const last=log.slice().sort().slice(-1)[0];
  const[y,m,d]=last.split('-');
  return d+'-'+m+'-'+y;
}

function habitSummary(rec,time){
  if(!rec||rec.type==='none')return'Elige cada cuánto se repite';
  return recurrenceLabel(rec)+', a las '+time;
}

function currentWeekDays(){
  // Returns array of 7 {key:'YYYY-MM-DD', label:'L'...} from Monday to Sunday, based on today (America/Santiago)
  const today=nowSCL();
  const dow=today.getDay(); // 0=sun..6=sat
  const mondayOffset=dow===0?-6:1-dow;
  const monday=new Date(today);monday.setDate(today.getDate()+mondayOffset);
  return WEEK_DAYS.map((w,i)=>{
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    return{key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,label:w.l,dowKey:w.k,isToday:dayKeyFromTs(d.getTime())===dayKey()};
  });
}

function CommandPalette({open,onClose,projects,onOpenProject,setView,onNewProject,onNewTask,activeProjects}){
  const[q,setQ]=useState('');
  const[sel,setSel]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{ if(open){ setQ(''); setSel(0); requestAnimationFrame(()=>inputRef.current&&inputRef.current.focus()); } },[open]);
  const items=useMemo(()=>{
    const list=[
      {group:'Ir a',icon:'⌂',label:'Inicio',action:()=>setView('home')},
      {group:'Ir a',icon:'📊',label:'Analíticas',action:()=>setView('analytics')},
      {group:'Acciones',icon:'＋',label:'Nuevo proyecto',action:onNewProject},
      ...(activeProjects||projects.filter(p=>p.status!=='archived')).map(p=>({
        group:'Proyectos',icon:'●',iconColor:p.color,label:p.name,action:()=>onOpenProject(p.id)
      }))
    ];
    const query=q.trim().toLowerCase();
    if(!query)return list;
    return list.filter(it=>it.label.toLowerCase().includes(query));
  },[q,projects,activeProjects]);
  const grouped=useMemo(()=>{
    const out=[];
    let lastGroup=null;
    items.forEach(it=>{ if(it.group!==lastGroup){out.push({isGroup:true,label:it.group});lastGroup=it.group;} out.push(it); });
    return out;
  },[items]);
  const flatSelectable=items;
  function runSel(idx){ const it=flatSelectable[idx]; if(it){ it.action(); onClose(); } }
  function onKeyDown(ev){
    if(ev.key==='ArrowDown'){ev.preventDefault();setSel(s=>Math.min(flatSelectable.length-1,s+1));}
    else if(ev.key==='ArrowUp'){ev.preventDefault();setSel(s=>Math.max(0,s-1));}
    else if(ev.key==='Enter'){ev.preventDefault();runSel(sel);}
  }
  if(!open)return null;
  let runningIdx=-1;
  return e('div',{className:'cmdk-overlay open',onClick:ev=>{if(ev.target===ev.currentTarget)onClose();}},
    e('div',{className:'cmdk-box'},
      e('div',{className:'cmdk-inputwrap'},
        e('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'var(--text3)',strokeWidth:2.2,strokeLinecap:'round'},e('circle',{cx:11,cy:11,r:7}),e('path',{d:'M21 21l-4.3-4.3'})),
        e('input',{ref:inputRef,value:q,placeholder:'Buscar proyectos o ir a una vista…',onChange:ev=>{setQ(ev.target.value);setSel(0);},onKeyDown})
      ),
      e('div',{className:'cmdk-results'},
        flatSelectable.length===0&&e('div',{className:'cmdk-empty'},'Sin resultados.'),
        grouped.map((it,i)=>{
          if(it.isGroup)return e('div',{key:'g'+i,className:'cmdk-grouplbl'},it.label);
          runningIdx++;
          const idx=runningIdx;
          return e('div',{
            key:idx,
            className:'cmdk-row'+(idx===sel?' sel':''),
            onMouseEnter:()=>setSel(idx),
            onMouseDown:ev=>{ev.preventDefault();runSel(idx);}
          },
            e('span',{className:'ic',style:it.iconColor?{color:it.iconColor}:null},it.icon),
            e('span',{className:'n'},it.label)
          );
        })
      )
    )
  );
}
