// ═══════════════════════════════════════════
// FOCUS PANEL
// ═══════════════════════════════════════════
function FocusPanel({intenciones,setIntenciones,projects,selectedDay,onStartProj,onCierre}){
  const items=intenciones[selectedDay]||[];
  const pending=items.filter(i=>!i.done);
  const done=items.filter(i=>i.done);
  const dateLabel=selectedDay===dayKey()
    ?'Hoy'
    :new Date(selectedDay+'T12:00:00Z').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

  function markDone(idx){
    setIntenciones(prev=>{
      const day=[...(prev[selectedDay]||[])];
      day[idx]={...day[idx],done:!day[idx].done};
      return{...prev,[selectedDay]:day};
    });
  }

  function postponeItem(idx){
    const item=(intenciones[selectedDay]||[])[idx];
    if(!item)return;
    // Compute tomorrow relative to selectedDay
    const base=new Date(selectedDay+'T12:00:00Z');
    base.setUTCDate(base.getUTCDate()+1);
    const nextDay=base.toISOString().slice(0,10);
    setIntenciones(prev=>{
      // Remove from current day
      const today=[...(prev[selectedDay]||[])];
      today.splice(idx,1);
      // Add to next day (avoid duplicate)
      const next=[...(prev[nextDay]||[])];
      if(!next.some(i=>i.projId===item.projId&&i.text===item.text)){
        next.push({...item,done:false});
      }
      return{...prev,[selectedDay]:today,[nextDay]:next};
    });
  }

  return e('div',{className:'focus-panel'},
    e('div',{className:'focus-panel-hdr'},
      e('div',{className:'focus-panel-title'},'Foco del día'),
      e('span',{className:'focus-panel-date'},dateLabel)
    ),
    e('div',{className:'focus-panel-body'},
      items.length===0
        ?e('div',{className:'focus-empty'},
            e('div',{className:'focus-empty-icon'},'🌙'),
            e('div',null,selectedDay===dayKey()
              ?'No hay intenciones para hoy.\nCierra el día de ayer para planificar.'
              :'Sin intenciones para este día.'),
            selectedDay===dayKey()&&e('button',{className:'focus-cta',onClick:onCierre},'Cerrar día y planificar')
          )
        :e(React.Fragment,null,
          pending.length>0&&e(React.Fragment,null,
            pending.map((item,i)=>{
              const proj=projects.find(p=>p.id===item.projId);
              const globalIdx=items.indexOf(item);
              return e('div',{key:i,className:'focus-card'},
                e('div',{className:'focus-card-hdr'},
                  e('div',{className:'proj-icon-badge',style:{'--proj-color':proj?.color||'var(--text4)'}},
                    e(ProjIconSVG,{iconKey:proj?.icon||DEFAULT_ICON,size:12,color:proj?.color||'var(--text3)'})
                  ),
                  e('span',{className:'focus-card-proj'},proj?.name||'Proyecto'),
                  proj?.category&&e('span',{style:{fontSize:9,color:'var(--text4)',padding:'1px 5px',background:'var(--bg4)',borderRadius:8}},proj.category)
                ),
                e('div',{className:'focus-card-intent'},item.text),
                e('div',{className:'focus-card-actions'},
                  e('button',{className:'focus-start-btn',onMouseEnter:()=>playUI('hover'),onClick:()=>{playUI('click');onStartProj(item.projId);}},'▶ Iniciar sesión'),
                  e('button',{className:'focus-done-btn',style:{display:'flex',alignItems:'center',justifyContent:'center'},title:'Listo',onMouseEnter:()=>playUI('hover'),onClick:()=>{playUI('click');markDone(globalIdx);}},e(DashIcon,{name:'check',size:13})),
                  e('button',{className:'focus-done-btn',style:{color:'var(--amber)',borderColor:'var(--amber-border)',display:'flex',alignItems:'center',justifyContent:'center'},title:'Posponer',onMouseEnter:()=>playUI('hover'),onClick:()=>{playUI('click');postponeItem(globalIdx);}},e(DashIcon,{name:'undo',size:13}))
                )
              );
            })
          ),
          done.length>0&&e('div',{style:{marginTop:8}},
            e('div',{style:{fontSize:9,color:'var(--text4)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:6}},'Completado'),
            done.map((item,i)=>{
              const proj=projects.find(p=>p.id===item.projId);
              const globalIdx=items.indexOf(item);
              return e('div',{key:i,className:'focus-card done'},
                e('div',{className:'focus-card-hdr'},
                  e('div',{className:'proj-icon-badge',style:{'--proj-color':proj?.color||'var(--text4)'}},
                    e(ProjIconSVG,{iconKey:proj?.icon||DEFAULT_ICON,size:12,color:proj?.color||'var(--text3)'})
                  ),
                  e('span',{className:'focus-card-proj'},proj?.name||'Proyecto'),
                  e('span',{style:{fontSize:9,color:'var(--green)'}}, '✓')
                ),
                e('div',{className:'focus-card-intent'},item.text),
                e('button',{className:'focus-done-btn',style:{fontSize:9},onClick:()=>markDone(globalIdx)},'Deshacer')
              );
            })
          )
        )
    )
  );
}

// ═══════════════════════════════════════════
// CIERRE DÍA — intenciones only
// ═══════════════════════════════════════════
function CierreDia({projects,intenciones,setIntenciones,sessions,ctxs,onClose,showNotif,onDone}){
  const tomorrowStr=(()=>{
    const d=new Date(dayKey()+'T12:00:00Z');
    d.setUTCDate(d.getUTCDate()+1);
    return d.toISOString().slice(0,10);
  })();
  const tomorrowLabel=new Date(tomorrowStr+'T12:00:00Z').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

  // Get last nextStep for each project from ctxs
  function lastNextStep(projId){
    if(!ctxs) return null;
    const sorted=[...ctxs].filter(c=>c.projectId===projId&&c.nextStep).sort((a,b)=>b.createdAt-a.createdAt);
    return sorted[0]?.nextStep||null;
  }

  const[intents,setIntents]=useState(()=>Object.fromEntries(
    projects.map(p=>{
      const existing=(intenciones[tomorrowStr]||[]).find(i=>i.projId===p.id)?.text||'';
      return [p.id,{text:existing,skip:false,usedSuggestion:false}];
    })
  ));

  function setIntent(pid,field,val){setIntents(prev=>({...prev,[pid]:{...prev[pid],[field]:val}}));}

  const todayTotal=sessions.filter(s=>s.day===dayKey()&&s.endAt).reduce((a,s)=>a+s.duration,0);

  function confirm(){
    const items=projects
      .filter(p=>!intents[p.id].skip&&intents[p.id].text.trim())
      .map(p=>({projId:p.id,text:intents[p.id].text.trim(),done:false}));
    setIntenciones(prev=>({...prev,[tomorrowStr]:items}));
    onDone();
  }

  const hasAny=projects.some(p=>!intents[p.id].skip&&intents[p.id].text.trim());

  return e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)onClose();}},
    e('div',{className:'modal',style:{maxWidth:460}},
      e('div',{className:'modal-head'},
        e('div',{style:{flex:1}},
          e('div',{className:'modal-title'},'🌙 Cerrar día'),
          e('div',{className:'modal-sub'},`Hoy trabajaste ${fmtS(todayTotal)} · Mañana: ${tomorrowLabel}`)
        ),
        e('button',{className:'modal-x',onClick:onClose},'✕')
      ),
      e('div',{className:'modal-body'},
        e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:12,lineHeight:1.5}},
          '¿Cuál es el próximo paso concreto para cada proyecto mañana?'
        ),
        projects.map(proj=>{
          const st=intents[proj.id];
          const todaySecs=sessions.filter(s=>s.projectId===proj.id&&s.day===dayKey()&&s.endAt).reduce((a,s)=>a+s.duration,0);
          const suggestion=lastNextStep(proj.id);
          const showSuggestion=suggestion&&!st.usedSuggestion&&!st.text;
          return e('div',{key:proj.id,className:'cierre-proj-row',style:{opacity:st.skip?.45:1}},
            e('div',{className:'cierre-proj-hdr'},
              e('div',{className:'cierre-proj-dot',style:{background:proj.color}}),
              e('span',{className:'cierre-proj-name'},proj.name),
              e('span',{style:{fontSize:9,color:'var(--text4)',padding:'1px 5px',background:'var(--bg3)',borderRadius:8}},proj.category),
              todaySecs>0&&e('span',{className:'cierre-proj-time'},fmtS(todaySecs)+' hoy'),
              e('button',{className:'cierre-skip',onClick:()=>setIntent(proj.id,'skip',!st.skip)},
                st.skip?'+ incluir':'× omitir')
            ),
            !st.skip&&e(React.Fragment,null,
              // Suggestion chip — last recorded nextStep
              showSuggestion&&e('div',{
                style:{
                  display:'flex',alignItems:'flex-start',gap:8,padding:'8px 10px',
                  background:'var(--bg3)',border:'1px dashed var(--border2)',
                  borderRadius:'var(--r-md)',cursor:'pointer',marginBottom:6,
                  transition:'all .1s',
                },
                onClick:()=>setIntent(proj.id,'text',suggestion),
                title:'Clic para usar esta sugerencia'
              },
                e('div',{style:{fontSize:10,color:'var(--accent2)',marginTop:1,flexShrink:0}},'↩'),
                e('div',{style:{flex:1}},
                  e('div',{style:{fontSize:9,color:'var(--text4)',marginBottom:2,textTransform:'uppercase',letterSpacing:'.5px'}},'Último paso anotado'),
                  e('div',{style:{fontSize:11,color:'var(--text2)',lineHeight:1.4}},suggestion)
                ),
                e('div',{style:{fontSize:9,color:'var(--accent2)',flexShrink:0,marginTop:1}},'usar →')
              ),
              e('input',{
                className:'finput',
                placeholder: suggestion ? 'O escribe uno nuevo...' : 'Próximo paso concreto...',
                value:st.text,
                onChange:ev=>setIntent(proj.id,'text',ev.target.value)
              })
            )
          );
        })
      ),
      e('div',{className:'modal-foot'},
        e('button',{className:'btn',onClick:onClose},'Cancelar'),
        e('button',{className:'btn btn-primary',disabled:!hasAny,onClick:confirm},'Guardar y cerrar día ✓')
      )
    )
  );
}

// ═══════════════════════════════════════════
// GOOGLE SHEETS MODAL
// ═══════════════════════════════════════════
function SbModal({status,onClose,onSaved,onDisconnect,onManualSync,syncing}){
  const[url,setUrl]=useState(()=>SB._load(SB.K_URL));
  const[anon,setAnon]=useState(()=>SB._load(SB.K_ANON));
  const[err,setErr]=useState('');
  const[saving,setSaving]=useState(false);
  const isConnected=status==='connected';

  async function handleSave(){
    if(!url.trim()||!anon.trim()){setErr('Completa los dos campos.');return;}
    setSaving(true); setErr('');
    try{
      SB.configure(url.trim(), anon.trim());
      await SB.pull(); // test connection
      onSaved();
    }catch(ex){
      setErr('No se pudo conectar. Verifica la URL y la clave anon.');
      SB.disconnect();
      console.warn(ex);
    }finally{ setSaving(false); }
  }

  return e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)onClose();}},
    e('div',{className:'modal',style:{maxWidth:440}},
      e('div',{className:'modal-head'},
        e('div',{style:{flex:1}},
          e('div',{className:'modal-title'},'☁ Sincronización automática'),
          e('div',{className:'modal-sub'},'Tus datos se guardan en la nube y se restauran solos')
        ),
        e('button',{className:'modal-x',onClick:onClose},'✕')
      ),
      e('div',{className:'modal-body',style:{display:'flex',flexDirection:'column',gap:14}},
        isConnected
          ? e(React.Fragment,null,

}

// ═══════════════════════════════════════════
// TIMER WIDGET — compact, floating, persistent
// ═══════════════════════════════════════════
function TimerWidget({tState,elapsed,workElapsed,activeSess,activeProj,activeTask,pomoCfg,pomoPhase,pomoCount,pomoElapsed,pomoPhaseDone,onStart,onPause,onStop,onStartNextPhase}){
  const[collapsed,setCollapsed]=useState(false);
  const isPomo=activeSess?.mode==='pomo';
  const displayTime=isPomo?elapsed:workElapsed;
  const phLen=(pomoPhase==='work'?pomoCfg.work:pomoCfg.brk)*60;
  const rem=Math.max(0,phLen-pomoElapsed);
  return e('div',{className:'timer-widget'+(collapsed?' collapsed':'')},
    e('div',{className:'timer-widget-hdr',onClick:()=>setCollapsed(v=>!v)},
      e('div',{className:'timer-widget-dot'+(tState==='running'?' running':tState==='paused'?' paused':'')}),
      e('div',{className:'timer-widget-time'},fmt(displayTime)),
      !collapsed&&e('span',{className:'timer-widget-caret'},'▾'),
      collapsed&&e('span',{className:'timer-widget-caret'},'▸')
    ),
    !collapsed&&e('div',{className:'timer-widget-body'},
      e('div',{className:'timer-widget-proj'},
        activeProj&&e('div',{style:{width:6,height:6,borderRadius:'50%',background:activeProj.color,flexShrink:0}}),
        activeProj?activeProj.name:'Sin sesión activa'
      ),
      activeTask&&e('div',{className:'timer-widget-task'},activeTask.name),
      isPomo&&e('div',{className:'timer-widget-pomo'},'🍅 '+pomoCount+' completados · '+(pomoPhaseDone?'listo':fmtHM(rem)+' '+(pomoPhase==='work'?'restante':'descanso'))),
      pomoPhaseDone
        ?e('div',{className:'timer-widget-ctrls'},
            e('button',{className:'btn btn-primary',onClick:onStartNextPhase},pomoPhase==='work'?'☕ Descanso':'▶ Siguiente'),
            e('button',{className:'btn',onClick:onStop},'■')
          )
        :e('div',{className:'timer-widget-ctrls'},
            tState==='idle'&&e('button',{className:'btn btn-primary',onClick:onStart},'▶ Iniciar timer'),
            tState!=='idle'&&e('button',{className:'btn',onClick:onPause},tState==='running'?'⏸ Pausar':'▶ Reanudar'),
            tState!=='idle'&&e('button',{className:'btn btn-danger',onClick:onStop},'■')
          )
    )
  );
}

// ═══════════════════════════════════════════
// SYSTEM MODAL — create / edit a System (operational process)
// ═══════════════════════════════════════════
function SystemModal({system,onClose,onSave,onDelete,onUpdateSystem}){
  const[name,setName]=useState(system?.name||'');
  const[color,setColor]=useState(system?.color||'#4a9de0');
  const[icon,setIcon]=useState(system?.icon||'target');
  const[order,setOrder]=useState(system?.order!=null?String(system.order):'');
  const[recurrence,setRecurrence]=useState(()=>system?.recurrence||{type:'monthly',interval:1,days:[weekdayKeyOf(dayKey())],monthMode:'same',monthDay:new Date().getDate()});
  const[showRec,setShowRec]=useState(false);
  const[confirmDel,setConfirmDel]=useState(false);
  const[newObs,setNewObs]=useState('');
  const[editingId,setEditingId]=useState(null);
  const[editText,setEditText]=useState('');
  const observations=(system?.observations||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);
  function save(){
    if(!name.trim())return;
    const nextRun=recurrence?new Date(computeNextOccurrence(dayKey(),recurrence)+'T12:00:00').getTime():(system?.nextRun||null);
    const ord=order.trim()===''?null:Number(order);
    onSave({...(system||{}),name:name.trim(),recurrence,nextRun,color,icon,order:Number.isFinite(ord)?ord:null});
  }
  function markMonitored(){
    const nextRun=recurrence?new Date(computeNextOccurrence(dayKey(),recurrence)+'T12:00:00').getTime():null;
    const updated={...system,recurrence,lastRun:Date.now(),nextRun};
    onUpdateSystem(updated);
  }
  function addObservation(){
    const text=newObs.trim();
    if(!text||!system)return;
    onUpdateSystem({...system,observations:[...(system.observations||[]),{id:uid(),text,createdAt:Date.now()}]});
    setNewObs('');
  }
  function startEdit(o){setEditingId(o.id);setEditText(o.text);}
  function saveEdit(){
    if(!editText.trim()){setEditingId(null);return;}
    onUpdateSystem({...system,observations:(system.observations||[]).map(o=>o.id===editingId?{...o,text:editText.trim()}:o)});
    setEditingId(null);
  }
  function deleteObservation(id){
    onUpdateSystem({...system,observations:(system.observations||[]).filter(o=>o.id!==id)});
  }
  function nextRunLabel(ts){
    if(!ts)return '—';
    const diff=ts-Date.now();
    const day=86400000;
    if(diff<=0)return 'hoy';
    const d=Math.round(diff/day);
    return d<=0?'hoy':d===1?'mañana':`en ${d}d`;
  }
  function fmtDate(ts){
    const d=new Date(ts);
    return d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  }
  return e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)onClose();}},
    e('div',{className:'modal',style:{width:440,maxHeight:'88vh'}},
      e('div',{className:'modal-head'},e('div',{className:'modal-title'},system?'Editar sistema':'Nuevo sistema'),e('button',{className:'modal-x',onClick:onClose},'✕')),
      e('div',{className:'modal-body'},
        e('div',{className:'fg'},e('label',{className:'flabel'},'Nombre del sistema'),e('input',{className:'finput',value:name,onChange:ev=>setName(ev.target.value),placeholder:'ej. Riego de plantas',autoFocus:true})),
        e('div',{className:'fg'},
          e('label',{className:'flabel'},'Orden dentro de la plantilla (opcional)'),
          e('input',{className:'finput',type:'number',min:1,style:{maxWidth:100},value:order,placeholder:'1, 2, 3...',onChange:ev=>setOrder(ev.target.value)}),
          e('div',{style:{fontSize:10,color:'var(--text3)',marginTop:4}},'Define en qué paso de la secuencia va este sistema cuando la plantilla se ejecuta paso a paso.')
        ),
        e('div',{className:'fg'},e('label',{className:'flabel'},'Color'),e('div',{className:'swatch-row'},COLORS.map(c=>e('div',{key:c,className:`swatch${color===c?' on':''}`,style:{background:c},onClick:()=>setColor(c)})))),
        e('div',{className:'fg'},
          e('label',{className:'flabel'},'Ícono'),
          e('div',{style:{display:'flex',flexDirection:'column',gap:8,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:'var(--r-md)',padding:'10px 10px 6px'}},
            ICON_GROUPS.map(grp=>e('div',{key:grp.label},
              e('div',{style:{fontSize:9,color:'var(--text4)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:5}},grp.label),
              e('div',{style:{display:'flex',gap:5,flexWrap:'wrap'}},
                grp.keys.map(k=>e('div',{
                  key:k,
                  onClick:()=>setIcon(k),
                  title:k,
                  style:{
                    width:32,height:32,borderRadius:'var(--r-md)',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    cursor:'pointer',transition:'all .1s',
                    border: icon===k?'2px solid '+color:'1px solid var(--border2)',
                    background: icon===k?color+'22':'var(--bg4)',
                    boxSizing:'border-box',
                  }
                },
                  e(ProjIconSVG,{iconKey:k,size:15,color:icon===k?color:'var(--text3)'})
                ))
              )
            ))
          )
        ),
        e('div',{className:'fg'},e('label',{className:'flabel'},'Repetición del monitoreo'),
          e('button',{className:'rec-trigger',onClick:()=>setShowRec(true)},
            e(RepeatIcon,{size:13,color:'var(--accent2)'}),
            e('span',null,recurrenceLabel(recurrence))
          )
        ),
        system&&e('div',{className:'hint-row'},'Próximo monitoreo: '+nextRunLabel(system.nextRun)),
        system&&e('button',{className:'btn',style:{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:6},onClick:markMonitored},e(DashIcon,{name:'check',size:12}),'Marcar como monitoreado hoy'),
        system&&e('div',{className:'fg'},
          e('label',{className:'flabel'},'Observaciones'),
          e('div',{className:'obs-add-row'},
            e('input',{value:newObs,placeholder:'Escribe una observación...',onChange:ev=>setNewObs(ev.target.value),onKeyDown:ev=>{if(ev.key==='Enter')addObservation();}}),
            e('button',{className:'task-add-submit',onClick:addObservation},'OK')
          ),
          observations.length===0
            ?e('div',{className:'empty',style:{padding:'8px 0'}},'Sin observaciones aún.')
            :e('div',{className:'obs-list'},observations.map(o=>e('div',{key:o.id,className:'obs-entry'},
                editingId===o.id
                  ?e(React.Fragment,null,
                      e('textarea',{className:'stage-comment-input',rows:2,value:editText,onChange:ev=>setEditText(ev.target.value),autoFocus:true}),
                      e('div',{style:{display:'flex',gap:6,marginTop:5,justifyContent:'flex-end'}},
                        e('button',{className:'ghost-btn',onClick:()=>setEditingId(null)},'Cancelar'),
                        e('button',{className:'ghost-btn',onClick:saveEdit},'Guardar')
                      )
                    )
                  :e(React.Fragment,null,
                      e('div',{style:{display:'flex',alignItems:'flex-start',gap:6}},
                        e('div',{style:{flex:1,minWidth:0}},
                          e('div',{className:'obs-entry-date'},fmtDate(o.createdAt)),
                          e('div',{className:'obs-entry-text'},o.text)
                        ),
                        e('div',{style:{display:'flex',gap:2,flexShrink:0}},
                          e('button',{className:'ghost-btn',onClick:()=>startEdit(o),title:'Editar'},'✎'),
                          e('button',{className:'ghost-btn',onClick:()=>deleteObservation(o.id),title:'Eliminar'},'✕')
                        )
                      )
                    )
              )))
        ),
        confirmDel&&e('div',{style:{padding:'8px 10px',background:'var(--red-bg)',border:'1px solid var(--red-border)',borderRadius:'var(--r-md)',fontSize:11,color:'var(--red)'}},'¿Eliminar este sistema? Esta acción no se puede deshacer.')
      ),
      e('div',{className:'modal-foot'},
        system&&onDelete&&!confirmDel&&e('button',{className:'btn btn-danger',style:{marginRight:'auto'},onClick:()=>setConfirmDel(true)},'Eliminar'),
        system&&onDelete&&confirmDel&&e('button',{className:'btn btn-danger',style:{marginRight:'auto'},onClick:()=>onDelete(system.id)},'Confirmar eliminación'),
        e('button',{className:'btn',onClick:onClose},'Cancelar'),
        e('button',{className:'btn btn-primary',onClick:save},system?'Guardar':'Crear')
      )
    ),
    showRec&&e(RecurrenceModal,{
      value:recurrence,
      anchorDate:dayKey(),
      mode:'system',
      onClose:()=>setShowRec(false),
      onSave:next=>{if(next)setRecurrence(next);setShowRec(false);}
    })
  );
}

// SPARKLINE — tiny data-driven line chart
// ═══════════════════════════════════════════
function Sparkline({points,width=90,height:h=26,color='var(--accent2)'}){
  if(!points||points.length<2)return e('svg',{width,height:h});
  const max=Math.max(1,...points);
  const step=width/(points.length-1);
  const d=points.map((v,i)=>`${i===0?'M':'L'}${(i*step).toFixed(1)},${(h-2-(v/max)*(h-4)).toFixed(1)}`).join(' ');
  return e('svg',{width,height:h,viewBox:`0 0 ${width} ${h}`,style:{display:'block'}},
    e('path',{d,fill:'none',stroke:color,strokeWidth:1.6,strokeLinecap:'round',strokeLinejoin:'round'})
  );
}

// ═══════════════════════════════════════════
// HORIZONTAL TIMELINE — "Bloques de tiempo" bar, Dashboard style
// ═══════════════════════════════════════════
function minToHM(m){m=((m%1440)+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(Math.round(m%60)).padStart(2,'0')}`;}
function HorizontalTimeline({realBlocks,liveBlock,projects,tasks,selectedDay,setSelectedDay}){
  const wrapRef=useRef(null);
  const[containerW,setContainerW]=useState(800);

  useEffect(()=>{
    if(!wrapRef.current)return;
    const el=wrapRef.current;
    const ro=new ResizeObserver(entries=>{
      for(const en of entries){const w=en.contentRect.width;if(w>0)setContainerW(w);}
    });
    ro.observe(el);
    setContainerW(el.clientWidth||800);
    return()=>ro.disconnect();
  },[]);

  function shiftDay(delta){
    const d=new Date(selectedDay+'T12:00:00Z');
    d.setUTCDate(d.getUTCDate()+delta);
    setSelectedDay(d.toISOString().slice(0,10));
  }
  function dayLabel(){
    const today=dayKey();
    if(selectedDay===today)return'Hoy, '+new Date(selectedDay+'T12:00:00Z').toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});
    return new Date(selectedDay+'T12:00:00Z').toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});
  }
  function tsToMin(ts){const d=new Date(ts*1000);const scl=new Date(d.toLocaleString('en-US',{timeZone:'America/Santiago'}));return scl.getHours()*60+scl.getMinutes();}

  const isToday=selectedDay===dayKey();
  const nowM=sclToMin();
  const allReal=[...(realBlocks||[]),...(liveBlock?[liveBlock]:[])].filter(s=>s.day===selectedDay||!s.day);

  let minM=6*60,maxM=22*60;
  allReal.forEach(sess=>{
    const sMin=tsToMin(sess.startAt);
    const eMin=sess.live?nowM:tsToMin(sess.endAt);
    if(eMin<=sMin)return;
    minM=Math.min(minM,Math.floor(sMin/60)*60);
    maxM=Math.max(maxM,Math.ceil(eMin/60)*60);
  });
  if(isToday){minM=Math.min(minM,Math.floor(nowM/60)*60);maxM=Math.max(maxM,Math.ceil(nowM/60)*60+120);}
  maxM=Math.min(maxM,1440);
  const totalM=Math.max(60,maxM-minM);

  // Responsive scale: stretch to fill the available width; below a minimum
  // px-per-minute, switch to a wider scrollable track instead of squishing text.
  const MIN_PXPM=2.4;
  const fitPxPm=(containerW-4)/totalM;
  const pxpm=Math.max(MIN_PXPM,fitPxPm);
  const trackW=Math.max(containerW-4,totalM*pxpm);
  const needsScroll=pxpm>fitPxPm+0.001;

  const tickStep=pxpm<3.4?120:60;
  const ticks=[];for(let m=minM;m<=maxM;m+=tickStep)ticks.push(m);

  function leftPx(m){return Math.min(trackW,Math.max(0,(m-minM)*pxpm));}
  function widthPx(s,f){return Math.max(46,(f-s)*pxpm);}
  function onWheelH(ev){
    const el=ev.currentTarget;
    if(el.scrollWidth<=el.clientWidth)return;
    if(Math.abs(ev.deltaY)>=Math.abs(ev.deltaX)){
      el.scrollLeft+=ev.deltaY;
      ev.preventDefault();
    }
  }

  const blocksData=allReal.map(sess=>{
    const proj=projects.find(p=>p.id===sess.projectId);
    const task=tasks.find(t=>t.id===sess.taskId);
    const sMin=tsToMin(sess.startAt);
    const eMin=sess.live?nowM:tsToMin(sess.endAt);
    return{id:sess.id||sess.startAt,color:proj?.color||'var(--accent)',name:task?task.name:(proj?proj.name:'Sesión'),sMin,eMin};
  }).filter(b=>b.eMin>b.sMin).sort((a,b)=>a.sMin-b.sMin);

  return e('div',{className:'htl',ref:wrapRef},
    e('div',{className:'htl-header'},
      e(PanelIcon,{name:'calendarWeek',label:'Bloques de tiempo'}),
      e('div',{className:'htl-day-select'},
        e('button',{className:'dash-date-btn',onClick:()=>shiftDay(-1),title:'Día anterior'},e(DashIcon,{name:'chevL',size:11})),
        e('span',{style:{cursor:'pointer'},onClick:()=>setSelectedDay(dayKey())},dayLabel()),
        e('button',{className:'dash-date-btn',onClick:()=>shiftDay(1),title:'Día siguiente'},e(DashIcon,{name:'chevR',size:11}))
      )
    ),
    e('div',{
      className:'htl-scroll'+(needsScroll?' scrollable':''),
      onWheel:onWheelH,
      style:!needsScroll?{display:'flex',justifyContent:'center'}:undefined
    },
      e('div',{className:'htl-track-wrap',style:{width:trackW+'px'}},
        e('div',{className:'htl-ruler'},ticks.map(m=>e('div',{key:m,className:'htl-tick',style:{left:leftPx(m)+'px'}},e('span',{className:'htl-tick-lbl'},minToHM(m))))),
        isToday&&nowM>=minM&&nowM<=maxM&&e('div',{className:'htl-now-pin',style:{left:leftPx(nowM)+'px'}},minToHM(nowM)),
        isToday&&nowM>=minM&&nowM<=maxM&&e('div',{className:'htl-now-line',style:{left:leftPx(nowM)+'px'}}),
        e('div',{className:'htl-lane'},
          blocksData.length===0&&e('div',{className:'empty',style:{padding:'20px 0'}},'Sin sesiones registradas este día.'),
          blocksData.map(b=>e('div',{key:b.id,className:'htl-block',style:{left:leftPx(b.sMin)+'px',width:widthPx(b.sMin,b.eMin)+'px',background:b.color+'26',borderColor:b.color}},
            e('div',{className:'htl-block-name'},b.name),
            e('div',{className:'htl-block-time'},minToHM(b.sMin)+' - '+minToHM(b.eMin)),
            e('div',{className:'htl-block-dur'},fmtS((b.eMin-b.sMin)*60))
          ))
        )
      )
    )
  );
}

function ClockIcon({size=12,color='currentColor'}){

function fmtNoteReminder(ts){
  if(!ts)return'';
  const d=new Date(ts);
  const today=dayKey();
  const dK=d.toISOString().slice(0,10);
  const hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(dK===today)return'Hoy '+hh;
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  if(dK===tomorrow.toISOString().slice(0,10))return'Mañana '+hh;
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:dK.slice(0,4)!==today.slice(0,4)?'numeric':undefined})+' '+hh;
}

function projectDateRange(task){
  const steps=(task.steps||[]).filter(s=>s.dueDate);
  if(steps.length===0)return null;
  const starts=steps.map(s=>s.startDate||s.dueDate);
  const ends=steps.map(s=>s.dueDate);
  return{start:starts.reduce((a,b)=>a<b?a:b),end:ends.reduce((a,b)=>a>b?a:b)};
}
// Encuentra la fase "activa" de un proyecto: la primera fase sin completar,
// en el orden en que están listadas — el mismo criterio con el que se ve
// "activa"/pendiente en la lista de fases de cada proyecto. Si todas están
// completadas, el proyecto se considera finalizado. Si el proyecto todavía
// no arranca (hoy es anterior a su fecha de inicio), no hay fase activa aún.
function activePhaseInfo(task,today,rangeStart){
  if(rangeStart&&today<rangeStart)return null; // el proyecto todavía no empieza
  const steps=task.steps||[];
  if(steps.length===0)return null;
  const current=steps.find(s=>!s.done);
  if(current)return{label:current.name,kind:'activa',automation:!!current.automation};
  return{label:'Finalizado',kind:'fin'};
}
const TL_SCALES={
  day:{dayW:54,label:'Día'},
  month:{dayW:16,label:'Mes'},
  year:{dayW:4.5,label:'Año'}
};
function AccountProjectsTimeline({pTasks,color,onOpenProject}){
  const[scale,setScale]=useState('day');
  const DAY_W=TL_SCALES[scale].dayW;

  const today=dayKey();

  }).filter(Boolean).sort((a,b)=>a.start<b.start?-1:1);

  const wrapRef=useRef(null);
  const[containerW,setContainerW]=useState(800);
  useEffect(()=>{
    if(!wrapRef.current)return;
    const el=wrapRef.current;
    const ro=new ResizeObserver(entries=>{
      for(const en of entries){const w=en.contentRect.width;if(w>0)setContainerW(w);}
    });

    setContainerW(el.clientWidth||800);
    return()=>ro.disconnect();
  },[]);
  function onWheelH(ev){
    const el=ev.currentTarget;
    if(el.scrollWidth<=el.clientWidth)return; // nothing to scroll — let page scroll normally
    if(Math.abs(ev.deltaY)>=Math.abs(ev.deltaX)){
      el.scrollLeft+=ev.deltaY;
      ev.preventDefault();
    }
  }

  const SCALE_ICONS={day:'calendarDay',month:'calendarGrid',year:'calendarRange'};
  const scaleSwitch=e('div',{style:{display:'flex',gap:2,background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:'var(--r-md)',padding:2}},
    Object.keys(TL_SCALES).map(k=>e('button',{

      onClick:()=>setScale(k),

        display:'flex',alignItems:'center',justifyContent:'center',

    );
  }

  const allTs=rows.flatMap(r=>[toTs(r.start),toTs(r.end)]).concat([toTs(today)]);
  const minTs=Math.min(...allTs)-2*86400000;
  const maxTs=Math.max(...allTs)+3*86400000;

  const dayIdx=dateStr=>Math.round((toTs(dateStr)-minTs)/86400000);
  const days=Array.from({length:numDays},(_,i)=>new Date(minTs+i*86400000));
  const trackW=Math.max(numDays*DAY_W+LABEL_W,200);

  function tickInfo(d,i){

      return{show:true,txt:(wd?wd.l+' ':'')+d.getDate(),strong:isMonthStart};
    }
    if(scale==='month'){

      if(isMonthStart)return{show:true,txt:MONTHS_SHORT[d.getMonth()]+' '+d.getDate(),strong:true};
      if(isMonday)return{show:true,txt:String(d.getDate()),strong:false};
      return{show:false};

    return{show:false};

  return e('div',{className:'htl',ref:wrapRef},
    e('div',{className:'htl-header'},
      e(PanelIcon,{name:'layers',label:'Panorama de proyectos'}),
      e('div',{style:{display:'flex',alignItems:'center',gap:10}},
        e('span',{style:{fontSize:10,color:'var(--text3)'}},rows.length+' con fecha'),
        scaleSwitch
      )
    ),
    e('div',{
      className:'htl-scroll'+(needsScroll?' scrollable':''),
      onWheel:onWheelH,
      style:!needsScroll?{display:'flex',justifyContent:'center'}:undefined
    },
      e('div',{className:'htl-track-wrap',style:{width:trackW+'px'}},
        e('div',{className:'htl-ruler'},days.map((d,i)=>{
          const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          const info=tickInfo(d,i);
          if(!info.show)return null;
          return e('div',{key:i,className:'htl-tick'+(key===today?' today':''),style:{left:i*DAY_W+'px'}},
            e('span',{className:'htl-tick-lbl',style:info.strong?{color:'var(--text2)',fontWeight:600}:undefined},info.txt)
          );
        })),
        dayIdx(today)>=0&&dayIdx(today)<numDays&&e('div',{className:'htl-now-line',style:{left:dayIdx(today)*DAY_W+'px'}}),
        e('div',{className:'htl-lane',style:{height:rows.length*ROW_H+14}},
          rows.map((r,ri)=>{
            const left=dayIdx(r.start)*DAY_W;
            const width=Math.max((dayIdx(r.end)-dayIdx(r.start)+1)*DAY_W-3,4);
            const barH=scale==='day'?22:14;
            const barTop=ri*ROW_H+(ROW_H-barH)/2;
            const phase=r.phase;
            // División de "automatizado" DENTRO de la propia barra del proyecto:
            // desde la fecha de la fase marcada con ⚙ hasta el final de esa barra.
            const autoStep=(r.task.steps||[]).find(s=>s.automation&&s.startDate);
            const autoDt=autoStep&&autoStep.startDate;
            let autoLeft=null,autoWidth=null;
            if(autoDt){
              const clamped=autoDt<r.start?r.start:(autoDt>r.end?r.end:autoDt);
              const aIdx=dayIdx(clamped);
              autoLeft=aIdx*DAY_W;
              autoWidth=Math.max((dayIdx(r.end)-aIdx+1)*DAY_W-3,2);
            }
            return e('div',{key:r.task.id,style:{position:'absolute',top:0,left:0,right:0}},
              // Barra: solo color, sin texto adentro — así nunca se ve "feo" apretada.
              e('div',{
                className:'htl-block',
                style:{left:left+'px',width:width+'px',top:barTop+'px',bottom:'auto',height:barH,background:(color||'var(--accent)')+'26',borderColor:color||'var(--accent)',cursor:onOpenProject?'pointer':'default',padding:0},
                onClick:()=>onOpenProject&&onOpenProject(r.task),
                title:r.task.name+' · '+fmtDMY(r.start)+' → '+fmtDMY(r.end)+(phase?' · '+phase.label:'')
              }),
              autoDt&&e('div',{
                className:'htl-block-auto',
                style:{left:autoLeft+'px',width:autoWidth+'px',top:barTop+'px',height:barH+'px'},
                title:'⚙ automatizado desde '+fmtDMY(autoDt)
              }),
              // Etiqueta: SIEMPRE a la derecha de la barra, nunca debajo —
              // nombre del proyecto arriba, fecha + fase activa abajo.
              e('div',{
                onClick:()=>onOpenProject&&onOpenProject(r.task),
                style:{
                  position:'absolute',top:ri*ROW_H+'px',height:ROW_H,left:(left+width+10)+'px',
                  display:'flex',flexDirection:'column',justifyContent:'center',gap:2,
                  cursor:onOpenProject?'pointer':'default',maxWidth:LABEL_W-10,overflow:'hidden'
                }
              },
                e('div',{className:'htl-block-name',style:{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},r.task.name),
                phase&&e('div',{style:{display:'flex',alignItems:'center'}},
                  e('span',{
                    style:{
                      fontSize:9,padding:'1px 6px',borderRadius:20,
                      color:phase.kind==='activa'?(phase.automation?'var(--accent2)':color||'var(--accent)'):'var(--text3)',
                      background:phase.kind==='activa'?(phase.automation?'var(--accent2)':(color||'var(--accent)'))+'1c':'var(--bg3)',
                      border:'1px solid '+(phase.kind==='activa'?(phase.automation?'var(--accent2)':(color||'var(--accent)'))+'3a':'var(--border2)'),
                      overflow:'hidden',textOverflow:'ellipsis',maxWidth:LABEL_W-20,whiteSpace:'nowrap'
                    }
                  },(phase.automation?'⚙ ':'')+phase.label)
                ),
                e('div',{className:'htl-block-time'},fmtDMY(r.start)+' → '+fmtDMY(r.end))
              )
            );
          })
        )
      )
    )
  );
}
function fmtDMY(dateStr){
  if(!dateStr)return'';
  const[y,m,d]=dateStr.split('-');
  return `${d}-${m}-${y}`;
}

function SystemCard({system,onEdit,onOpenDetail,onUpdateSystem,fmtWhen}){

  const color=system.color||'#4a9de0';

    ev.stopPropagation();
    const nextRun=system.recurrence?new Date(computeNextOccurrence(dayKey(),system.recurrence)+'T12:00:00').getTime():null;
    onUpdateSystem({...system,lastRun:Date.now(),nextRun});

  function editClick(ev){

  // Doble click abre el mapa mental de los módulos de este sistema (ya

      e('div',{style:{flex:1,minWidth:0}},

// Título de tarjeta/popover del mapa mental, editable con un clic (sin salir
// del mapa) — evita tener que abrir el editor completo solo para renombrar.
function SysMapEditableTitle({value,onSave,className,placeholder}){
  const[editing,setEditing]=useState(false);
  const[val,setVal]=useState(value);
  useEffect(()=>{setVal(value);},[value]);
  function commit(){
    setEditing(false);
    const t=val.trim();
    if(t&&t!==value)onSave(t);else setVal(value);
  }
  if(editing){
    return e('input',{
      className:className,
      style:{background:'var(--bg1)',border:'1px solid var(--border4)',borderRadius:5,padding:'1px 5px',width:'100%',font:'inherit',color:'inherit'},
      value:val,autoFocus:true,
      onFocus:ev=>ev.target.select(),
      onClick:ev=>ev.stopPropagation(),
      onMouseDown:ev=>ev.stopPropagation(),
      onChange:ev=>setVal(ev.target.value),
      onBlur:commit,
      onKeyDown:ev=>{if(ev.key==='Enter')commit();if(ev.key==='Escape'){setVal(value);setEditing(false);}}
    });
  }
  return e('span',{
    className:className,title:'Click para renombrar',style:{cursor:'text'},
    onClick:ev=>{ev.stopPropagation();setEditing(true);},
    onMouseDown:ev=>ev.stopPropagation(),
    onDoubleClick:ev=>ev.stopPropagation()
  },value||placeholder);
}

function SystemsMindMap({systems,onUpdateSystem,onDeleteSystem,onPatchProject,project,onClose,onOpenDetail,onBulkAdd,sysTemplates,onSaveSysTemplate,onApplySysTemplate,onDeleteSysTemplate,onUpdateSysTemplate,title,embedded}){
  const[showTplMgr,setShowTplMgr]=useState(false);
  const links=project.sysLinks||[];
  const canvasRef=useRef(null);
  const[canvasW,setCanvasW]=useState(1000);
  const[dragPreview,setDragPreview]=useState(null); // {id,x,y}
  const[linkFrom,setLinkFrom]=useState(null); // id de sistema en modo "conectar"
  const[selected,setSelected]=useState(()=>new Set());
  const[marquee,setMarquee]=useState(null); // {x0,y0,x1,y1} coords de canvas
  const[zoom,setZoom]=useState(1); // alt + rueda para acercar/alejar todo el mapa
  const[expandedId,setExpandedId]=useState(null); // id de nodo con el panel lateral de fases/tareas abierto
  const[expPanelId,setExpPanelId]=useState(null); // id de nodo con el panel de experimentos abierto
  const[showSaveTpl,setShowSaveTpl]=useState(false);
  const[tplName,setTplName]=useState('');
  const[showBulkPaste,setShowBulkPaste]=useState(false);
  const[bulkText,setBulkText]=useState('');
  const[newTaskDraft,setNewTaskDraft]=useState({}); // {phaseId: text} — panel de fases del nodo expandido
  const CARD_W=236,CARD_H=76,GAP_X=64,GAP_Y=44,PANEL_W=270,PANEL_GAP=40;
  const NODE_COLORS=['#f25623','#34c386','#dba14a','#56a8e6','#e6675f','#4a9de0'];
  const NODE_KINDS=[{key:'inicio',label:'Inicio',color:'#34c386'},{key:'accion',label:'Acción',color:'#56a8e6'},{key:'decision',label:'Decisión',color:'#dba14a'},{key:'fin',label:'Fin',color:'#e6675f'}];
  function nodeKindOf(s){ return s.nodeKind||'accion'; }
  function setNodeKind(s,key){ onUpdateSystem({...s,nodeKind:key}); }

  function cycleNodeColor(s){
    const cur=s.color||NODE_COLORS[0];
    const idx=NODE_COLORS.indexOf(cur);
    onUpdateSystem({...s,color:NODE_COLORS[(idx+1)%NODE_COLORS.length]});
  }
  function toggleAutomation(s){
    onUpdateSystem({...s,automation:!s.automation});
  }
  // ---- fases y tareas del panel lateral (mismo modelo que ModuleListEditor / migrateSysPhases) ----
  function getSys(id){ return systems.find(x=>x.id===id); }
  function patchPhases(sysId,phases){
    const s=getSys(sysId); if(!s)return;
    onUpdateSystem({...s,phases});
  }
  function addPhaseTo(sysId){
    const s=getSys(sysId); if(!s)return;
    patchPhases(sysId,[...migrateSysPhases(s),{id:uid(),name:'Nueva fase',tasks:[]}]);
  }
  function renamePhaseOf(sysId,phaseId,name){
    const s=getSys(sysId); if(!s)return;
    patchPhases(sysId,migrateSysPhases(s).map(p=>p.id===phaseId?{...p,name}:p));
  }
  function deletePhaseOf(sysId,phaseId){
    const s=getSys(sysId); if(!s)return;
    patchPhases(sysId,migrateSysPhases(s).filter(p=>p.id!==phaseId));
  }
  function addTaskTo(sysId,phaseId){
    const s=getSys(sysId); if(!s)return;
    const text=(newTaskDraft[phaseId]||'').trim();
    if(!text)return;
    patchPhases(sysId,migrateSysPhases(s).map(p=>p.id!==phaseId?p:{...p,tasks:[...(p.tasks||[]),{id:uid(),text,done:false}]}));
    setNewTaskDraft(d=>({...d,[phaseId]:''}));
  }
  function toggleTaskOf(sysId,phaseId,taskId){
    const s=getSys(sysId); if(!s)return;
    patchPhases(sysId,migrateSysPhases(s).map(p=>p.id!==phaseId?p:{...p,tasks:p.tasks.map(t=>t.id===taskId?{...t,done:!t.done}:t)}));
  }
  function setTaskTextOf(sysId,phaseId,taskId,text){
    const s=getSys(sysId); if(!s)return;
    patchPhases(sysId,migrateSysPhases(s).map(p=>p.id!==phaseId?p:{...p,tasks:p.tasks.map(t=>t.id===taskId?{...t,text}:t)}));
  }
  function deleteTaskOf(sysId,phaseId,taskId){
    const s=getSys(sysId); if(!s)return;
    patchPhases(sysId,migrateSysPhases(s).map(p=>p.id!==phaseId?p:{...p,tasks:p.tasks.filter(t=>t.id!==taskId)}));
  }

  function applyBulkPaste(){
    const parsed=parseTemplateText(bulkText);
    if(!parsed.length)return;
    const items=parsed.map(s=>({
      id:uid(),
      name:s.name,
      phases:[{id:uid(),name:'General',tasks:(s.subtasks||[]).map(t=>({id:uid(),text:t.name,done:false}))}],
      mmPos:null
    }));
    onBulkAdd(items);
    setBulkText('');
    setShowBulkPaste(false);
  }

  function clampZoom(z){return Math.max(0.4,Math.min(1.6,Math.round(z*20)/20));}
  function onCanvasWheel(ev){
    if(!ev.altKey)return;
    ev.preventDefault();
    setZoom(z=>clampZoom(z+(ev.deltaY<0?0.1:-0.1)));
  }
  function togglePanel(id){
    setExpandedId(cur=>cur===id?null:id);
    setExpPanelId(null);
  }
  function toggleExpPanel(id){
    setExpPanelId(cur=>cur===id?null:id);
  }
  function toggleActive(s){
    onUpdateSystem({...s,active:s.active===false?true:false});
  }

  useEffect(()=>{
    function measure(){ if(canvasRef.current) setCanvasW(canvasRef.current.clientWidth||1000); }
    measure();
    window.addEventListener('resize',measure);
    return()=>window.removeEventListener('resize',measure);
  },[]);

  useEffect(()=>{
    function onKey(ev){
      const tag=(document.activeElement&&document.activeElement.tagName)||'';
      if(tag==='INPUT'||tag==='TEXTAREA')return;
      if(ev.key==='Escape'){
        if(linkFrom)setLinkFrom(null);
        else if(selected.size>0)setSelected(new Set());
        else if(expandedId)setExpandedId(null);
        else onClose();
      }else if((ev.key==='Delete'||ev.key==='Backspace')&&selected.size>0){
        ev.preventDefault();
        deleteSelected();
      }
    }
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[linkFrom,selected,expandedId,onClose]);

  function deleteSelected(){
    const ids=[...selected];
    if(ids.length===0)return;
    const label=ids.length===1?'este sistema':`estos ${ids.length} sistemas`;
    if(!confirm(`¿Eliminar ${label}? Esta acción no se puede deshacer.`))return;
    ids.forEach(id=>onDeleteSystem(id));
    if(links.some(l=>ids.includes(l[0])||ids.includes(l[1]))){
      onPatchProject({sysLinks:links.filter(l=>!ids.includes(l[0])&&!ids.includes(l[1]))});
    }
    setSelected(new Set());
  }

  function defaultPos(idx){
    const cols=Math.max(1,Math.floor((canvasW+GAP_X)/(CARD_W+GAP_X)));
    const row=Math.floor(idx/cols),col=idx%cols;
    return{x:col*(CARD_W+GAP_X)+30,y:row*(CARD_H+GAP_Y)+30};
  }
  function getPos(s,idx){
    if(dragPreview&&dragPreview.id===s.id)return{x:dragPreview.x,y:dragPreview.y};
    return s.mmPos||defaultPos(idx);
  }
  function toCanvasCoords(ev){
    const r=canvasRef.current.getBoundingClientRect();
    return{
      x:ev.clientX-r.left+canvasRef.current.scrollLeft,
      y:ev.clientY-r.top+canvasRef.current.scrollTop
    };
  }
  function beginDrag(s,idx,ev){
    if(ev.button!==0)return;
    ev.preventDefault();ev.stopPropagation();
    const start=getPos(s,idx);
    const sx=ev.clientX,sy=ev.clientY;
    let moved=false;
    function onMove(e2){
      const dx=e2.clientX-sx,dy=e2.clientY-sy;
      if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
      setDragPreview({id:s.id,x:Math.max(0,start.x+dx),y:Math.max(0,start.y+dy)});
    }
    function onUp(e2){
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      if(moved){
        const dx=e2.clientX-sx,dy=e2.clientY-sy;
        onUpdateSystem({...s,mmPos:{x:Math.max(0,start.x+dx),y:Math.max(0,start.y+dy)}});
      }else{
        const multi=e2.shiftKey||e2.ctrlKey||e2.metaKey;
        setSelected(prev=>{
          const next=multi?new Set(prev):new Set();
          if(multi&&prev.has(s.id))next.delete(s.id); else next.add(s.id);
          return next;
        });
      }
      setDragPreview(null);
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  }
  function toggleLink(s){
    if(!linkFrom){setLinkFrom(s.id);return;}
    if(linkFrom===s.id){setLinkFrom(null);return;}
    const a=linkFrom,b=s.id;
    const exists=links.some(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a));
    onPatchProject({sysLinks:exists?links:[...links,[a,b,'']]});
    setLinkFrom(null);
  }
  function removeLink(idx){
    onPatchProject({sysLinks:links.filter((_,i)=>i!==idx)});
  }
  function cycleLinkLabel(idx){
    const order=['','Sí','No'];
    onPatchProject({sysLinks:links.map((l,i)=>{
      if(i!==idx)return l;
      const cur=l[2]||'';
      return[l[0],l[1],order[(order.indexOf(cur)+1)%order.length]];
    })});
  }
  const positions={};
  systems.forEach((s,i)=>{positions[s.id]=getPos(s,i);});
  const maxX=Math.max(canvasW,...systems.map(s=>(positions[s.id]?.x||0)+CARD_W+60+(expandedId===s.id?PANEL_GAP+PANEL_W:0)),200);
  const maxY=Math.max(420,...systems.map(s=>(positions[s.id]?.y||0)+CARD_H+60+(expandedId===s.id?260:0)));

  function addNodeAtClick(ev){
    if(ev.target.closest('.sysmap-card')||ev.target.closest('.sysmap-panel')||ev.target.closest('.sysmap-exppanel')||!onBulkAdd)return;
    const pt=toCanvasCoords(ev);
    onBulkAdd([{id:uid(),name:'Nuevo módulo',phases:[],mmPos:{x:Math.max(0,pt.x-CARD_W/2),y:Math.max(0,pt.y-20)}}]);
  }

  function beginMarquee(ev){
    if(ev.button!==0||ev.target.closest('.sysmap-card')||linkFrom)return;
    const start=toCanvasCoords(ev);
    const multi=ev.shiftKey||ev.ctrlKey||ev.metaKey;
    if(!multi)setSelected(new Set());
    setMarquee({x0:start.x,y0:start.y,x1:start.x,y1:start.y});
    function onMove(e2){
      const cur=toCanvasCoords(e2);
      setMarquee(m=>m?{...m,x1:cur.x,y1:cur.y}:m);
    }
    function onUp(){
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      setMarquee(m=>{
        if(m){
          const x0=Math.min(m.x0,m.x1),x1=Math.max(m.x0,m.x1),y0=Math.min(m.y0,m.y1),y1=Math.max(m.y0,m.y1);
          if(x1-x0>4||y1-y0>4){
            const hit=systems.filter(s=>{
              const p=positions[s.id];
              return p&&p.x<x1&&p.x+CARD_W>x0&&p.y<y1&&p.y+CARD_H>y0;
            }).map(s=>s.id);
            setSelected(prev=>{
              const next=multi?new Set(prev):new Set();
              hit.forEach(id=>next.add(id));
              return next;
            });
          }
        }
        return null;
      });
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  }
  const mx0=marquee?Math.min(marquee.x0,marquee.x1):0;
  const my0=marquee?Math.min(marquee.y0,marquee.y1):0;
  const mw=marquee?Math.abs(marquee.x1-marquee.x0):0;
  const mh=marquee?Math.abs(marquee.y1-marquee.y0):0;

  return e('div',{className:'sysmap-overlay'+(embedded?' embedded':'')},
    e('div',{className:'sysmap-hdr'},
      e(DashIcon,{name:'map',size:14,color:'var(--accent2)'}),
      e('div',{className:'sysmap-title'},title||('Mapa de sistemas — '+(project&&project.name||''))),
      linkFrom&&e('div',{className:'sysmap-hint'},'Click en el punto de otra tarjeta para conectar · Esc cancela'),
      !linkFrom&&links.length>0&&e('div',{className:'sysmap-hint'},'Click en una conexión = alterna Sí/No · doble click la desconecta'),
      !linkFrom&&selected.size===0&&e('div',{className:'sysmap-hint'},'Doble clic en el mapa para agregar un módulo'),
      selected.size>0&&e('div',{className:'sysmap-hint'},selected.size+' seleccionado'+(selected.size>1?'s':'')+' · Supr para eliminar'),
      e('div',{className:'sysmap-zoom-ctrl',style:{marginLeft:'auto'}},
        e('button',{className:'tl-zoom-btn',onClick:()=>setZoom(z=>clampZoom(z-0.1)),title:'Menos zoom'},'−'),
        e('span',{className:'tl-zoom-val'},Math.round(zoom*100)+'%'),
        e('button',{className:'tl-zoom-btn',onClick:()=>setZoom(z=>clampZoom(z+0.1)),title:'Más zoom'},'+')
      ),

  );
}

// Convierte el formato antiguo (lista plana `components`) a una fase única,
// para que los sistemas creados antes de este cambio no pierdan sus datos.
function migrateSysPhases(system){
  if(system.phases)return system.phases;
  if(system.components&&system.components.length)return[{id:uid(),name:'Componentes',tasks:system.components.map(c=>({id:c.id,text:c.text,done:!!c.done}))}];
  return[];
}
// Encadena startDate/dueDate de un array de fases a partir de una fecha de
// inicio, respetando la duración (durationDays) que ya tenía cada una. Las
// fases sin duración quedan sin fecha (no rompen la cadena, simplemente no
// avanzan el cursor). Se usa tanto al aplicar una plantilla del Mapa de
// Sistemas como al recalcular fechas de un sistema ya creado.
function chainPhaseDates(phases,startFrom,bizOnly){
  let cursor=bizOnly?alignToBizDayKey(startFrom||todayDateKey()):(startFrom||todayDateKey());
  return (phases||[]).map(p=>{
    if(!Number.isFinite(p.durationDays)||p.durationDays<=0)return{...p,startDate:p.startDate||null,dueDate:p.dueDate||null};
    const startDate=cursor;
    const dueDate=addSpanDays(cursor,p.durationDays,bizOnly);
    cursor=nextChainCursor(dueDate,bizOnly);
    return{...p,startDate,dueDate};
  });
}
// Arma los "pasos" (steps) de un proyecto nuevo a partir del sistema actual,
// respetando el orden en que están puestos los módulos (o las fases, si el
// sistema no usa módulos) en este momento — el mismo orden que ve y arma el
// usuario en la vista de Lista. Cada módulo/fase pasa a ser UN paso del
// proyecto, con sus tareas como subtareas. Si el módulo/fase tiene días
// asignados, se encadenan las fechas a partir de `startFrom` (o hoy).
function stepsFromSystemForExecute(system,startFrom,bizOnly){
  let cursor=bizOnly?alignToBizDayKey(startFrom||todayDateKey()):(startFrom||todayDateKey());
  function nextDates(dur,isAutomation){
    if(!Number.isFinite(dur)||dur<=0){
      // Sin duración no hay fecha para encadenar — pero la fase ⚙ SIEMPRE
      // necesita un startDate para que la automatización tenga algo que
      // detectar, así que le asignamos la posición actual del cursor.
      return{startDate:isAutomation?cursor:null,dueDate:null};
    }
    const startDate=cursor;
    const dueDate=addSpanDays(cursor,dur,bizOnly);
    cursor=nextChainCursor(dueDate,bizOnly);
    return{startDate,dueDate};
  }
  // Si hay un módulo/fase marcado como evento de automatización, el trabajo
  // queda desatendido durante ~1 mes real — así que la ÚLTIMA fase (el cierre
  // del ciclo) no debe quedar pegada a los pocos días siguientes por el simple
  // encadenado de duraciones: se empuja a 1 mes después del término real de
  // la fase de automatización, conservando su propia duración si tenía.
  function pushClosingPastAutomation(list){
    const autoStep=list.find(s=>s.automation&&s.dueDate);
    if(!autoStep||list.length===0)return list;
    const last=list[list.length-1];
    if(last.automation)return list; // la propia fase de automatización es la última: nada que empujar
    const closeDue=addMonthsToDateKey(autoStep.dueDate,1);
    let closeStart=closeDue;
    if(last.startDate&&last.dueDate){
      const a=new Date(last.startDate+'T00:00:00'),b=new Date(last.dueDate+'T00:00:00');
      const dur=Math.max(0,Math.round((b-a)/86400000));
      closeStart=addDaysToDateKey(closeDue,-dur);
    }
    return list.map((s,i)=>i===list.length-1?{...s,startDate:closeStart,dueDate:closeDue}:s);
  }
  const modules=system.modules||[];
  if(modules.length>0){
    const built=modules.map(m=>{
      const{startDate,dueDate}=nextDates(m.durationDays,!!m.automation);
      return{
        id:uid(),name:m.name,startDate,dueDate,done:false,actLog:{},automation:!!m.automation,
        subtasks:(m.phases||[]).flatMap(p=>(p.tasks||[]).map(t=>({id:uid(),name:t.text,done:false})))
      };
    });
    return pushClosingPastAutomation(built);
  }
  const builtPhases=migrateSysPhases(system).map(p=>{
    const{startDate,dueDate}=nextDates(p.durationDays,!!p.automation);
    return{
      id:uid(),name:p.name,startDate,dueDate,done:false,actLog:{},automation:!!p.automation,
      subtasks:(p.tasks||[]).map(t=>({id:uid(),name:t.text,done:false}))
    };
  });
  return pushClosingPastAutomation(builtPhases);
}
// Editor de fases/tareas de UN módulo, en formato lista ordenable (arrastrar
// con ⠿), igual que el editor de "Fases propias" pero reutilizable y anidado
// dentro de cada fila de módulo en la vista de Lista.
// Modo simple (por defecto, 0 o 1 fase): se ven las tareas directo, sin
// mostrar el nombre de la fase — el título del módulo ya identifica el grupo.
// Modo avanzado (2+ fases): se muestran los encabezados de fase para poder
// organizar/reordenar sub-grupos dentro del mismo módulo.
function ModulePhasesListEditor({phases,onChange}){
  const[openIds,setOpenIds]=useState(()=>new Set());
  const[addingTaskFor,setAddingTaskFor]=useState(null);
  const[newTaskText,setNewTaskText]=useState('');
  const[showImport,setShowImport]=useState(false);
  const[importText,setImportText]=useState('');
  const[dragPhaseId,setDragPhaseId]=useState(null);
  const[dragTask,setDragTask]=useState(null);
  const[dropTaskTarget,setDropTaskTarget]=useState(null);
  const simple=phases.length<=1;
  const soloPhase=phases[0]||null;
  function toggleOpen(id){setOpenIds(prev=>{const next=new Set(prev);next.has(id)?next.delete(id):next.add(id);return next;});}
  function addPhase(){
    const ph={id:uid(),name:'Nueva fase',tasks:[]};
    onChange([...phases,ph]);
    setOpenIds(prev=>new Set(prev).add(ph.id));
  }
  function renamePhase(id,name){onChange(phases.map(p=>p.id===id?{...p,name}:p));}
  function deletePhase(id){onChange(phases.filter(p=>p.id!==id));}
  function reorderPhase(fromId,toId){
    if(fromId===toId)return;
    const from=phases.findIndex(p=>p.id===fromId),to=phases.findIndex(p=>p.id===toId);
    if(from<0||to<0)return;
    const next=phases.slice();
    const[moved]=next.splice(from,1);
    next.splice(to,0,moved);
    onChange(next);
  }
  // En modo simple, agregar una tarea crea la fase única al vuelo si no existe.
  function addTaskSimple(text){
    const t=(text||'').trim();
    if(!t)return;
    if(soloPhase){
      onChange(phases.map(p=>p.id===soloPhase.id?{...p,tasks:[...p.tasks,{id:uid(),text:t,done:false}]}:p));
    }else{
      onChange([{id:uid(),name:'General',tasks:[{id:uid(),text:t,done:false}]}]);
    }
    setNewTaskText('');
  }
  function addTask(phaseId,text){
    const t=(text||'').trim();
    if(!t)return;
    onChange(phases.map(p=>p.id===phaseId?{...p,tasks:[...p.tasks,{id:uid(),text:t,done:false}]}:p));
    setNewTaskText('');
  }
  function renameTask(phaseId,taskId,text){
    onChange(phases.map(p=>p.id===phaseId?{...p,tasks:p.tasks.map(t=>t.id===taskId?{...t,text}:t)}:p));
  }
  function deleteTask(phaseId,taskId){
    onChange(phases.map(p=>p.id===phaseId?{...p,tasks:p.tasks.filter(t=>t.id!==taskId)}:p));
  }
  function reorderTaskSimple(fromId,toId){
    if(!soloPhase||fromId===toId)return;
    const tasks=soloPhase.tasks.slice();
    const from=tasks.findIndex(t=>t.id===fromId),to=tasks.findIndex(t=>t.id===toId);
    if(from<0||to<0)return;
    const[moved]=tasks.splice(from,1);
    tasks.splice(to,0,moved);
    onChange(phases.map(p=>p.id===soloPhase.id?{...p,tasks}:p));
  }
  function moveTask(fromPhaseId,taskId,toPhaseId,beforeTaskId){
    const fromPhase=phases.find(p=>p.id===fromPhaseId);
    if(!fromPhase)return;
    const task=fromPhase.tasks.find(t=>t.id===taskId);
    if(!task)return;
    if(fromPhaseId===toPhaseId&&taskId===beforeTaskId)return;
    let next=phases.map(p=>p.id===fromPhaseId?{...p,tasks:p.tasks.filter(t=>t.id!==taskId)}:p);
    next=next.map(p=>{
      if(p.id!==toPhaseId)return p;
      const tasks=p.tasks.slice();
      const insertAt=beforeTaskId?tasks.findIndex(t=>t.id===beforeTaskId):-1;
      if(insertAt<0)tasks.push(task); else tasks.splice(insertAt,0,task);
      return{...p,tasks};
    });
    onChange(next);
  }
  function applyImport(mode){
    const parsed=parseTemplateText(importText).map(s=>({id:uid(),name:s.name,tasks:(s.subtasks||[]).map(t=>({id:uid(),text:t.name,done:false}))}));
    if(!parsed.length)return;
    const next=mode==='append'?[...phases,...parsed]:parsed;
    onChange(next);
    setOpenIds(prev=>{const s=new Set(mode==='append'?prev:[]);parsed.forEach(p=>s.add(p.id));return s;});
    setImportText('');setShowImport(false);
  }
  const importBox=showImport&&e('div',{className:'sysimport-box'},
    e('div',{style:{fontSize:10.5,color:'var(--text4)'}},'Pega texto: una línea numerada ("1. Nombre") es una fase, las líneas de abajo son sus tareas. Si pegas solo tareas sueltas, se agregan tal cual.'),
    e('textarea',{value:importText,onChange:ev=>setImportText(ev.target.value),placeholder:'Afinar guitarra\\nGrabar voz guía\\nEcualizar pistas'}),
    e('div',{style:{display:'flex',gap:6,justifyContent:'flex-end'}},
      e('button',{className:'ghost-btn',onClick:()=>{setShowImport(false);setImportText('');}},'Cancelar'),
      e('button',{className:'btn',style:{fontSize:11},disabled:!importText.trim(),onClick:()=>applyImport('append')},'＋ Agregar'),
      e('button',{className:'btn btn-primary',style:{fontSize:11},disabled:!importText.trim(),onClick:()=>applyImport('replace')},'Reemplazar todo')
    )
  );
  if(simple){
    const tasks=soloPhase?soloPhase.tasks:[];
    return e('div',{style:{paddingLeft:22,marginTop:4,display:'flex',flexDirection:'column',gap:4}},
      e('div',{style:{display:'flex',gap:6}},
        e('button',{className:'ghost-btn',style:{fontSize:10},onClick:()=>setShowImport(v=>!v)},'⤓ Importar texto'),
        e('button',{className:'ghost-btn',style:{fontSize:10},onClick:addPhase,title:'Organizar en sub-fases dentro de este módulo'},'＋ Sub-fase (avanzado)')
      ),
      importBox,
      tasks.length===0&&!showImport&&e('div',{className:'empty',style:{padding:'6px 0',fontSize:10.5}},'Sin tareas aún.'),
      e('div',{
        onDragOver:ev=>{if(dragTask){ev.preventDefault();if(tasks.length===0)setDropTaskTarget({phaseId:soloPhase&&soloPhase.id,taskId:null});}},
        onDrop:ev=>{ev.preventDefault();if(dragTask&&soloPhase)moveTask(dragTask.phaseId,dragTask.taskId,soloPhase.id,null);setDragTask(null);setDropTaskTarget(null);}
      },
        tasks.map(t=>e('div',{
          key:t.id,
          className:'sysphase-task-row'+(dragTask&&dragTask.taskId===t.id?' dragging':'')+(dropTaskTarget&&dropTaskTarget.taskId===t.id?' drop-before':''),
          draggable:true,
          onDragStart:ev=>{ev.stopPropagation();setDragTask({phaseId:soloPhase.id,taskId:t.id});},
          onDragEnd:()=>{setDragTask(null);setDropTaskTarget(null);},
          onDragOver:ev=>{if(dragTask){ev.preventDefault();ev.stopPropagation();setDropTaskTarget({phaseId:soloPhase.id,taskId:t.id});}},
          onDrop:ev=>{ev.preventDefault();ev.stopPropagation();if(dragTask)reorderTaskSimple(dragTask.taskId,t.id);setDragTask(null);setDropTaskTarget(null);}
        },
          e('span',{className:'sysphase-task-grip',title:'Arrastra para reordenar'},'⠿'),
          e('input',{className:'sysphase-task-text',value:t.text,onChange:ev=>renameTask(soloPhase.id,t.id,ev.target.value)}),
          e('button',{className:'ghost-btn',onClick:()=>deleteTask(soloPhase.id,t.id),title:'Eliminar tarea'},'✕')
        ))
      ),
      e('div',{className:'sysphase-add-row'},
        e('input',{
          value:newTaskText,
          placeholder:'Agregar tarea...',
          onChange:ev=>setNewTaskText(ev.target.value),
          onKeyDown:ev=>{if(ev.key==='Enter'){addTaskSimple(newTaskText);}}
        })
      )
    );
  }
  return e('div',{style:{paddingLeft:22,marginTop:4,display:'flex',flexDirection:'column',gap:4}},
    e('div',{style:{display:'flex',gap:6}},
      e('button',{className:'ghost-btn',style:{fontSize:10},onClick:()=>setShowImport(v=>!v)},'⤓ Importar texto'),
      e('button',{className:'ghost-btn',style:{fontSize:10},onClick:addPhase},'＋ Fase')
    ),
    importBox,
    phases.map(p=>{
      const isOpen=openIds.has(p.id);
      return e('div',{
        key:p.id,
        className:'sysphase'+(dragPhaseId===p.id?' dragging':''),
        draggable:true,
        onDragStart:ev=>{ev.stopPropagation();setDragPhaseId(p.id);},
        onDragEnd:()=>setDragPhaseId(null),
        onDragOver:ev=>{if(dragPhaseId&&dragPhaseId!==p.id)ev.preventDefault();},
        onDrop:ev=>{ev.preventDefault();if(dragPhaseId)reorderPhase(dragPhaseId,p.id);setDragPhaseId(null);}
      },
        e('div',{className:'sysphase-hdr',onClick:()=>toggleOpen(p.id)},
          e('span',{className:'sysphase-grip',title:'Arrastra para reordenar'},'⠿'),
          e('span',{className:'mm-chev'+(isOpen?' open':'')},'›'),
          e('input',{className:'sysphase-name',value:p.name,onClick:ev=>ev.stopPropagation(),onChange:ev=>renamePhase(p.id,ev.target.value)}),
          e('span',{className:'sysphase-count'},p.tasks.length),
          e('button',{className:'ghost-btn',onClick:ev=>{ev.stopPropagation();deletePhase(p.id);},title:'Eliminar fase'},'✕')
        ),
        isOpen&&e('div',{
          className:'sysphase-body',
          onDragOver:ev=>{if(dragTask){ev.preventDefault();if(p.tasks.length===0)setDropTaskTarget({phaseId:p.id,taskId:null});}},
          onDrop:ev=>{ev.preventDefault();if(dragTask)moveTask(dragTask.phaseId,dragTask.taskId,p.id,null);setDragTask(null);setDropTaskTarget(null);}
        },
          p.tasks.map(t=>e('div',{
            key:t.id,
            className:'sysphase-task-row'+(dragTask&&dragTask.taskId===t.id?' dragging':'')+(dropTaskTarget&&dropTaskTarget.phaseId===p.id&&dropTaskTarget.taskId===t.id?' drop-before':''),
            draggable:true,
            onDragStart:ev=>{ev.stopPropagation();setDragTask({phaseId:p.id,taskId:t.id});},
            onDragEnd:()=>{setDragTask(null);setDropTaskTarget(null);},
            onDragOver:ev=>{if(dragTask){ev.preventDefault();ev.stopPropagation();setDropTaskTarget({phaseId:p.id,taskId:t.id});}},
            onDrop:ev=>{ev.preventDefault();ev.stopPropagation();if(dragTask)moveTask(dragTask.phaseId,dragTask.taskId,p.id,t.id);setDragTask(null);setDropTaskTarget(null);}
          },
            e('span',{className:'sysphase-task-grip',title:'Arrastra para reordenar o mover a otra fase'},'⠿'),
            e('input',{className:'sysphase-task-text',value:t.text,onChange:ev=>renameTask(p.id,t.id,ev.target.value)}),
            e('button',{className:'ghost-btn',onClick:()=>deleteTask(p.id,t.id),title:'Eliminar tarea'},'✕')
          )),
          e('div',{className:'sysphase-add-row'},
            e('input',{
              value:addingTaskFor===p.id?newTaskText:'',
              placeholder:'Agregar tarea...',
              onFocus:()=>{setAddingTaskFor(p.id);setNewTaskText('');},
              onChange:ev=>setNewTaskText(ev.target.value),
              onKeyDown:ev=>{if(ev.key==='Enter'){addTask(p.id,newTaskText);}}
            })
          )
        )
      );
    })
  );
}
// Vista de Lista de los módulos de un sistema: cada módulo es una fila
// arrastrable (⠿) para fijar el orden de ejecución, con un campo de días
// (para encadenar fechas al ejecutar) y sus tareas desplegables debajo —
// igual que se arman las plantillas, pero editando en vivo directamente
// sobre el sistema (sin pasos de "guardar plantilla" aparte).
function ModuleListEditor({modules,onReorderModules,onUpdateModule,onRemoveModule,onAddModule}){
  const[openModId,setOpenModId]=useState(null);
  const[dragId,setDragId]=useState(null);
  function reorder(fromId,toId){
    if(fromId===toId)return;
    const from=modules.findIndex(m=>m.id===fromId),to=modules.findIndex(m=>m.id===toId);
    if(from<0||to<0)return;
    const next=modules.slice();
    const[moved]=next.splice(from,1);
    next.splice(to,0,moved);
    onReorderModules(next);
  }
  function setDuration(id,val){
    const n=val===''?null:Math.max(0,parseInt(val,10)||0);
    onUpdateModule(id,{durationDays:n});
  }
  return e('div',{style:{display:'flex',flexDirection:'column',gap:6}},
    e('div',{style:{fontSize:10.5,color:'var(--text3)',lineHeight:1.5,marginBottom:2}},
      'Arrastra ⠿ para fijar el orden de ejecución. Asígnale días a cada módulo (opcional) para que, al ejecutar, se calculen las fechas en cadena desde el día de inicio que elijas. Marca ⚙ en el módulo desde el cual el trabajo queda desatendido: cuando llegue esa fecha, se creará automáticamente el próximo proyecto.'
    ),
    modules.length===0&&e('div',{className:'empty',style:{padding:'8px 0'}},'Sin módulos aún.'),
    modules.map((m,i)=>{
      const isOpen=openModId===m.id;
      return e('div',{
        key:m.id,
        className:'sysphase'+(dragId===m.id?' dragging':''),

            style:{width:38,fontSize:11,padding:'3px 4px',textAlign:'center',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,color:'var(--text0)',flexShrink:0}
          }),
          e('span',{className:'sysphase-count'},(m.phases||[]).reduce((a,p)=>a+p.tasks.length,0)),
          e('button',{
            className:'ghost-btn',
            title:m.automation?'Punto de automatización — clic para quitar':'Marcar como punto de automatización (desde aquí, el trabajo queda desatendido y se puede lanzar el próximo proyecto)',
            style:{color:m.automation?'var(--accent2)':'var(--text3)'},
            onClick:ev=>{ev.stopPropagation();onUpdateModule(m.id,{automation:!m.automation});}
          },'⚙'),
          e('button',{className:'ghost-btn',onClick:ev=>{ev.stopPropagation();onRemoveModule(m.id);},title:'Quitar módulo'},'✕')
        ),
        isOpen&&e(ModulePhasesListEditor,{
          phases:migrateSysPhases(m),

        }),
        m.automation&&e('div',{style:{fontSize:9.5,color:'var(--accent2)',padding:'0 9px 8px 40px'}},'⚙ Punto de automatización — desde aquí el trabajo queda desatendido y se dispara el siguiente proyecto')
      );
    }),
    e('button',{className:'ghost-btn',onClick:onAddModule,title:'Nuevo módulo'},'＋ Añadir módulo')

}
// Panel lateral (flotante, a la derecha) con el detalle de un sistema: fases
// plegables con sus tareas, importación desde texto plano (mismo formato que
// las plantillas de proyecto: "1. Nombre de fase" + líneas sueltas = tareas),
// y experimentos A/B.
function flattenModulesToPhases(system){
  return (system.modules||[]).map(m=>({
    id:m.id||uid(),
    name:m.name,
    automation:!!m.automation,
    tasks:(m.phases||[]).flatMap(p=>(p.tasks||[]).map(t=>({id:t.id||uid(),text:t.text,done:!!t.done})))
  }));
}
function SystemDetailDrawer({system,onUpdateSystem,onClose,onExecute}){
  const[phases,setPhases]=useState(()=>[...migrateSysPhases(system),...flattenModulesToPhases(system)]);
  const migratedRef=useRef(false);
  useEffect(()=>{
    if(migratedRef.current)return;
    migratedRef.current=true;
    if((system.modules||[]).length>0){
      const merged=[...migrateSysPhases(system),...flattenModulesToPhases(system)];
      const updated={...system,phases:merged,modules:[],moduleLinks:[]};
      delete updated.components;
      onUpdateSystem(updated);
      setPhases(merged);
    }
  },[]);
  const[openIds,setOpenIds]=useState(()=>new Set());
  const[showRecalcSys,setShowRecalcSys]=useState(false);
  const[addingTaskFor,setAddingTaskFor]=useState(null);
  const[newTaskText,setNewTaskText]=useState('');
  const[showImport,setShowImport]=useState(false);
  const[importText,setImportText]=useState('');
  const[showExpForm,setShowExpForm]=useState(false);
  const[showCycles,setShowCycles]=useState(false);
  const[expObjetivo,setExpObjetivo]=useState('');
  const[expA,setExpA]=useState('');
  const[expB,setExpB]=useState('');
  const[expDate,setExpDate]=useState(dayKey());
  const experiments=(system.experiments||[]).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const color=system.color||'#4a9de0';
  const[dragPhaseId,setDragPhaseId]=useState(null); // fase que se está arrastrando
  const[dragTask,setDragTask]=useState(null); // {phaseId,taskId} tarea que se está arrastrando
  const[dropTaskTarget,setDropTaskTarget]=useState(null); // {phaseId,taskId|null} indicador visual de destino

  function commitPhases(next,bizOnly){
    const updated={...system,phases:next};
    if(bizOnly!==undefined)updated.datesBizOnly=bizOnly;
    delete updated.components;
    onUpdateSystem(updated);
    setPhases(next);
  }
  function togglePhaseOpen(id){
    setOpenIds(prev=>{const next=new Set(prev);next.has(id)?next.delete(id):next.add(id);return next;});
  }
  function addPhase(){
    const ph={id:uid(),name:'Nueva fase',tasks:[]};
    commitPhases([...phases,ph]);
    setOpenIds(prev=>new Set(prev).add(ph.id));
  }
  function renamePhase(id,name){
    commitPhases(phases.map(p=>p.id===id?{...p,name}:p));
  }
  function setPhaseDuration(id,val){
    const n=val===''?null:Math.max(0,parseInt(val,10)||0);
    commitPhases(phases.map(p=>p.id===id?{...p,durationDays:n}:p));
  }
  function deletePhase(id){
    commitPhases(phases.filter(p=>p.id!==id));
  }
  function reorderPhase(fromId,toId){
    if(fromId===toId)return;
    const from=phases.findIndex(p=>p.id===fromId),to=phases.findIndex(p=>p.id===toId);
    if(from<0||to<0)return;
    const next=phases.slice();
    const[moved]=next.splice(from,1);
    next.splice(to,0,moved);
    commitPhases(next);
  }
  function addTask(phaseId,text){
    const t=(text||'').trim();
    if(!t)return;
    commitPhases(phases.map(p=>p.id===phaseId?{...p,tasks:[...p.tasks,{id:uid(),text:t,done:false}]}:p));
    setNewTaskText('');
  }
  function renameTask(phaseId,taskId,text){
    commitPhases(phases.map(p=>p.id===phaseId?{...p,tasks:p.tasks.map(t=>t.id===taskId?{...t,text}:t)}:p));
  }
  function deleteTask(phaseId,taskId){
    commitPhases(phases.map(p=>p.id===phaseId?{...p,tasks:p.tasks.filter(t=>t.id!==taskId)}:p));
  }
  // Mueve una tarea a otra fase y/o posición — arrastra libremente entre fases,
  // reordena arriba/abajo. beforeTaskId=null la deja al final de la fase destino.
  function moveTask(fromPhaseId,taskId,toPhaseId,beforeTaskId){
    const fromPhase=phases.find(p=>p.id===fromPhaseId);
    if(!fromPhase)return;
    const task=fromPhase.tasks.find(t=>t.id===taskId);
    if(!task)return;
    if(fromPhaseId===toPhaseId&&taskId===beforeTaskId)return;
    let next=phases.map(p=>p.id===fromPhaseId?{...p,tasks:p.tasks.filter(t=>t.id!==taskId)}:p);
    next=next.map(p=>{
      if(p.id!==toPhaseId)return p;
      const tasks=p.tasks.slice();
      const insertAt=beforeTaskId?tasks.findIndex(t=>t.id===beforeTaskId):-1;
      if(insertAt<0)tasks.push(task); else tasks.splice(insertAt,0,task);
      return{...p,tasks};
    });
    commitPhases(next);
  }
  // Reusa el mismo parser que las plantillas de proyecto: una línea numerada
  // ("1.", "2)", "3 -") es una fase; cualquier otra línea, una tarea de esa fase.
  function parsedImport(){
    return parseTemplateText(importText).map(s=>({
      id:uid(),name:s.name,tasks:(s.subtasks||[]).map(t=>({id:uid(),text:t.name,done:false}))
    }));
  }
  function applyImport(mode){
    const parsed=parsedImport();
    if(!parsed.length)return;
    const next=mode==='append'?[...phases,...parsed]:parsed;
    commitPhases(next);
    setOpenIds(prev=>{const s=new Set(mode==='append'?prev:[]);parsed.forEach(p=>s.add(p.id));return s;});
    setImportText('');
    setShowImport(false);
  }
  function addExperiment(){
    if(!expObjetivo.trim())return;
    onUpdateSystem({...system,phases,experiments:[...(system.experiments||[]),{
      id:uid(),objetivo:expObjetivo.trim(),opcionA:expA.trim(),opcionB:expB.trim(),fecha:expDate,resultado:null,createdAt:Date.now()
    }]});

  }
  function setResultado(id,val){
    onUpdateSystem({...system,phases,experiments:(system.experiments||[]).map(x=>x.id===id?{...x,resultado:x.resultado===val?null:val}:x)});
  }
  function deleteExperiment(id){
    onUpdateSystem({...system,phases,experiments:(system.experiments||[]).filter(x=>x.id!==id)});
  }
  function closeCycle(){
    if(!confirm('¿Cerrar este ciclo? Se guarda un resumen (fases, tareas y experimentos con resultado) y se limpian los experimentos para arrancar el próximo lanzamiento.'))return;
    const cycles=system.cycles||[];
    const snapshot={
      id:uid(),
      closedAt:Date.now(),
      phaseSummary:phases.map(p=>({name:p.name,taskCount:p.tasks.length})),
      experiments:experiments.map(x=>({objetivo:x.objetivo,opcionA:x.opcionA,opcionB:x.opcionB,resultado:x.resultado,fecha:x.fecha}))
    };
    onUpdateSystem({...system,phases,experiments:[],cycles:[...cycles,snapshot]});
  }

  const[showExecuteModal,setShowExecuteModal]=useState(false);
  const closeSuggestion=useMemo(()=>systemAutomationCloseSuggestion({...system,phases}),[system,phases]);
  const canExecute=onExecute&&phases.some(p=>(p.tasks||[]).length>0);
  const[executeStart,setExecuteStart]=useState(()=>todayDateKey());
  const[executeBizOnly,setExecuteBizOnly]=useState(()=>!!system.datesBizOnly);
  function confirmExecute(){
    if(!onExecute)return;

    if(!steps.length)return;
    if(!!system.datesBizOnly!==executeBizOnly)onUpdateSystem({...system,phases,datesBizOnly:executeBizOnly});
    setShowExecuteModal(false);
    onExecute(steps,executeBizOnly);

        e('div',{className:'sysdrawer-title'},system.name),
        e('div',{style:{marginLeft:'auto',fontSize:10,color:'var(--text3)'}},'⚙ activa automáticamente'),
        e('label',{title:'Los días asignados a cada fase se cuentan solo lun-vie; si la fecha de inicio cae en fin de semana se corre al lunes. Se usa siempre que se ejecute o encienda este sistema.',style:{display:'flex',alignItems:'center',gap:5,fontSize:10,color:'var(--text3)',cursor:'pointer'}},
          e('input',{type:'checkbox',checked:!!system.datesBizOnly,onChange:ev=>onUpdateSystem({...system,phases,datesBizOnly:ev.target.checked})}),
          'Excluir fines de semana'
        ),
        phases.some(p=>p.startDate&&p.dueDate)&&e('button',{className:'rec-trigger-btn',title:'Cambiar la fecha de inicio y recalcular todas las fases con fecha, sin perder nada',onClick:()=>setShowRecalcSys(true)},e(DashIcon,{name:'refresh',size:12})),
        onExecute&&e('button',{className:'btn btn-primary',style:{fontSize:11},disabled:!canExecute,title:canExecute?'Crea un proyecto nuevo usando el orden actual de fases y tareas':'Agrega al menos una tarea para poder ejecutar',onClick:()=>{setExecuteStart(todayDateKey());setShowExecuteModal(true);}},'▶ Ejecutar'),
        e('button',{className:'modal-x',onClick:onClose},'✕')
      ),
      e('div',{className:'sysdrawer-body'},
        e('div',{className:'sysdrawer-section-lbl'},
          e('span',null,'Fases'),

            }},'Recalcular')
          )
        )
      );
    })()
  );
}

function MultiDonut({segments,size=170,stroke=26}){
  const total=segments.reduce((a,s)=>a+s.value,0)||1;
  let acc=0;
  const stops=segments.map(s=>{
    const from=acc/total*360;
    acc+=s.value;
    const to=acc/total*360;
    return `${s.color} ${from}deg ${to}deg`;
  }).join(', ');
  return e('div',{style:{position:'relative',width:size,height:size,flexShrink:0}},
    e('div',{style:{width:size,height:size,borderRadius:'50%',background:segments.length?`conic-gradient(${stops})`:'var(--bg4)'}}),
    e('div',{style:{position:'absolute',inset:stroke,borderRadius:'50%',background:'var(--bg1)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},
      e('div',{style:{fontSize:18,fontWeight:600,fontFamily:"'JetBrains Mono',monospace",color:'var(--text0)'}},fmtS(total)),
      e('div',{style:{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.5}},'Total')
    )
  );
}

function AreaChart({buckets,width=560,height=170}){
  const max=Math.max(1,...buckets.map(b=>b.v));
  const padL=30,padB=18,padT=6;
  const innerW=width-padL-8,innerH=height-padB-padT;
  const step=innerW/Math.max(1,buckets.length-1);
  const pts=buckets.map((b,i)=>[padL+i*step,padT+innerH-(b.v/max)*innerH]);
  const line=pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)},${padT+innerH} L${pts[0][0].toFixed(1)},${padT+innerH} Z`;
  const gridVals=[0,0.25,0.5,0.75,1];
  return e('svg',{width:'100%',height,viewBox:`0 0 ${width} ${height}`,style:{display:'block'}},
    e('defs',null,e('linearGradient',{id:'homeAreaGrad',x1:0,y1:0,x2:0,y2:1},
      e('stop',{offset:'0%',stopColor:'var(--accent2)',stopOpacity:.35}),
      e('stop',{offset:'100%',stopColor:'var(--accent2)',stopOpacity:0})
    )),
    gridVals.map(g=>e('line',{key:g,x1:padL,x2:width-8,y1:padT+innerH*(1-g),y2:padT+innerH*(1-g),stroke:'var(--border2)',strokeWidth:1})),
    gridVals.map(g=>e('text',{key:'t'+g,x:padL-6,y:padT+innerH*(1-g)+3,textAnchor:'end',fontSize:9,fill:'var(--text4)'},fmtHM(Math.round(max*g)))),
    buckets.length>1&&e('path',{d:area,fill:'url(#homeAreaGrad)',stroke:'none'}),
    buckets.length>1&&e('path',{d:line,fill:'none',stroke:'var(--accent2)',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}),
    buckets.map((b,i)=>i%2===0&&e('text',{key:'lbl'+i,x:pts[i][0],y:height-4,textAnchor:'middle',fontSize:9,fill:'var(--text4)'},b.lbl))
  );
}

function HomeResumen(props){
  const{
