      systemOptions.length>0&&e('select',{className:'finput',style:{marginBottom:6},value:sysName,onChange:ev=>setSysName(ev.target.value)},
        systemOptions.map(nm=>e('option',{key:nm,value:nm},nm))
      ),
      e('textarea',{
        className:'board-notes-input',style:{width:'100%'},rows:3,
        placeholder:'Qué estás probando y con qué sistema (ej. campañas publicitarias)...',
        value:text,onChange:ev=>setText(ev.target.value),
        onKeyDown:ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();addExperiment();}}
      }),
      e('button',{className:'btn btn-primary',style:{marginTop:6},onClick:addExperiment},'Guardar experimento')
    ),
    e('div',{className:'exp-panel-list'},
      experiments.length===0&&e('div',{className:'empty',style:{padding:'10px 4px',fontSize:11}},'Sin experimentos registrados en este lanzamiento todavía.'),
      experiments.map(x=>e('div',{key:x.id,className:'board-note-item'},
        x.system&&e('div',{style:{fontSize:10,color:'var(--accent2)',fontWeight:600,marginBottom:3}},x.system),
        e('div',{className:'board-note-text'},x.text),
        e('div',{className:'board-note-ftr'},
          e('span',null,new Date(x.createdAt).toLocaleDateString('es-CL',{day:'2-digit',month:'short'})),
          e('button',{className:'ghost-btn',onClick:()=>deleteExperiment(x.id)},'✕')
        )
      ))
    )
  );
}

// ── ORDEN GLOBAL DE VISTAS (Lista / Línea de tiempo / Mapa mental / Pizarra / Experimentos) ──
// Este orden se guarda a nivel de plataforma: aplica por igual a proyectos y cuentas.
// El primer elemento del orden es siempre la vista por defecto al abrir cualquier proyecto/cuenta.
const VIEWTAB_ORDER_KEY='chronos_viewtab_order_v1';
const VIEWTAB_DEFAULT_ORDER=['list','timeline','mindmap','board','notebook','experiments'];
function getViewTabOrder(){
  try{
    const raw=localStorage.getItem(VIEWTAB_ORDER_KEY);
    if(!raw)return VIEWTAB_DEFAULT_ORDER.slice();
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed))return VIEWTAB_DEFAULT_ORDER.slice();
    // aseguremos que cualquier vista nueva que no esté en el orden guardado se añada al final
    const merged=parsed.filter(k=>VIEWTAB_DEFAULT_ORDER.includes(k));
    VIEWTAB_DEFAULT_ORDER.forEach(k=>{if(!merged.includes(k))merged.push(k);});
    return merged;
  }catch(err){return VIEWTAB_DEFAULT_ORDER.slice();}
}
function setViewTabOrder(order){
  try{localStorage.setItem(VIEWTAB_ORDER_KEY,JSON.stringify(order));}catch(err){}
}
function TaskStepsModal({task,noun,onClose,onSave,onUpdateTask,templates,onAddTemplate,onUpdateTemplate,onDeleteTemplate,pSystems}){
  const[steps,setSteps]=useState(task.steps||[]);
  const[editingTaskName,setEditingTaskName]=useState(false);
  const[taskNameVal,setTaskNameVal]=useState(task.name);
  useEffect(()=>{setTaskNameVal(task.name);},[task.name]);
  function commitTaskName(){
    setEditingTaskName(false);
    const nm=taskNameVal.trim();
    if(nm&&nm!==task.name&&onUpdateTask)onUpdateTask({name:nm});
    else setTaskNameVal(task.name);
  }
  const[newName,setNewName]=useState('');
  const[newDate,setNewDate]=useState('');
  const[newStartDate,setNewStartDate]=useState('');
  const[showRec,setShowRec]=useState(false);
  const stepsRef=useRef(steps);
  useEffect(()=>{stepsRef.current=steps;},[steps]);
  const rowRefs=useRef({});
  const[dragFill,setDragFill]=useState(null); // {startIndex,startDate,endIndex,tipDate,tipX,tipY}
  const[tabOrder,setTabOrder]=useState(()=>getViewTabOrder()); // orden de los botones de vista, aplica a nivel de plataforma
  const[view,setView]=useState(()=>getViewTabOrder()[0]); // 'list' | 'timeline' | 'mindmap' | 'board' | 'experiments' — la vista por defecto es siempre la primera del orden guardado
  const[dragTab,setDragTab]=useState(null); // key del botón que se está arrastrando
  const[dragOverTab,setDragOverTab]=useState(null); // key del botón sobre el que se pasa el drag
  function moveTab(fromKey,toKey){
    if(fromKey===toKey)return;
    setTabOrder(cur=>{
      const arr=cur.slice();
      const fromIdx=arr.indexOf(fromKey);
      const toIdx=arr.indexOf(toKey);
      if(fromIdx===-1||toIdx===-1)return cur;
      arr.splice(fromIdx,1);
      arr.splice(toIdx,0,fromKey);
      setViewTabOrder(arr); // persiste a nivel de plataforma: afecta todos los proyectos y cuentas
      return arr;
    });
  }
  const[tlDrag,setTlDrag]=useState(null); // {ids,clickedId,startX,orig:{id:date},cur:{id:date},moved,tipX,tipY}
  const[selectedIds,setSelectedIds]=useState(()=>new Set());
  const[showDoneSteps,setShowDoneSteps]=useState(false);
  const[showTplMgr,setShowTplMgr]=useState(false);
  const[showSaveTpl,setShowSaveTpl]=useState(false);
  const[pendingTpl,setPendingTpl]=useState(null); // plantilla esperando fecha de inicio
  const[showRecalc,setShowRecalc]=useState(false); // recalcular fechas de todo el proyecto desde un nuevo inicio
  function applyTemplate(tpl){
    if(!tpl)return;
    const hasDurations=(tpl.steps||[]).some(s=>Number.isFinite(s.durationDays)&&s.durationDays>0);
    if(hasDurations){
      setPendingTpl(tpl); // pide fecha de inicio antes de encadenar las fechas
    }else{
      doApplyTemplate(tpl,null);
    }
  }
  function doApplyTemplate(tpl,startFrom,bizOnly){
    const built=templateToSteps(tpl,startFrom,bizOnly);
    if(bizOnly!==undefined)onUpdateTask({datesBizOnly:bizOnly});
    if(steps.length===0){
      commit(built);
    }else if(confirm('Ya hay fases en este proyecto. ¿Agregar las fases de "'+tpl.name+'" al final, en vez de reemplazar las existentes?')){
      commit([...steps,...built]);
    }
    setPendingTpl(null);
  }
  // Recalcula las fechas de TODAS las fases a partir de una nueva fecha de
  // inicio, conservando la duración que ya tenía cada una (dueDate-startDate)
  // y el orden en que están — sin tocar nombres, tareas, estado "hecho" ni
  // actLog. Las fases sin fecha quedan igual (no participan del encadenado).
  // Sirve para cuando el proyecto arrancó más tarde (o más temprano) de lo
  // planeado y hay que correr todo el calendario sin perder el trabajo ya hecho.
  function recalcFromStart(newStart,bizOnly){
    let cursor=bizOnly?alignToBizDayKey(newStart):newStart;
    const next=steps.map(s=>{
      if(!s.startDate||!s.dueDate)return s; // sin fecha original: se deja tal cual
      const a=new Date(s.startDate+'T00:00:00'),b=new Date(s.dueDate+'T00:00:00');
      const dur=Math.max(0,Math.round((b-a)/86400000));
      const startDate=cursor;
      const dueDate=addSpanDays(cursor,dur,bizOnly);
      cursor=nextChainCursor(dueDate,bizOnly); // nunca se pisa con la fase siguiente
      return{...s,startDate,dueDate};
    });
    commit(next);
    onUpdateTask({datesBizOnly:bizOnly});
    setShowRecalc(false);
  }
  // Sugerencia de cierre real: entre las fases YA EJECUTADAS de este proyecto,
  // busca la marcada como evento de automatización (⚙) y toma su fecha de
  // TÉRMINO real (no una proyección) — la sugerencia es 1 mes después de eso.
  // Ya no se muestra el aviso textual de "sugerencia de cierre" (se quitó por
  // ruido visual) — se deja el resaltado de la fila marcada como automatización
  // en la lista de fases como único indicador de esa fase.
  const realAutomationStep=steps.find(s=>s.automation&&s.dueDate);
  const realCloseSuggestion=realAutomationStep?addMonthsToDateKey(realAutomationStep.dueDate,1):null;
  const[mmOpenId,setMmOpenId]=useState(null);
  const[mmAddingId,setMmAddingId]=useState(null);
  const[mmNewSub,setMmNewSub]=useState('');
  const mmSubDragIdx=useRef(null);
  const[mmCanvasW,setMmCanvasW]=useState(1200);
  const mmCanvasRef=useRef(null);
  const[mmDragPreview,setMmDragPreview]=useState(null); // {id,x,y}
  const MM_CARD_W=238,MM_GAP_X=56,MM_GAP_Y=48,MM_ROW_H=170;
  useEffect(()=>{
    if(view!=='mindmap')return;
    function measure(){ if(mmCanvasRef.current) setMmCanvasW(mmCanvasRef.current.clientWidth||1200); }
    measure();
    window.addEventListener('resize',measure);
    return()=>window.removeEventListener('resize',measure);
  },[view]);
  function mmDefaultPos(idx){
    const cols=Math.max(1,Math.floor((mmCanvasW+MM_GAP_X)/(MM_CARD_W+MM_GAP_X)));
    const row=Math.floor(idx/cols),col=idx%cols;
    return{x:col*(MM_CARD_W+MM_GAP_X)+4,y:row*MM_ROW_H+4};
  }
  function mmGetPos(id,idx){
    if(mmDragPreview&&mmDragPreview.id===id)return{x:mmDragPreview.x,y:mmDragPreview.y};
    const s=steps.find(x=>x.id===id);
    return(s&&s.mmPos)?s.mmPos:mmDefaultPos(idx);
  }
  function beginNodeDrag(stepId,idx,ev){
    if(ev.button!==0)return;
    ev.preventDefault();
    const start=mmGetPos(stepId,idx);
    const startX=ev.clientX,startY=ev.clientY;
    let moved=false;
    function onMove(e2){
      const dx=e2.clientX-startX,dy=e2.clientY-startY;
      if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
      setMmDragPreview({id:stepId,x:Math.max(0,start.x+dx),y:Math.max(0,start.y+dy)});
    }
    function onUp(e2){
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      if(moved){
        const dx=e2.clientX-startX,dy=e2.clientY-startY;
        updateStep(stepId,{mmPos:{x:Math.max(0,start.x+dx),y:Math.max(0,start.y+dy)}});
        setMmDragPreview(null);
      }else{
        setMmDragPreview(null);
        setMmOpenId(mmOpenId===stepId?null:stepId);
        setMmAddingId(null);setMmNewSub('');
      }
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  }
  const DAY_W=64;

  function commit(next){ setSteps(next); onSave(next); }
  function addStep(){
    if(!newName.trim())return;
    // Fecha automática pero editable: si no se especificó, se sugiere en base a la fase anterior.
    const finalEnd=newDate||suggestPhaseDate(steps);
    const finalStart=newStartDate||finalEnd;
    commit([...steps,{id:uid(),name:newName.trim(),startDate:finalStart,dueDate:finalEnd,done:false,automation:false,subtasks:[],actLog:{}}]);
    setNewName('');setNewDate('');setNewStartDate('');
  }
  function updateStep(id,patch){ commit(steps.map(s=>s.id===id?{...s,...patch}:s)); }
  function deleteStep(id){ commit(steps.filter(s=>s.id!==id)); }
  // Registrar avance/no-avance de HOY a nivel de todo el proyecto (no por fase). Click de nuevo = deshacer.
  const todayKey=dayKey();
  const projectActToday=(task.actLog||{})[todayKey];
  function setProjectActivity(val){
    if(!onUpdateTask)return;
    const log={...(task.actLog||{})};
    if(log[todayKey]===val) delete log[todayKey]; else log[todayKey]=val;
    onUpdateTask({actLog:log});
  }
  // Registrar avance/no-avance de HOY en una fase. Click de nuevo sobre el mismo botón = deshacer.
  function setStepActivity(id,val){
    const today=dayKey();
    commit(steps.map(s=>{
      if(s.id!==id)return s;
      const log={...(s.actLog||{})};
      if(log[today]===val) delete log[today]; else log[today]=val;
      return{...s,actLog:log};
    }));
  }

  // Mapa mental: subtareas por paso
  function addSubtask(stepId,name){
    if(!name.trim())return;
    commit(steps.map(s=>s.id===stepId?{...s,subtasks:[...(s.subtasks||[]),{id:uid(),name:name.trim(),done:false}]}:s));
  }
  function updateSubtask(stepId,subId,patch){
    commit(steps.map(s=>s.id===stepId?{...s,subtasks:(s.subtasks||[]).map(sub=>sub.id===subId?{...sub,...patch}:sub)}:s));
  }
  function deleteSubtask(stepId,subId){
    commit(steps.map(s=>s.id===stepId?{...s,subtasks:(s.subtasks||[]).filter(sub=>sub.id!==subId)}:s));
  }
  function reorderSubtasks(stepId,fromIdx,toIdx){
    commit(steps.map(s=>{
      if(s.id!==stepId)return s;
      const subs=[...(s.subtasks||[])];
      const[moved]=subs.splice(fromIdx,1);
      subs.splice(toIdx,0,moved);
      return{...s,subtasks:subs};
    }));
  }

  function addDays(dateStr,n){
    const d=new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtPretty(dateStr){
    if(!dateStr)return'';
    const[y,m,d]=dateStr.split('-');
    return `${d}-${m}-${y}`;
  }

  // Excel-style fill handle: press the corner square of a date cell and drag
  // up/down over other rows — each row crossed gets startDate + rowOffset days.
  // Tracked via a real mousemove listener + row bounding boxes (robust to fast drags),
  // rather than relying on onMouseEnter which can miss rows when the pointer moves quickly.
  function beginFillDrag(index,ev){
    ev.preventDefault();ev.stopPropagation();
    const startDate=steps[index].dueDate;
    if(!startDate)return;
    setDragFill({startIndex:index,startDate,endIndex:index,tipDate:startDate,tipX:ev.clientX,tipY:ev.clientY});
  }
  useEffect(()=>{
    if(!dragFill)return;
    const{startIndex,startDate}=dragFill;
    function rowAt(y){
      let found=startIndex;
      for(const key of Object.keys(rowRefs.current)){
        const el=rowRefs.current[key];
        if(!el)continue;
        const r=el.getBoundingClientRect();
        if(y>=r.top&&y<=r.bottom){found=Number(key);break;}
      }
      return found;
    }
    function onMove(ev){
      const idx=rowAt(ev.clientY);
      const lo=Math.min(startIndex,idx),hi=Math.max(startIndex,idx);
      setSteps(prev=>prev.map((s,i)=>(i<lo||i>hi)?s:{...s,dueDate:addDays(startDate,i-startIndex)}));
      setDragFill(df=>df?{...df,endIndex:idx,tipDate:addDays(startDate,idx-startIndex),tipX:ev.clientX,tipY:ev.clientY}:df);
    }
    function onUp(){ setDragFill(null); onSave(stepsRef.current); }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[dragFill&&dragFill.startIndex,dragFill&&dragFill.startDate]);

  // Timeline: click a pill to select it (highlighted); click again to deselect;
  // "Seleccionar todas" selects every dated step. Dragging any pill that's part
  // of a multi-selection moves the whole group together, preserving the gaps
  // between their dates. Dragging a lone / unselected pill just moves that one.
  // A single final commit happens on mouseup (no per-pixel Supabase pushes).
  function toggleSelect(id){
    setSelectedIds(prev=>{
      const next=new Set(prev);
      if(next.has(id))next.delete(id);else next.add(id);
      return next;
    });
  }
  function selectAllDated(){
    setSelectedIds(new Set(steps.filter(s=>s.dueDate).map(s=>s.id)));
  }
  function clearSelection(){ setSelectedIds(new Set()); }

  // mode: 'move' (arrastra toda la barra), 'start' (extiende/achica desde la izquierda),
  // 'end' (extiende/achica desde la derecha). Solo 'move' soporta selección múltiple.
  function beginTimelineDrag(id,mode,ev){
    ev.preventDefault();ev.stopPropagation();
    const s=steps.find(x=>x.id===id);
    if(!s||!s.dueDate)return;
    const group=(mode==='move'&&selectedIds.has(id)&&selectedIds.size>1)
      ?steps.filter(x=>selectedIds.has(x.id)&&x.dueDate).map(x=>x.id)
      :[id];
    const orig={};group.forEach(gid=>{
      const g=steps.find(x=>x.id===gid);
      orig[gid]={start:g.startDate||g.dueDate,end:g.dueDate};
    });
    setTlDrag({ids:group,clickedId:id,mode,startX:ev.clientX,orig,cur:{...orig},moved:false,tipX:ev.clientX,tipY:ev.clientY});
  }
  useEffect(()=>{
    if(!tlDrag)return;
    const{ids,orig,startX,mode}=tlDrag;
    function onMove(ev){
      const deltaDays=Math.round((ev.clientX-startX)/DAY_W);
      const moved=Math.abs(ev.clientX-startX)>=4;
      const cur={};
      ids.forEach(gid=>{
        const o=orig[gid];
        if(mode==='move'){
          cur[gid]={start:addDays(o.start,deltaDays),end:addDays(o.end,deltaDays)};
        }else if(mode==='start'){
          let ns=addDays(o.start,deltaDays);
          if(ns>o.end)ns=o.end; // no puede cruzar el término
          cur[gid]={start:ns,end:o.end};
        }else{ // 'end'
          let ne=addDays(o.end,deltaDays);
          if(ne<o.start)ne=o.start; // no puede cruzar el inicio
          cur[gid]={start:o.start,end:ne};
        }
      });
      setTlDrag(d=>d?{...d,cur,moved:d.moved||moved,tipX:ev.clientX,tipY:ev.clientY}:d);
    }
    function onUp(){
      setTlDrag(d=>{
        if(d){
          if(!d.moved&&d.mode==='move'){
            toggleSelect(d.clickedId);
          }else if(d.moved){
            const next=steps.map(s=>d.cur[s.id]!==undefined?{...s,startDate:d.cur[s.id].start,dueDate:d.cur[s.id].end}:s);
            commit(next);
          }
        }
        return null;
      });
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[tlDrag&&tlDrag.ids&&tlDrag.ids.join(','),tlDrag&&tlDrag.startX,tlDrag&&tlDrag.mode]);

  const total=steps.length;
  const doneCount=steps.filter(s=>s.done).length;
  const pct=total>0?Math.round(doneCount/total*100):0;
  const fillLo=dragFill?Math.min(dragFill.startIndex,dragFill.endIndex):null;
  const fillHi=dragFill?Math.max(dragFill.startIndex,dragFill.endIndex):null;

  // Timeline geometry, only computed when needed
  let tl=null;
  if(view==='timeline'){
    const toTs=d=>new Date(d+'T00:00:00').getTime();
    const today=dayKey();
    // Las fases ya completadas se archivan de la línea de tiempo (no suman
    // desorden); "Ver completados" en la barra superior las vuelve a mostrar.
    const dated=steps.filter(s=>s.dueDate&&(showDoneSteps||!s.done));
    const allTs=dated.flatMap(s=>[toTs(s.startDate||s.dueDate),toTs(s.dueDate)]).concat([toTs(today)]);
    const minTs=Math.min(...allTs)-2*86400000;
    const maxTs=Math.max(...allTs)+5*86400000;
    const numDays=Math.round((maxTs-minTs)/86400000)+1;
    const dayIdx=dateStr=>Math.round((toTs(dateStr)-minTs)/86400000);
    const days=Array.from({length:numDays},(_,i)=>new Date(minTs+i*86400000));
    // Empaquetado en carriles: las fases que NO se superponen en el tiempo van
    // "de corrido" en el mismo carril (una al lado de la otra); solo se abre
    // un carril nuevo hacia abajo cuando dos fases sí se cruzan en fechas.
    const sorted=dated.slice().sort((a,b)=>toTs(a.startDate||a.dueDate)-toTs(b.startDate||b.dueDate));
    const laneEnds=[];
    const rows=sorted.map(s=>{
      const startTs=toTs(s.startDate||s.dueDate),endTs=toTs(s.dueDate);
      let lane=laneEnds.findIndex(endTsLane=>startTs>endTsLane);
      if(lane===-1){lane=laneEnds.length;laneEnds.push(endTs);}
      else laneEnds[lane]=endTs;
      return{...s,_lane:lane};
    });
    const laneCount=Math.max(1,laneEnds.length);
    tl={today,dated,minTs,numDays,dayIdx,days,rows,laneCount};
  }

  return e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)onClose();}},
    e('div',{className:'modal',style:{width:'min(1440px,96vw)',maxWidth:'96vw',height:'92vh',maxHeight:'92vh'}},
      e('div',{className:'modal-head'},
        e('div',{style:{flex:1,minWidth:0}},
          editingTaskName
            ?e('input',{
                className:'finput',style:{fontSize:15,fontWeight:600,padding:'4px 8px',width:280},
                value:taskNameVal,autoFocus:true,
                onFocus:ev=>ev.target.select(),
                onChange:ev=>setTaskNameVal(ev.target.value),
                onBlur:commitTaskName,
                onKeyDown:ev=>{if(ev.key==='Enter')commitTaskName();if(ev.key==='Escape'){setTaskNameVal(task.name);setEditingTaskName(false);}}
              })
            :e('div',{
                className:'modal-title',
                style:onUpdateTask?{cursor:'pointer'}:undefined,
                title:onUpdateTask?'Click para renombrar':undefined,
                onClick:()=>onUpdateTask&&setEditingTaskName(true)
              },task.name,onUpdateTask&&e('span',{style:{fontSize:11,color:'var(--text4)',marginLeft:6}},'✎')),
          e('div',{className:'modal-sub'},'Fases de '+(noun||'este proyecto')+' · '+doneCount+'/'+total+' completadas')
        ),
        onUpdateTask&&e('div',{className:'proj-act-row',style:{marginLeft:'auto',marginRight:14}},
          e('button',{
            className:'act-btn yes'+(projectActToday==='yes'?' on':''),
            title:'Avancé hoy en este proyecto',
            onClick:()=>setProjectActivity('yes')
          },'✓'),
          e('button',{
            className:'act-btn no'+(projectActToday==='no'?' on':''),
            title:'No avancé hoy en este proyecto — pero quedó registrado',
            onClick:()=>setProjectActivity('no')
          },'✕')
        ),
        e('button',{className:'modal-x',onClick:onClose},'✕')
      ),
      e('div',{className:'view-tabs'},
        (()=>{
          const TAB_DEFS={
            list:{title:'Lista',icon:e(DashIcon,{name:'list',size:13})},
            timeline:{title:'Línea de tiempo',icon:e(DashIcon,{name:'clock',size:13})},
            mindmap:{title:'Mapa mental',icon:e(DashIcon,{name:'network',size:13})},
            board:{title:'Pizarra y notas',icon:e(DashIcon,{name:'image',size:13})},
            notebook:{title:'Libreta',icon:e(DashIcon,{name:'note',size:13})},
            experiments:{title:'Experimentos de este lanzamiento',icon:e(SysMiniIcon,{name:'flask',size:13})}
          };
          return tabOrder.filter(k=>k!=='experiments'||(pSystems||[]).length>0).map(k=>{
            const def=TAB_DEFS[k];
            if(!def)return null;
            return e('button',{
              key:k,
              className:'vtab vtab-icon'+(view===k?' active':'')+(dragTab===k?' dragging':'')+(dragOverTab===k&&dragTab&&dragTab!==k?' drag-over':''),

              onDragLeave:()=>{setDragOverTab(cur=>cur===k?null:cur);},
              onDrop:ev=>{ev.preventDefault();if(dragTab)moveTab(dragTab,k);setDragTab(null);setDragOverTab(null);}
            },def.icon);
          });
        })(),
        steps.some(s=>s.startDate&&s.dueDate)&&e('button',{className:'rec-trigger-btn',title:'Cambiar la fecha de inicio y recalcular todas las fases, sin perder nada',onClick:()=>setShowRecalc(true)},e(DashIcon,{name:'refresh',size:12}))
      ),

      e('div',{className:'modal-body',style:{flex:1,minHeight:0}},
        view==='list'&&e('div',{className:'sheet',style:dragFill?{userSelect:'none'}:undefined},
          e('div',{className:'sheet-row sheet-hdr'},
            e('div',{className:'sheet-cell'},'Fase'),
            e('div',{className:'sheet-cell sheet-cell-date',style:{display:'flex',gap:6}},
              e('span',{style:{flex:1}},'Inicio'),
              e('span',{style:{flex:1}},'Término')
            ),
            e('div',{className:'sheet-cell sheet-cell-status'},'')
          ),
          steps.length===0&&e('div',{className:'empty',style:{padding:'16px 2px'}},'Sin fases aún. Agrega la primera abajo.'),
          steps.length>0&&!showDoneSteps&&steps.every(s=>s.done)&&e('div',{className:'empty',style:{padding:'16px 2px'}},'Todas las fases están completadas. Usa "Ver completados" para revisarlas.'),
          (()=>{ // fase activa = la primera fase sin completar, en el orden de la lista
            const activeStep=steps.find(s=>!s.done);
            return steps.filter(s=>showDoneSteps||!s.done).map(s=>{
            const idx=steps.indexOf(s);
            const inFillRange=dragFill&&idx>=fillLo&&idx<=fillHi;
            const today=dayKey();
            const isActivePhase=!!activeStep&&activeStep.id===s.id;
            return e('div',{
              key:s.id,
              ref:el=>{rowRefs.current[idx]=el;},
              className:'sheet-row'+(s.done?' done':'')+(inFillRange?' fill-range':'')+(isActivePhase?' active-phase-row':''),

            },

                e('button',{
                  className:'step-done-toggle'+(s.done?' on':''),

                  onClick:()=>updateStep(s.id,{done:!s.done})
                },s.done?'✓':''),
                e('input',{className:'sheet-input sheet-input-name',value:s.name,onChange:ev=>updateStep(s.id,{name:ev.target.value})}),
                s.automation&&e('span',{
                  title:'Evento de automatización — se marca desde el Mapa de Sistemas',
                  style:{fontSize:11,color:'var(--accent2)',flexShrink:0}
                },'⚙'),
                (s.subtasks||[]).length>0&&e('span',{style:{fontSize:9.5,color:'var(--text4)',flexShrink:0},title:'Tareas dentro de esta fase — visibles en Mapa mental'},(s.subtasks||[]).length+' tareas')
              ),
              e('div',{className:'sheet-cell sheet-cell-date',style:{display:'flex',gap:6}},
                e('input',{
                  className:'sheet-input sheet-input-date',type:'date',style:{flex:1},
                  value:s.startDate||'',
                  title:'Fecha de inicio de la fase',

                    className:'sheet-input sheet-input-date',type:'date',
                    value:s.dueDate||'',
                    title:'Fecha de término de la fase',

                      const v=ev.target.value||null;
                      if(v&&s.startDate&&v<s.startDate) updateStep(s.id,{dueDate:v,startDate:v});
                      else updateStep(s.id,{dueDate:v});
                    }
                  }),
                  s.dueDate&&e('div',{className:'sheet-fill-handle',title:'Arrastra para rellenar días consecutivos',onMouseDown:ev=>beginFillDrag(idx,ev)})
                )
              ),
              e('div',{className:'sheet-cell sheet-cell-status',style:{display:'flex',alignItems:'center',gap:6}},
                e('button',{className:'rem-del',onClick:()=>deleteStep(s.id),title:'Eliminar fase'},'✕')
              )
            );
          });})(),
          e('div',{className:'sheet-row sheet-add-row'},
            e('div',{className:'sheet-cell'},
              e('input',{className:'sheet-input sheet-input-name',placeholder:'+ Agregar fase...',value:newName,onChange:ev=>setNewName(ev.target.value),onKeyDown:ev=>{if(ev.key==='Enter')addStep();}})
            ),
            e('div',{className:'sheet-cell sheet-cell-date',style:{display:'flex',gap:6}},
              e('input',{className:'sheet-input sheet-input-date',type:'date',style:{flex:1},value:newStartDate,onChange:ev=>setNewStartDate(ev.target.value),title:'Inicio (opcional)'}),
              e('input',{className:'sheet-input sheet-input-date',type:'date',style:{flex:1},value:newDate,onChange:ev=>setNewDate(ev.target.value),title:'Término (opcional, se autosugiere)'})
            ),
            e('div',{className:'sheet-cell sheet-cell-status'},
              e('button',{className:'btn btn-primary',style:{fontSize:11,padding:'5px 14px',width:'100%'},onClick:addStep},'Agregar')
            )
          )
        ),
        view==='timeline'&&e('div',{className:'tl-wrap'},
          e('div',{className:'tl-toolbar'},
            e('button',{className:'btn',style:{fontSize:10.5,padding:'4px 10px'},onClick:selectAllDated,disabled:tl.dated.length===0},'Seleccionar todas'),
            selectedIds.size>0&&e('button',{className:'btn',style:{fontSize:10.5,padding:'4px 10px'},onClick:clearSelection},'Deseleccionar ('+selectedIds.size+')'),
            selectedIds.size>1&&e('span',{className:'tl-hint'},'Arrastra cualquiera de las '+selectedIds.size+' seleccionadas para moverlas juntas'),
            doneCount>0&&e('button',{className:'btn',style:{fontSize:10.5,padding:'4px 10px',marginLeft:'auto'},onClick:()=>setShowDoneSteps(v=>!v)},showDoneSteps?'Ocultar completadas ('+doneCount+')':'Ver completadas ('+doneCount+')')
          ),
          tl.dated.length<total-(showDoneSteps?0:doneCount)&&e('div',{className:'tl-note'},(total-tl.dated.length-(showDoneSteps?0:doneCount))+' fase(s) sin fecha — asígnales una en la vista Lista para verlas aquí'),
          tl.rows.length===0&&e('div',{className:'empty',style:{padding:'20px 2px'}},'Sin fases con fecha aún.'),
          tl.rows.length>0&&e('div',{className:'tl-scroll'},
            e('div',{className:'tl-canvas',style:{width:tl.numDays*DAY_W,height:38+tl.laneCount*40+14}},
              e('div',{className:'tl-days'},tl.days.map((d,i)=>{
                const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                const isToday=key===tl.today;
                const wd=WEEK_DAYS.find(w=>w.k===DOW_KEYS[d.getDay()]);
                return e('div',{key:i,className:'tl-day'+(isToday?' today':''),style:{left:i*DAY_W,width:DAY_W}},
                  e('span',{className:'tl-day-dow'},wd?wd.l:''),
                  e('span',{className:'tl-day-num'},d.getDate())
                );
              })),
              e('div',{className:'tl-today-line',style:{left:tl.dayIdx(tl.today)*DAY_W}}),
              tl.rows.map(s=>{
                const isDragging=tlDrag&&tlDrag.ids.includes(s.id);
                const shownStart=isDragging?tlDrag.cur[s.id].start:(s.startDate||s.dueDate);
                const shownEnd=isDragging?tlDrag.cur[s.id].end:s.dueDate;
                const isSelected=selectedIds.has(s.id);
                const left=tl.dayIdx(shownStart)*DAY_W+4;

                return e('div',{

            const positions=steps.map((s,idx)=>mmGetPos(s.id,idx));
            const maxX=Math.max(...positions.map(p=>p.x))+MM_CARD_W+40;
            const maxY=Math.max(...positions.map(p=>p.y))+MM_ROW_H+40;
            const canvasH=Math.max(maxY,420);
            return e('div',{className:'mm-canvas-scroll'},
              e('div',{className:'mm-canvas',ref:mmCanvasRef,style:{minHeight:canvasH,width:'100%'}},
                e('svg',{className:'mm-svg',style:{width:Math.max(maxX,mmCanvasW),height:canvasH}},
                  steps.slice(0,-1).map((s,idx)=>{
                    const a=positions[idx],b=positions[idx+1];
                    const sameRow=Math.abs(a.y-b.y)<24;
                    const CARD_BOTTOM=112;
                    let d;
                    if(sameRow){
                      const x1=a.x+MM_CARD_W,y1=a.y+34,x2=b.x,y2=b.y+34;
                      const mx=(x1+x2)/2;
                      d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
                    }else{
                      const x1=a.x+MM_CARD_W/2,y1=a.y+CARD_BOTTOM,x2=b.x+MM_CARD_W/2,y2=b.y;
                      const my=y1+Math.max(16,(y2-y1)/2);
                      const r=10;
                      const dirX=x2>x1?1:-1;
                      d=`M${x1},${y1} V${my-r} Q${x1},${my} ${x1+r*dirX},${my} H${x2-r*dirX} Q${x2},${my} ${x2},${my+r} V${y2}`;
                    }
                    return e('path',{
                      key:s.id,

                          className:'mm-sub-row',

                            ev.preventDefault();

                          e('span',{className:'mm-sub-handle'},'⋮⋮'),
                          e('input',{className:'mm-sub-check',type:'checkbox',checked:sub.done,onChange:()=>updateSubtask(s.id,sub.id,{done:!sub.done})}),
                          e('input',{className:'mm-sub-name-input'+(sub.done?' done':''),value:sub.name,onChange:ev=>updateSubtask(s.id,sub.id,{name:ev.target.value})}),

                        )),

                          autoFocus:true,
                          className:'mm-add-input',
                          placeholder:'Nombre de la actividad',
                          value:mmNewSub,
                          onChange:ev=>setMmNewSub(ev.target.value),
                          onKeyDown:ev=>{if(ev.key==='Enter'){addSubtask(s.id,mmNewSub);setMmNewSub('');}if(ev.key==='Escape'){setMmAddingId(null);setMmNewSub('');}},
                          onBlur:()=>{if(mmNewSub.trim())addSubtask(s.id,mmNewSub);setMmNewSub('');setMmAddingId(null);}
                        }):e('button',{className:'mm-add-trigger',onClick:()=>setMmAddingId(s.id)},'+ agregar actividad')
                      )
                    )

    dragFill&&e('div',{className:'sheet-fill-tooltip',style:{left:dragFill.tipX+14,top:dragFill.tipY-12}},fmtPretty(dragFill.tipDate)),
    tlDrag&&tlDrag.moved&&e('div',{className:'sheet-fill-tooltip',style:{left:tlDrag.tipX+14,top:tlDrag.tipY-12}},
      (()=>{

    ),
    showRec&&e(RecurrenceModal,{

      onAddTemplate:tpl=>onAddTemplate&&onAddTemplate(tpl),
      onUpdateTemplate:(id,patch)=>onUpdateTemplate&&onUpdateTemplate(id,patch),

    }),
    pendingTpl&&(()=>{
      // Pide la fecha de inicio para encadenar las duraciones estimadas de
      // cada fase de la plantilla (fase 1 arranca acá, la 2 donde termina la 1, etc.)
      const totalDays=(pendingTpl.steps||[]).reduce((a,s)=>a+(Number.isFinite(s.durationDays)&&s.durationDays>0?s.durationDays:0),0);
      return e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)setPendingTpl(null);}},

            ),
            e('div',{className:'fg'},e('label',{className:'flabel'},'Fecha de inicio'),
              e('input',{className:'finput',type:'date',id:'tpl-start-date',defaultValue:todayDateKey()})
            ),
            e('label',{style:{display:'flex',alignItems:'center',gap:7,fontSize:11.5,color:'var(--text2)',marginTop:8,cursor:'pointer'}},

            e('button',{className:'btn btn-primary',onClick:()=>{

          )
        )
      );
    })(),
    showRecalc&&(()=>{
      // Cambia la fecha de inicio del proyecto y recalcula toda la cadena de

      // recrear nada — nombres, tareas, avance y actLog quedan intactos.
      const datedSteps=steps.filter(s=>s.startDate&&s.dueDate);
      const currentFirst=datedSteps.reduce((min,s)=>!min||s.startDate<min?s.startDate:min,null);
      return e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)setShowRecalc(false);}},

function EditableLabel({value,onSave}){
  const[editing,setEditing]=useState(false);
  const[val,setVal]=useState(value);
  useEffect(()=>{setVal(value);},[value]);
  function commit(){
    setEditing(false);
    const t=val.trim();
    if(t&&t!==value)onSave(t);else setVal(value);
  }
  if(editing){
    return e('input',{className:'label-edit-input',value:val,autoFocus:true,onFocus:ev=>ev.target.select(),onChange:ev=>setVal(ev.target.value),onBlur:commit,onKeyDown:ev=>{if(ev.key==='Enter')commit();if(ev.key==='Escape'){setVal(value);setEditing(false);}}});
  }
  return e('span',{className:'dash-panel-title editable-label',onClick:()=>setEditing(true),title:'Click para renombrar'},
    value,e('span',{className:'editable-label-pencil'},'✎')
  );
}

function StatCard({icon,color,label,value,sub,progress,sparkline,custom,onChangeCustom,onResetCustom}){
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  const editable=!!onChangeCustom;
  useEffect(()=>{
    if(!open)return;
    function h(ev){if(ref.current&&!ref.current.contains(ev.target))setOpen(false);}
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[open]);
  const activeColor=custom?.color||color;
  const activeIconKey=custom?.icon||null;
  return e('div',{className:'dash-stat-card',ref},
    e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
      e('div',{className:'dash-stat-lbl'},label),
      icon&&e('div',{
        className:'dash-stat-icon'+(editable?' editable':''),
        style:{color:activeColor,background:activeColor+'1c'},
        onClick:editable?()=>setOpen(v=>!v):undefined,
        title:editable?'Cambiar ícono y color':undefined
      },
        activeIconKey?e(ProjIconSVG,{iconKey:activeIconKey,size:12,color:'currentColor'}):e(DashIcon,{name:icon,size:12,color:'currentColor'})
      )
    ),
    e('div',{style:{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:8}},
      e('div',{className:'dash-stat-val'},value),
      sparkline&&e(Sparkline,{points:sparkline,color:activeColor})
    ),
    sub&&e('div',{className:'dash-stat-sub'},sub),
    progress&&e('div',{className:'progress-track',style:{marginTop:2}},e('div',{className:'progress-fill',style:{width:Math.min(100,Math.round(progress.value/Math.max(1,progress.max)*100))+'%',background:activeColor||'var(--accent)'}})),
    open&&e('div',{className:'stat-icon-pop',onClick:ev=>ev.stopPropagation()},
      e('div',{className:'swatch-row'},COLORS.map(c=>e('div',{key:c,className:`swatch${activeColor===c?' on':''}`,style:{background:c},onClick:()=>onChangeCustom(activeIconKey||'target',c)}))),
      e('div',{className:'stat-icon-pop-grid'},['target','activity','clipboard','settings','star','heart','sun','rocket','calendar','lightning','chart','folder'].map(k=>
        e('div',{
          key:k,
          className:'stat-icon-pop-item',
          title:k,
          style:{border:activeIconKey===k?'2px solid '+activeColor:'1px solid var(--border2)',background:activeIconKey===k?activeColor+'22':'var(--bg4)'},
          onClick:()=>onChangeCustom(k,activeColor)
        },e(ProjIconSVG,{iconKey:k,size:13,color:activeIconKey===k?activeColor:'var(--text3)'}))
      )),
      onResetCustom&&e('button',{className:'stat-icon-pop-reset',onClick:()=>{onResetCustom();setOpen(false);}},'Restablecer ícono original')
    )
  );
}

// ── SONIDO GLOBAL DE CLICK ──
// Cualquier elemento interactivo (botones, links, checks, celdas, ítems con
// cursor:pointer, etc.) emite el sonido de click configurado, aunque el
// componente no lo dispare manualmente. Si el propio código ya llamó a
// playUI('click') para ese mismo click, _uiClickGuard evita que suene doble.
document.addEventListener('click',function(ev){
  if(_uiClickGuard){_uiClickGuard=false;return;}
  const direct=ev.target.closest('button, a, select, summary, [role="button"], input[type="checkbox"], input[type="radio"]');
  let el=direct;
  if(!el){
    let cur=ev.target,depth=0;
    while(cur&&cur.nodeType===1&&depth<8){
      let cursor='';
      try{cursor=getComputedStyle(cur).cursor;}catch(err){}
      if(cursor==='pointer'){el=cur;break;}
      cur=cur.parentElement;depth++;
    }
  }
  if(el)playUI('click');
},false);

createRoot(document.getElementById('root')).render(e(App));
