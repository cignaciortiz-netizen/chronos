    fmtWhen,fmtS,fmt,pStats
  }=props;

  const[blockView,setBlockView]=useState(()=>load('chr4_blockview','vertical'));
  function changeBlockView(v){setBlockView(v);save('chr4_blockview',v);}
  const[openFlagMenu,setOpenFlagMenu]=useState(null);
  const[projCtxMenu,setProjCtxMenu]=useState(null); // {x,y,proj} — right-click menu on a recent project
  useEffect(()=>{
    if(!projCtxMenu)return;
    const close=()=>setProjCtxMenu(null);
    window.addEventListener('click',close);
    window.addEventListener('scroll',close,true);
    return()=>{window.removeEventListener('click',close);window.removeEventListener('scroll',close,true);};
  },[projCtxMenu]);
  useEffect(()=>{
    if(!openFlagMenu)return;
    const close=()=>setOpenFlagMenu(null);
    window.addEventListener('click',close);
    return()=>window.removeEventListener('click',close);
  },[openFlagMenu]);

  const today=dayKey();
  const activeProjects=projects.filter(p=>p.status!=='archived');
  const dayLabelStr=dateFromDayKey(selectedDay).toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});
  function shiftDay(delta){
    const d=dateFromDayKey(selectedDay);
    d.setUTCDate(d.getUTCDate()+delta);
    setSelectedDay(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
  }

  // Tareas de hoy
  const tasksToday=tasks.filter(t=>t.dueDate===today);
  const doneTasksToday=tasksToday.filter(t=>t.status==='done');

  // Hábitos de hoy
  const allTodayHabits=habits.filter(h=>habitOccursOn(h,dateFromDayKey(today)));
  const doneHabitsToday=allTodayHabits.filter(h=>(h.log||[]).includes(today));

  // Racha — días consecutivos con algo de tiempo enfocado
  function dayHasFocus(k){return sessions.some(s=>s.day===k&&s.endAt&&s.duration>0);}
  let streak=0;
  {
    let d=dateFromDayKey(today);
    if(!dayHasFocus(today))d=new Date(d.getTime()-86400000);
    for(let i=0;i<365;i++){
      const k=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
      if(dayHasFocus(k)){streak++;d=new Date(d.getTime()-86400000);}else break;
    }
  }

  // Tiempo por proyecto (hoy) — para el donut
  const projTimes=activeProjects.map(p=>({proj:p,secs:pStats(p).todaySecs})).filter(r=>r.secs>0).sort((a,b)=>b.secs-a.secs);
  const topProjTimes=projTimes.slice(0,5);
  const otherSecs=projTimes.slice(5).reduce((a,r)=>a+r.secs,0);
  const donutSegments=[
    ...topProjTimes.map(r=>({label:r.proj.name,value:r.secs,color:r.proj.color})),
    ...(otherSecs>0?[{label:'Otros',value:otherSecs,color:'var(--text4)'}]:[])
  ];
  const projTimesTotal=donutSegments.reduce((a,s)=>a+s.value,0)||1;

  // Actividad en el tiempo — buckets por hora (08:00-22:00)
  const HOURS=Array.from({length:15},(_,i)=>8+i);
  const hourBuckets=HOURS.map(h=>{
    const secs=sessions.filter(s=>s.day===selectedDay&&s.endAt&&new Date(s.endAt*1000).getHours()===h).reduce((a,s)=>a+s.duration,0);
    return{v:secs,lbl:String(h).padStart(2,'0')+':00'};
  });

  // Resumen semanal
  const week=currentWeekDays();
  const weekTotals=week.map(w=>({...w,secs:sessions.filter(s=>s.day===w.key&&s.endAt).reduce((a,s)=>a+s.duration,0)}));
  const weekTotalSecs=weekTotals.reduce((a,w)=>a+w.secs,0);
  const weekMax=Math.max(1,...weekTotals.map(w=>w.secs));
  const FULL_DAY_LABEL={mon:'Lun',tue:'Mar',wed:'Mié',thu:'Jue',fri:'Vie',sat:'Sáb',sun:'Dom'};

  // Recordatorios vencidos de cualquier proyecto, para el bloque del resumen —
  // misma noción de "vencido" que ya enciende la campanita roja de cada proyecto.
  const dueNotes=activeProjects.flatMap(p=>((notes&&notes[p.id])||[]).filter(noteReminderDue).map(n=>({...n,projectId:p.id,projName:p.name}))).sort((a,b)=>a.remindAt-b.remindAt);

    const pSess=sessions.filter(s=>s.projectId===p.id&&s.endAt).sort((a,b)=>b.endAt-a.endAt);
    const habitDue=habits.some(h=>h.projectId===p.id&&habitOccursOn(h,dateFromDayKey(today))&&!(h.log||[]).includes(today)&&!(h.skipLog||[]).includes(today));
    const systemDue=systems.some(s=>s.projectId===p.id&&s.status!=='paused'&&s.nextRun&&s.nextRun<=Date.now());
    // Solo cuenta como "pendiente de hoy" una tarea cuya fecha sea HOY.
    // Antes usaba dueDate<=today, así que cualquier tarea vieja con fecha
    // pasada quedaba marcada como pendiente de hoy para siempre (incluso
    // meses después), inflando la alerta en proyectos que en verdad no

    const taskDue=tasks.some(t=>t.projectId===p.id&&t.status!=='done'&&(
      t.dueDate===today||
      (t.steps||[]).some(s=>stepNeedsAction(s,today,!!(t.actLog&&t.actLog[today])))
    ));
    const noteDue=((notes&&notes[p.id])||[]).some(noteReminderDue);
    const hasAlert=habitDue||systemDue||taskDue||noteDue;
    const alertTitle=habitDue?'Hábito por cumplir hoy':systemDue?'Sistema por revisar':noteDue&&!taskDue?'Recordatorio vencido':'Tarea pendiente por cumplir';
    return{proj:p,lastActivity:pSess[0]?pSess[0].endAt*1000:0,todaySecs:pStats(p).todaySecs,hasAlert,alertTitle};
  }).sort((a,b)=>{

    return b.lastActivity-a.lastActivity;
  });

    ),
    e('div',{className:'dash-body'},

            const ROW_H=40;
            function timeToY(tsSec){
              const d=new Date(tsSec*1000);
              const h=d.getHours()+d.getMinutes()/60;
              return Math.max(0,(h-HOURS[0]))*ROW_H;
            }
            function renderBlock(b,isLive){
              const p=projects.find(x=>x.id===b.projectId);
              if(!p)return null;
              const top=timeToY(b.startAt);
              const height=Math.max(20,(b.duration/3600)*ROW_H);
              return e('div',{key:isLive?'live':b.id,style:{
                position:'absolute',top,left:50,right:6,minHeight:height,
                background:p.color+(isLive?'30':'20'),borderLeft:'3px solid '+p.color,
                borderRadius:4,padding:'3px 8px',overflow:'hidden',display:'flex',flexDirection:'column',justifyContent:'center'
              }},
                e('div',{style:{fontSize:10.5,color:'var(--text0)',fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',display:'flex',alignItems:'center',gap:6}},p.name,isLive&&e('span',{className:'proj-live-dot'})),
                height>28&&e('div',{style:{fontSize:9,color:'var(--text3)'}},fmtBlockTime(b.startAt)+' – '+(isLive?'en curso':fmtBlockTime(b.startAt+b.duration)))
              );
            }
            return e('div',{className:'dash-panel-body',style:{maxHeight:360,overflowY:'auto',display:'block',padding:'8px 8px 12px'}},
              e('div',{style:{position:'relative',height:HOURS.length*ROW_H,marginTop:2}},
                HOURS.map((h,i)=>e(React.Fragment,{key:h},
                  e('span',{style:{position:'absolute',top:i*ROW_H-6,left:0,fontSize:8.5,color:'var(--text4)',fontFamily:"'JetBrains Mono',monospace"}},String(h).padStart(2,'0')+':00'),
                  e('div',{style:{position:'absolute',top:i*ROW_H,left:44,right:0,borderTop:'1px dashed var(--border2)'}})
                )),
                sortedBlocks.map(b=>renderBlock(b,false)),
                liveBlock&&renderBlock(liveBlock,true)
              )
            );
          })(),

          blockView==='river'&&(()=>{
            const dayStart=HOURS[0],dayEnd=HOURS[HOURS.length-1]+1,span=(dayEnd-dayStart)*3600;
            function pct(tsSec){
              const d=new Date(tsSec*1000);
              const secs=(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())-dayStart*3600;
              return Math.min(100,Math.max(0,secs/span*100));
            }
            function pctMin(min){return Math.min(100,Math.max(0,(min-dayStart*60)/(span/60)*100));}
            const allR=[...sortedBlocks,...(liveBlock?[liveBlock]:[])];
            const planned=blocksForDay(blocks,selectedDay).slice().sort((a,b)=>a.startMin-b.startMin);
            return e('div',{style:{padding:'14px 16px 16px'}},

              // Franja de horario personalizado (planificado)
              e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
                e('span',{style:{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.5}},'Horario planificado'),
                e('button',{onClick:()=>{playUI('click');onNewBlock();},style:{fontSize:9,color:'var(--accent2)',background:'none',border:'none',cursor:'pointer',padding:'2px 4px'}},'+ personalizar')
              ),
              e('div',{style:{position:'relative',height:14,borderRadius:7,overflow:'hidden',background:'var(--bg3)',marginBottom:14}},
                planned.length===0&&e('div',{style:{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8.5,color:'var(--text4)'}},'Sin horario definido'),
                planned.map(b=>e('div',{
                  key:b.id,title:b.label+' · '+fmtHM(b.startMin*60)+'–'+fmtHM(b.endMin*60)+(b.reminder?' · recordatorio activo':''),
                  onClick:()=>{playUI('click');onEditBlock(b);},
                  style:{position:'absolute',top:0,bottom:0,left:pctMin(b.startMin)+'%',width:Math.max(0.6,pctMin(b.endMin)-pctMin(b.startMin))+'%',
                    background:b.color+'99',cursor:'pointer',minWidth:2,borderRight:'1px solid var(--bg0)'}
                }))
              ),

              // Franja de tiempo real
              e('div',{style:{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.5,marginBottom:6}},'Tiempo real'),
              e('div',{style:{position:'relative',height:16,borderRadius:8,overflow:'hidden',background:'var(--bg3)'}},
                allR.map(b=>{
                  const p=projects.find(x=>x.id===b.projectId);
                  if(!p)return null;
                  const isLive=b.id==='live';
                  const left=pct(b.startAt);
                  const width=Math.max(0.6,isLive?pct(Math.floor(Date.now()/1000))-left:pct(b.startAt+b.duration)-left);
                  const t=b.taskId?tasks.find(x=>x.id===b.taskId):null;
                  return e('div',{key:isLive?'live':b.id,title:p.name+(t?' · '+t.name:'')+' · '+(isLive?'en curso':fmtS(b.duration)),style:{
                    position:'absolute',top:0,bottom:0,left:left+'%',width:width+'%',background:p.color,minWidth:2
                  }});
                })
              ),
              e('div',{style:{display:'flex',justifyContent:'space-between',marginTop:6}},
                e('span',{style:{fontSize:8.5,color:'var(--text4)',fontFamily:"'JetBrains Mono',monospace"}},String(dayStart).padStart(2,'0')+':00'),
                e('span',{style:{fontSize:8.5,color:'var(--text4)',fontFamily:"'JetBrains Mono',monospace"}},String(dayEnd).padStart(2,'0')+':00')
              ),
              e('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px 14px',marginTop:10}},
                allR.length===0&&e('div',{className:'empty'},'Sin bloques registrados este día.'),
                allR.map(b=>{
                  const p=projects.find(x=>x.id===b.projectId);
                  if(!p)return null;
                  const isLive=b.id==='live';
                  const t=b.taskId?tasks.find(x=>x.id===b.taskId):null;
                  return e('div',{key:'lbl_'+(isLive?'live':b.id),style:{display:'flex',alignItems:'center',gap:5,fontSize:9.5,color:'var(--text2)'}},
                    e('div',{style:{width:6,height:6,borderRadius:'50%',background:p.color,flexShrink:0}}),
                    e('span',null,p.name+(t?' · '+t.name:'')),
                    e('span',{style:{color:'var(--text4)',fontFamily:"'JetBrains Mono',monospace"}},isLive?'en curso':fmtS(b.duration))
                  );
                })
              )
            );
          })(),

          blockView==='chips'&&e('div',{className:'dash-panel-body',style:{maxHeight:360,display:'flex',flexWrap:'wrap',gap:6,padding:'10px'}},
            sortedBlocks.length===0&&!liveBlock&&e('div',{className:'empty'},'Sin bloques registrados este día.'),
            sortedBlocks.map(b=>{
              const p=projects.find(x=>x.id===b.projectId);
              if(!p)return null;
              return e('div',{key:b.id,style:{display:'flex',alignItems:'center',gap:6,background:'var(--bg2)',borderLeft:'3px solid '+p.color,borderRadius:'0 6px 6px 0',padding:'5px 10px'}},
                e('span',{style:{fontSize:9,color:'var(--text4)',fontFamily:"'JetBrains Mono',monospace"}},fmtBlockTime(b.startAt)),
                e('span',{style:{fontSize:10.5,color:'var(--text0)'}},p.name),
                e('span',{style:{fontSize:9,color:'var(--text3)'}},fmtS(b.duration))
              );
            }),
            liveBlock&&(()=>{
              const p=projects.find(x=>x.id===liveBlock.projectId);
              if(!p)return null;
              return e('div',{key:'live',style:{display:'flex',alignItems:'center',gap:6,background:'var(--bg2)',borderLeft:'3px solid '+p.color,borderRadius:'0 6px 6px 0',padding:'5px 10px'}},
                e('span',{style:{fontSize:9,color:'var(--text4)',fontFamily:"'JetBrains Mono',monospace"}},fmtBlockTime(liveBlock.startAt)),
                e('span',{style:{fontSize:10.5,color:'var(--text0)',display:'flex',alignItems:'center',gap:6}},p.name,e('span',{className:'proj-live-dot'})),
                e('span',{style:{fontSize:9,color:'var(--text3)'}},'en curso')
              );
            })()
          )
        )
      ),

      projCtxMenu&&e('div',{
        onClick:ev=>ev.stopPropagation(),
        style:{position:'fixed',top:projCtxMenu.y,left:projCtxMenu.x,background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:'var(--r-md)',padding:4,zIndex:200,boxShadow:'0 8px 24px #0007',minWidth:150}
      },
        e('div',{
          onClick:()=>{playUI('click');onArchiveProject&&onArchiveProject(projCtxMenu.proj.id);setProjCtxMenu(null);},
          style:{display:'flex',alignItems:'center',gap:7,fontSize:11,padding:'6px 9px',borderRadius:6,cursor:'pointer',color:'var(--text2)'}
        },
          e('svg',{width:11,height:11,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
            e('rect',{x:2,y:4,width:20,height:5,rx:1}),
            e('path',{d:'M4 9v9a2 2 0 002 2h12a2 2 0 002-2V9'}),
            e('line',{x1:10,y1:13,x2:14,y2:13})
          ),
          'Archivar proyecto'
        )
      ),

    )
  );
}

function ProjectDashboard(props){
  const{
    project,projects,tasks,sessions,ctxs,habits,systems,
    notes,onAddNote,onDeleteNote,onToggleNoteDone,onSetNoteReminder,
    panelLabels,onRenameLabel,panelVisibility,onTogglePanelVisibility,
    panelSortModes,onChangeSortMode,
    blocks,setBlocks,realBlocks,liveBlock,tick,blockOpacity,blockStyle,realStyle,tlZoom,setTlZoom,selectedDay,setSelectedDay,onDblClickTime,onEditBlock,onNewBlock,
    tState,activeSess,workElapsed,
    onAddTask,onCycleTaskStatus,onDeleteTask,onUpdateTask,onUpdateTaskSteps,onPlayTask,onFinishTask,
    templates,onAddTemplate,onUpdateTemplate,onDeleteTemplate,
    onAddHabit,onUpdateHabit,onDeleteHabit,onToggleHabitLog,onToggleHabitSkip,onPlayHabit,
    onAddSystem,onUpdateSystem,onDeleteSystem,onCombineSystems,onPatchProject,
    sysTemplates,onSaveSysTemplate,onApplySysTemplate,onDeleteSysTemplate,onUpdateSysTemplate,
    onStartTimer,onEditProject,onBack,
    fmtWhen,pStats
  }=props;
  const[showTplMgr,setShowTplMgr]=useState(false);

  const[tab,setTab]=useState('resumen');
  const[systemForm,setSystemForm]=useState(null); // null | 'new' | system object
  const[systemsMapOpen,setSystemsMapOpen]=useState(false);
  const[sysDetailId,setSysDetailId]=useState(null); // id del sistema abierto en el drawer
  const[habitForm,setHabitForm]=useState(null);
  const[showTaskModal,setShowTaskModal]=useState(false);
  const[stepsForTask,setStepsForTask]=useState(null);
  const[showDoneTasks,setShowDoneTasks]=useState(false);
  const[habitCtxMenu,setHabitCtxMenu]=useState(null); // {x,y,habit}
  const[newNoteText,setNewNoteText]=useState('');

  useEffect(()=>{
    if(!habitCtxMenu)return;
    function close(){setHabitCtxMenu(null);}
    window.addEventListener('click',close);
    window.addEventListener('contextmenu',close);
    return()=>{window.removeEventListener('click',close);window.removeEventListener('contextmenu',close);};
  },[habitCtxMenu]);

  const DEFAULT_LABELS={tareas:'Tareas prioritarias',sistemas:'Sistemas',habitos:'Hábitos'};
  const labels={...DEFAULT_LABELS,...(panelLabels||{})};
  const visible={tareas:true,sistemas:true,habitos:true,...(panelVisibility||{})};
  const sortModes={tareas:'proximity',sistemas:'sequence',habitos:'proximity',...(panelSortModes||{})};
  function renameLabel(key,val){onRenameLabel(key,val);}
  function setSortMode(key,mode){onChangeSortMode(key,mode);}
  function cycleAllProjectSystems(){
    pSystems.forEach(s=>{
      const phases=migrateSysPhases(s);
      const experiments=(s.experiments||[]).slice();
      const cycles=s.cycles||[];
      const snapshot={
        id:uid(),
        closedAt:Date.now(),
        phaseSummary:phases.map(p=>({name:p.name,taskCount:p.tasks.length})),
        experiments:experiments.map(x=>({objetivo:x.objetivo,opcionA:x.opcionA,opcionB:x.opcionB,resultado:x.resultado,fecha:x.fecha}))
      };
      onUpdateSystem({...s,phases,cycles:[...cycles,snapshot],experiments:[]});
    });
  }
  function openAddTask(){setShowTaskModal(true);}
  // La auto-creación real de "Proyecto automático" ahora corre en un efecto
  // global (ver checkTaskAutomation, junto a checkSystemsAutomation) que no
  // depende de tener este dashboard abierto ni agrega un día de margen: se
  // dispara el mismo día en que la fase ⚙ llega a su fecha de inicio.
  const showAutoBanner=false;
  const[autoBannerDismissed,setAutoBannerDismissed]=useState(null);
  function singularizeLabel(label){
    const first=(label||'').trim().split(/\s+/)[0]||'tarea';
    return (first.length>3&&/s$/i.test(first))?first.slice(0,-1).toLowerCase():first.toLowerCase();
  }
  const taskNoun=singularizeLabel(labels.tareas); // e.g. "tarea", or "proyecto" if the panel was renamed
  const statCfg=project.statConfig||{};
  function setStatCustom(key,icon,color){onPatchProject({statConfig:{...(project.statConfig||{}),[key]:{icon,color}}});}
  function resetStatCustom(key){const next={...(project.statConfig||{})};delete next[key];onPatchProject({statConfig:next});}

  const pTasks=tasks.filter(t=>t.projectId===project.id);
  const pendingTasks=applySortMode(pTasks.filter(t=>t.status!=='done'),sortModes.tareas,{
    getDueTs:taskDueTs,getCreatedTs:t=>t.createdAt,getName:t=>t.name,getDone:t=>t.status==='done'
  });
  const doneTasks=pTasks.filter(t=>t.status==='done').sort((a,b)=>(b.completedAt||b.createdAt||0)-(a.completedAt||a.createdAt||0));
  const pSystems=applySortMode(systems.filter(s=>s.projectId===project.id),sortModes.sistemas,{
    getDueTs:systemDueTs,getCreatedTs:s=>s.createdAt,getName:s=>s.name,getDone:s=>!(s.nextRun&&s.nextRun<=Date.now()),getOrder:s=>s.order
  });
  const pHabits=applySortMode(habits.filter(h=>h.projectId===project.id),sortModes.habitos,{
    getDueTs:nextHabitDueTs,getCreatedTs:h=>h.createdAt,getName:h=>h.name,getDone:h=>(h.log||[]).includes(selectedDay)
  });
  const pSessions=sessions.filter(s=>s.projectId===project.id&&s.endAt).sort((a,b)=>b.endAt-a.endAt);
  const pCtxs=ctxs.filter(c=>c.projectId===project.id).sort((a,b)=>b.createdAt-a.createdAt);
  const stats=pStats(project);
  const totalSecs=pSessions.reduce((a,s)=>a+s.duration,0);
  const lastActivity=pSessions[0]?pSessions[0].endAt*1000:null;
  const isRunningHere=(tState==='running'||tState==='paused')&&activeSess&&activeSess.projectId===project.id;
  const week=currentWeekDays();
  const today=dayKey();
  const todayPomos=pSessions.filter(s=>s.day===today).reduce((a,s)=>a+(s.pomos||0),0);
  // Tiempo invertido hoy en un hábito específico (sesiones cerradas + en vivo si está corriendo ahora)
  function habitTimeToday(habitId){
    const done=pSessions.filter(s=>s.habitId===habitId&&s.day===today).reduce((a,s)=>a+s.duration,0);
    const live=(isRunningHere&&activeSess&&activeSess.habitId===habitId&&tState==='running')?workElapsed:0;
    return done+live;
  }

  const todaySessions=pSessions.filter(s=>s.day===today);
  const sparkBuckets=new Array(8).fill(0);
  todaySessions.forEach(s=>{const hr=new Date(s.endAt*1000).getHours();sparkBuckets[Math.min(7,Math.floor(hr/3))]+=s.duration;});
  const weekSecs=pSessions.filter(s=>(Date.now()-s.endAt*1000)<7*86400000).reduce((a,s)=>a+s.duration,0);
  const dailyGoal=(project.dailyLimit||8*3600);
  const focusPct=Math.min(100,Math.round(stats.todaySecs/dailyGoal*100));

  function shiftDay(delta){
    const d=dateFromDayKey(selectedDay);
    d.setUTCDate(d.getUTCDate()+delta);
    setSelectedDay(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
  }
  function exportCSV(){
    const rows=[['Fecha','Duración (s)','Duración','Tarea']];
    pSessions.forEach(s=>{
      const t=tasks.find(x=>x.id===s.taskId);
      rows.push([new Date(s.endAt*1000).toLocaleDateString('es-CL'),s.duration,fmtS(s.duration),t?t.name:'']);
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`${project.name.replace(/\s+/g,'_')}_sesiones.csv`;a.click();
    URL.revokeObjectURL(url);
  }
  const dayLabelStr=dateFromDayKey(selectedDay).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
  function habitStreak(h){
    let count=0,d=dateFromDayKey(today);
    for(let i=0;i<365;i++){
      const k=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
      if((h.log||[]).includes(k)){count++;d=new Date(d.getTime()-86400000);}else break;
    }
    return count;
  }
  function lastNDays(n){
    const out=[];
    for(let i=n-1;i>=0;i--){
      const d=new Date(dateFromDayKey(today).getTime()-i*86400000);
      out.push(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);
    }
    return out;
  }
  const last5=lastNDays(5);

  const TABS=[
    {k:'resumen',label:'Resumen',icon:'home'},
    {k:'tareas',label:'Tareas',icon:'check'},
    {k:'sistemas',label:'Sistemas',icon:'map'},
    {k:'habitos',label:'Hábitos',icon:'habit'},
    {k:'notas',label:'Notas',icon:'image'},
    {k:'libreta',label:'Libreta de cuenta',icon:'note'},
    {k:'tiempo',label:'Tiempo',icon:'clock'},
    {k:'ajustes',label:'Ajustes',icon:'gear'},
  ];

  return e('div',{className:'dashboard-view'},
    showAutoBanner&&e('div',{className:'auto-launch-banner'},
      e('div',{className:'auto-launch-icon'},'⚙'),
      e('div',{className:'auto-launch-text'},
        e('div',{className:'auto-launch-title'},'Automatización detectada — se creó el próximo proyecto'),
        e('div',{className:'auto-launch-sub'},'Desde el '+autoBreakDate+' el trabajo anterior quedó desatendido, así que se creó automáticamente "Nuevo proyecto auto" para que arranques cuando quieras.')
      ),
      e('button',{className:'ghost-btn',title:'Descartar',onClick:()=>setAutoBannerDismissed(autoBreakDate)},'✕')
    ),
    e('div',{className:'dash-header'},
      e('button',{className:'dash-back',title:'Volver a Cuentas',onClick:onBack},e(DashIcon,{name:'chevL',size:13})),
      e('div',{className:'dash-head-row'},
        e('div',{className:'dash-avatar',style:{'--proj-color':project.color}},e(ProjIconSVG,{iconKey:project.icon||DEFAULT_ICON,size:18,color:project.color})),
        e('div',{className:'dash-title-block'},
          e('div',{className:'dash-title-row'},
            e('span',{className:'dash-title'},project.name),
            project.client&&e('span',{className:'dash-cat-pill'},project.client),
            e('span',{className:'dash-status-pill '+(project.status==='archived'?'archived':'active')},project.status==='archived'?'Archivado':'Activo')
          ),
          project.description&&e('div',{className:'dash-desc'},project.description),
          e('div',{className:'dash-meta-row'},
            e('span',{className:'dash-meta-item'},'Tiempo total: ',e('b',null,fmtS(totalSecs))),
            e('span',{className:'dash-meta-item'},'Última actividad: ',e('b',null,lastActivity?fmtWhen(lastActivity):'—'))
          )
        ),
        e('div',{className:'dash-head-actions'},
          e('div',{className:'dash-date-nav'},
            e('button',{className:'dash-date-btn',onClick:()=>shiftDay(-1),title:'Día anterior'},e(DashIcon,{name:'chevL',size:12})),
            e('span',{className:'dash-date-lbl',onClick:()=>setSelectedDay(dayKey()),title:'Ir a hoy'},dayLabelStr),
            e('button',{className:'dash-date-btn',onClick:()=>shiftDay(1),title:'Día siguiente'},e(DashIcon,{name:'chevR',size:12}))
          ),
          e('button',{className:'btn',title:'Ver mapa de todos los sistemas del proyecto',style:{display:'inline-flex',alignItems:'center',gap:5},onClick:()=>setSystemsMapOpen(true)},e(DashIcon,{name:'map',size:12}),'Sistemas'),
          e('button',{className:'btn',style:{display:'inline-flex',alignItems:'center',gap:5},onClick:exportCSV},e(DashIcon,{name:'download',size:12}),'Exportar'),
          e('button',{className:'btn',onClick:openAddTask},'+ Añadir '+taskNoun),
          e('button',{className:'btn btn-primary',onClick:onStartTimer},isRunningHere?'■ En curso':'▶ Iniciar timer')
        )
      ),
      e('div',{className:'dash-tabs'},TABS.map(t=>e('button',{key:t.k,className:'dash-tab dash-tab-icon'+(tab===t.k?' on':''),onClick:()=>setTab(t.k),title:t.label},e(DashIcon,{name:t.icon,size:15}))))
    ),

    tab==='resumen'&&e(React.Fragment,null,
    e('div',{className:'foco-widget'},
      e(DonutRing,{pct:focusPct,size:56,stroke:6,color:project.color}),
      e('div',null,
        e('div',{className:'foco-widget-title'},'Foco total'),
        e('div',{className:'foco-widget-sub'},todaySessions.length,' sesiones hoy'),
        e('div',{className:'foco-widget-sub'},fmtS(stats.todaySecs),' enfocado')
      )
    ),
    e('div',{className:'dash-body'},
      e('div',{className:'dash-stats-row'},
        e(StatCard,{icon:'clock',color:'#e0954a',label:'Tiempo hoy',value:fmtS(stats.todaySecs),sub:'de '+fmtS(dailyGoal)+' objetivo',sparkline:sparkBuckets,custom:statCfg.tiempo,onChangeCustom:(icon,color)=>setStatCustom('tiempo',icon,color),onResetCustom:statCfg.tiempo?()=>resetStatCustom('tiempo'):null}),

// Suma días a un date-key 'YYYY-MM-DD' sin líos de timezone.
function addDaysToDateKey(dateKey,days){
  const d=new Date(dateKey+'T00:00:00');
  d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// ¿Cae este date-key en sábado o domingo?
function isWeekendDateKey(dateKey){
  const dow=new Date(dateKey+'T00:00:00').getDay();
  return dow===0||dow===6;
}
// Empuja un date-key hacia adelante hasta el próximo día hábil (lun-vie);
// si ya es hábil, lo deja igual. Se usa para alinear la fecha de inicio
// cuando el encadenado es "solo días de semana".
function alignToBizDayKey(dateKey){
  let d=dateKey;
  while(isWeekendDateKey(d))d=addDaysToDateKey(d,1);
  return d;
}
// Próximo día hábil ESTRICTAMENTE después de dateKey (nunca el mismo día).
function nextBizDayKey(dateKey){
  let d=addDaysToDateKey(dateKey,1);
  while(isWeekendDateKey(d))d=addDaysToDateKey(d,1);
  return d;
}
// Igual que addDaysToDateKey, pero contando solo días hábiles (lun-vie):
// avanza `days` días hábiles desde dateKey, saltándose sábados y domingos.
function addBizDaysToDateKey(dateKey,days){
  let d=dateKey,count=0;
  while(count<days){
    d=addDaysToDateKey(d,1);
    if(!isWeekendDateKey(d))count++;
  }
  return d;
}
// Wrappers que eligen días corridos o solo días hábiles según `bizOnly`.
function addSpanDays(dateKey,days,bizOnly){
  return bizOnly?addBizDaysToDateKey(dateKey,days):addDaysToDateKey(dateKey,days);
}
function nextChainCursor(dateKey,bizOnly){
  return bizOnly?nextBizDayKey(dateKey):addDaysToDateKey(dateKey,1);
}
// Suma meses a un date-key 'YYYY-MM-DD' (respeta cambios de año/mes).
function addMonthsToDateKey(dateKey,months){
  const d=new Date(dateKey+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Sugerencia de cierre de ciclo: encadena las duraciones de los módulos desde
// hoy (mismo cálculo que al ejecutar) para ubicar el módulo marcado como
// punto de automatización (⚙, ej. "Monitoreo"), y sugiere cerrar el ciclo
// 1 mes después de que ese módulo arranca — el sistema lo calcula solo,
// el usuario puede ajustarlo a mano si prefiere otra fecha.
function systemAutomationCloseSuggestion(system){
  const items=system.modules&&system.modules.length?system.modules:migrateSysPhases(system);
  if(!items||!items.length)return null;
  let cursor=todayDateKey();
  let automationStart=null;
  items.forEach(it=>{
    const start=cursor;
    const dur=it.durationDays;
    if(Number.isFinite(dur)&&dur>0)cursor=addDaysToDateKey(addDaysToDateKey(cursor,dur),1);
    if(it.automation&&automationStart===null)automationStart=start;
  });
  if(automationStart===null)return null;
  return addMonthsToDateKey(automationStart,1);
}
function todayDateKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function templateToSteps(tpl,startFrom,bizOnly){
  // Convierte la plantilla (nombres + duración estimada por fase) en fases/
  // tareas reales y nuevas — ids frescos, encadenando startDate/dueDate a
  // partir de `startFrom` (o hoy) según la duración (en días) de cada fase.
  // Sin duración definida, la fase queda sin fechas (se ajusta a mano).
  // Si bizOnly es true, la duración se cuenta solo en días de semana
  // (lun-vie) y la fecha de inicio se alinea al próximo día hábil.
  let cursor=bizOnly?alignToBizDayKey(startFrom||todayDateKey()):(startFrom||todayDateKey());
  return (tpl.steps||[]).map(s=>{
    const dur=Number.isFinite(s.durationDays)&&s.durationDays>0?s.durationDays:null;
    let startDate=null,dueDate=null;
    if(dur){
      startDate=cursor;
      dueDate=addSpanDays(cursor,dur,bizOnly);
      cursor=nextChainCursor(dueDate,bizOnly); // la siguiente fase empieza al día siguiente (hábil), nunca el mismo día
    }else if(s.automation){
      startDate=cursor;
    }
    return{
      id:uid(),name:s.name,startDate,dueDate,done:false,actLog:{},automation:!!s.automation,
      subtasks:(s.subtasks||[]).map(sub=>({id:uid(),name:sub.name,done:false}))
    };
  });
}
// Convierte una PLANTILLA DE SISTEMA (módulos armados/ordenados en el Mapa de
// sistemas) en fases del proyecto: cada módulo del sistema pasa a ser UNA fase,
// en el mismo orden con que se guardó la plantilla, y las tareas de todas las
// fases internas del módulo se juntan como las subtareas de esa fase.
function sysTemplateToSteps(tpl,startFrom,bizOnly){
  let cursor=bizOnly?alignToBizDayKey(startFrom||todayDateKey()):(startFrom||todayDateKey());
  return (tpl.systems||[])
    .slice()
    .sort((a,b)=>(a.order||0)-(b.order||0))
    .map(s=>{
      const dur=Number.isFinite(s.durationDays)&&s.durationDays>0?s.durationDays:null;
      let startDate=null,dueDate=null;
      if(dur){
        startDate=cursor;
        dueDate=addSpanDays(cursor,dur,bizOnly);
        cursor=nextChainCursor(dueDate,bizOnly);
      }else if(s.automation){
        // Sin duración no hay fecha para encadenar — pero la fase ⚙ SIEMPRE
        // necesita un startDate para que la automatización tenga algo que
        // detectar, así que le asignamos la posición actual del cursor.
        startDate=cursor;
      }
      return{
        id:uid(),name:s.name,startDate,dueDate,done:false,actLog:{},automation:!!s.automation,
        subtasks:(s.phases||[]).flatMap(p=>(p.tasks||[]).map(t=>({id:uid(),name:t.text,done:false})))
      };
    });
}
// Clona una plantilla de sistema en un proyecto (task) nuevo — usado tanto al
// instalar manualmente como al auto-crear el siguiente ciclo cuando el
// sistema está "encendido". Encadena fechas desde `startFrom` (hoy si no se pasa).
function spawnTaskFromSysTemplate(tpl,projectId,startFrom){
  if(!tpl)return null;
  return{
    id:uid(),
    projectId,
    name:tpl.name,
    status:'pending',
    priority:'mid',
    createdAt:Date.now(),
    steps:sysTemplateToSteps(tpl,startFrom),
    recurrence:null,
    dueDate:null,
    sysTemplateId:tpl.id
  };
}
function stepsToTemplateSteps(steps){
  // Extrae la estructura (nombres + duración estimada) de fases/tareas —
  // sin fechas concretas ni estado — para guardarla como plantilla reutilizable.
  // Si la fase de origen tenía startDate y dueDate, precalcula la duración real
  // como referencia (editable luego en la plantilla).
  return (steps||[]).map(s=>{
    let durationDays=null;
    if(s.startDate&&s.dueDate){
      const a=new Date(s.startDate+'T00:00:00'),b=new Date(s.dueDate+'T00:00:00');
      const diff=Math.round((b-a)/86400000);
      if(diff>0)durationDays=diff;
    }
    return{name:s.name,durationDays,automation:!!s.automation,subtasks:(s.subtasks||[]).map(sub=>({name:sub.name}))};
  });
}
// EVENTO DE AUTOMATIZACIÓN — una fase marcada con automation:true significa
// que, desde su fecha de inicio en adelante, el trabajo de ese proyecto queda
// desatendido/automatizado. Al crear un proyecto nuevo, buscamos entre TODAS
// las tareas (de cualquier cuenta) la fase de automatización con el startDate
// más tardío, y sugerimos iniciar el proyecto nuevo un día después (break).
function findAutomationBreakDate(allTasks){
  let latest=null;
  (allTasks||[]).forEach(t=>{
    (t.steps||[]).forEach(s=>{
      if(s.automation&&s.startDate){
        if(!latest||s.startDate>latest)latest=s.startDate;
      }
    });
  });
  return latest?addDaysToDateKey(latest,1):null;
}
// Parser texto plano → plantilla: una línea que empieza con un número
// (ej. "1.", "2)", "3 -") es una fase (titular); cualquier otra línea es una
// tarea normal, asignada a la última fase vista. Pensado para poder pegar o
// escribir rápido, tipo Notion, sin tener que acordarse de ningún símbolo.
// La fase puede terminar con una duración estimada entre paréntesis, en días,
// ej. "1. Concepto del single (5)" → 5 días. Es opcional; sin ella, la fase
// queda sin fecha automática al aplicar la plantilla.
function parseTemplateText(text){
  const lines=(text||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const steps=[];
  let cur=null;
  const numberedRe=/^\d+[.)\-:]?\s+/;
  const durRe=/\((\d+)\s*d?\)\s*$/i;
  for(const line of lines){
    const isHeader=numberedRe.test(line);
    if(isHeader){
      let name=line.replace(numberedRe,'').trim();
      let durationDays=null;
      const m=name.match(durRe);
      if(m){durationDays=parseInt(m[1],10);name=name.replace(durRe,'').trim();}
      cur={name,durationDays,subtasks:[]};
      if(cur.name)steps.push(cur);
    }else if(cur){
      cur.subtasks.push({name:line});
    }else{
      // texto suelto antes de la primera fase — se crea una fase implícita
      cur={name:line,durationDays:null,subtasks:[]};
      steps.push(cur);
    }
  }
  return steps;
}
function templateStepsToText(steps){
  return (steps||[]).map((s,i)=>(i+1)+'. '+s.name+(Number.isFinite(s.durationDays)&&s.durationDays>0?' ('+s.durationDays+')':'')+'\n'+(s.subtasks||[]).map(sub=>sub.name).join('\n')).join('\n\n');
}

// ═══════════════════════════════════════════
// PLANTILLAS DE PROYECTO — guarda la estructura de fases/tareas de un
// proyecto para reutilizarla en cualquier otro, sin importar la cuenta.
// ═══════════════════════════════════════════
function normalizeTplSteps(steps){
  return (steps||[]).map(s=>({name:s.name||'',durationDays:Number.isFinite(s.durationDays)&&s.durationDays>0?s.durationDays:null,subtasks:(s.subtasks||[]).map(sub=>({name:sub.name||''}))}));
}

// Pizarra tipo Miro para un "proyecto" (tarea) — pegar imágenes (Ctrl+V), arrastrarlas
// libremente sobre un lienzo con pan/zoom, y agregar notas como casillas de texto que
// viven directamente sobre el mismo lienzo (sin panel lateral: la pizarra usa todo el espacio).
// ═══════════════════════════════════════════
// LIBRETA — bitácora tipo Notion, por proyecto/cuenta.
// Panel izquierdo: lista de entradas (como las páginas de Notion).
// Panel derecho: la entrada abierta, con título grande, subtítulo y
// cuerpo de texto — igual que abrir una página en Notion.
// ═══════════════════════════════════════════
// ═══════════════════════════════════════════
// EDITOR DE BLOQUES DE LA LIBRETA — tipo Notion: cada línea es un bloque
// que puede ser texto simple, punteo (bullet), lista numerada o un
// separador. Atajos al escribir: "- " o "* " al inicio → punteo; "1. " →
// numerada; "----" solo → separador. Cada bloque tiene su propio grip de
// 6 puntos para arrastrar y reordenar (igual que páginas de Notion).
// ═══════════════════════════════════════════
function nbBlocksFromLegacyText(text){
  const lines=(text||'').split('\n');
  if(lines.length===1&&!lines[0])return[{id:uid(),type:'text',text:''}];
  return lines.map(l=>({id:uid(),type:'text',text:l}));
}
// Tipos de bloque disponibles desde el menú de clic derecho — estilo Notion,
// pero sin exponer atajos de markdown: todo se elige desde el menú.
const NB_SLASH_ITEMS=[
  {type:'text',label:'Texto',hint:'Párrafo normal',icon:'Aa'},
  {type:'h1',label:'Título 1',hint:'Encabezado grande',icon:'H1'},
  {type:'h2',label:'Título 2',hint:'Encabezado mediano',icon:'H2'},
  {type:'h3',label:'Título 3',hint:'Encabezado chico',icon:'H3'},
  {type:'bullet',label:'Lista con viñetas',hint:'Puntos',icon:'•'},
  {type:'numbered',label:'Lista numerada',hint:'1, 2, 3...',icon:'1.'},
  {type:'todo',label:'Checklist',hint:'Casilla marcable',icon:'☑'},
  {type:'toggle',label:'Desplegable',hint:'Oculta contenido',icon:'▸'},
  {type:'quote',label:'Cita',hint:'Texto destacado',icon:'❝'},
  {type:'code',label:'Código',hint:'Fuente monoespaciada',icon:'</>'},
  {type:'image',label:'Imagen',hint:'Sube o pega',icon:'▨'},
  {type:'divider',label:'Separador',hint:'Línea divisoria',icon:'—'},
];
// Reconstruye un bloque al cambiar de tipo desde el menú de clic derecho,
// preservando lo que tenga sentido conservar.
function nbBuildBlock(type,old){
  const base={id:old.id,type};
  if(type==='divider')return{...base,text:''};
  if(type==='todo')return{...base,text:old.text||'',checked:!!old.checked};
  if(type==='toggle')return{...base,text:old.text||'',body:old.body||'',open:old.open!==false};
  if(type==='image')return{...base,text:'',src:old.src||'',caption:old.caption||''};
  return{...base,text:old.text||''}; // text/h1/h2/h3/bullet/numbered/quote/code
}
// Reescala imágenes pegadas/subidas antes de guardarlas como base64 en el
// bloque — evita que fotos a resolución completa inflen el estado (y con
// eso, localStorage, Supabase y el historial de deshacer).
const NB_IMG_MAX=1400;
function nbResizeImage(srcDataUrl,cb){
  try{
    const im=new Image();
    im.onload=()=>{
      try{
        const scale=Math.min(1,NB_IMG_MAX/Math.max(im.width,im.height));
        if(scale>=1&&srcDataUrl.length<400000){cb(srcDataUrl);return;}
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*scale);
        cv.height=Math.round(im.height*scale);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        const out=cv.toDataURL('image/jpeg',0.82);
        cb(out.length<srcDataUrl.length?out:srcDataUrl);
      }catch(err){cb(srcDataUrl);}
    };
    im.onerror=()=>cb(srcDataUrl);
    im.src=srcDataUrl;
  }catch(err){cb(srcDataUrl);}
}
function nbFileToBlock(file,cb){
  if(!file||!file.type||!file.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=()=>nbResizeImage(reader.result,cb);
  reader.readAsDataURL(file);
}
function NotebookBlockEditor({blocks,legacyText,onChange}){
  const initial=useMemo(()=>(blocks&&blocks.length)?blocks:nbBlocksFromLegacyText(legacyText),[]); // sólo al montar (la página remonta por key al cambiar de entrada)
  const[items,setItems]=useState(initial);
  const inputRefs=useRef({});
  const refCallbacks=useRef({}); // memoiza un callback de ref por bloque — evita que React lo re-dispare (y con eso, un reflow forzado) en cada tecla
  function refFor(id){
    if(!refCallbacks.current[id]){
      refCallbacks.current[id]=el=>{
        inputRefs.current[id]=el;
        if(el)autoGrow(el); // solo corre al MONTAR ese bloque — al tipear, autoGrow ya se llama desde onChange
      };
    }
    return refCallbacks.current[id];
  }
  const dragId=useRef(null);
  const[dragOverInfo,setDragOverInfo]=useState(null); // {id,pos:'above'|'below'}
  const didMount=useRef(false);
  const[slashFor,setSlashFor]=useState(null); // id del bloque con el menú "/" abierto
  const[slashQuery,setSlashQuery]=useState('');
  const[slashSel,setSlashSel]=useState(0);
  const fileInputRef=useRef(null);
  const pendingImgTarget=useRef(null); // id del bloque que recibirá la imagen subida

  useEffect(()=>{
    if(!didMount.current){didMount.current=true;return;} // evita re-disparar el guardado apenas migra el texto viejo sin cambios reales del usuario
    onChange(items);
    // eslint-disable-next-line
  },[items]);

  function focusBlock(id,atEnd){
    requestAnimationFrame(()=>{
      const el=inputRefs.current[id];
      if(!el)return;
      el.focus();
      if(atEnd&&el.setSelectionRange){const L=el.value.length;el.setSelectionRange(L,L);}
    });
  }
  function autoGrow(el){ if(!el)return; el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }
  function patchBlock(id,patch){ setItems(prev=>prev.map(b=>b.id===id?{...b,...patch}:b)); }
  function removeBlock(id){
    delete refCallbacks.current[id];
    delete refCallbacks.current[id+'_body'];
    delete inputRefs.current[id];
    setItems(prev=>{
      const idx=prev.findIndex(b=>b.id===id);
      if(idx<0)return prev;
      const next=prev.filter(b=>b.id!==id);
      if(next.length===0)return[{id:uid(),type:'text',text:''}];
      const prevBlock=prev[idx-1];
      if(prevBlock)focusBlock(prevBlock.id,true);
      return next;
    });
  }
  function insertAfter(id,newBlock){
    setItems(prev=>{
      const idx=prev.findIndex(b=>b.id===id);
      const next=[...prev];
      next.splice(idx+1,0,newBlock);
      return next;
    });
    focusBlock(newBlock.id,false);
  }
  function convertBlock(id,type){
    setItems(prev=>prev.map(x=>x.id===id?nbBuildBlock(type,x):x));
    closeSlash();
    if(type==='image'){ openImagePicker(id); }
    else focusBlock(id,true);
  }
  function openSlash(id,query){ setSlashFor(id); setSlashQuery(query||''); setSlashSel(0); }
  function closeSlash(){ setSlashFor(null); setSlashQuery(''); setSlashSel(0); }
  useEffect(()=>{
    if(!slashFor)return;
    function onDocMouseDown(ev){
      if(ev.target.closest&&(ev.target.closest('.nb-slash-menu')||ev.target.closest('.nb-block-typebtn')))return;
      closeSlash();
    }
    document.addEventListener('mousedown',onDocMouseDown);
    return()=>document.removeEventListener('mousedown',onDocMouseDown);
    // eslint-disable-next-line
  },[slashFor]);
  function slashFiltered(){
    const q=slashQuery.trim().toLowerCase();
    if(!q)return NB_SLASH_ITEMS;
    return NB_SLASH_ITEMS.filter(it=>it.label.toLowerCase().includes(q)||it.type.includes(q));
  }
  function openImagePicker(id){
    pendingImgTarget.current=id;
    if(fileInputRef.current)fileInputRef.current.click();
  }
  function handleFileChosen(ev){
    const file=ev.target.files&&ev.target.files[0];
    ev.target.value='';
    const targetId=pendingImgTarget.current;
    if(!file||!targetId)return;
    nbFileToBlock(file,src=>patchBlock(targetId,{src}));
  }
  function handleInput(id,value){
    const b=items.find(x=>x.id===id);
    if(!b)return;
    patchBlock(id,{text:value});
  }
  function handlePaste(id,ev){
    const items_=(ev.clipboardData&&ev.clipboardData.items)||[];
    const imgItem=[...items_].find(it=>it.type&&it.type.startsWith('image/'));
    if(!imgItem)return;
    ev.preventDefault();
    const file=imgItem.getAsFile();
    if(!file)return;
    const b=items.find(x=>x.id===id);
    nbFileToBlock(file,src=>{
      if(b&&b.type==='text'&&!b.text.trim()){
        patchBlock(id,{type:'image',src,caption:''});
      }else{
        insertAfter(id,{id:uid(),type:'image',src,caption:''});
      }
    });
  }
  function handleKeyDown(id,ev){
    const b=items.find(x=>x.id===id);
    if(!b)return;
    if(slashFor===id){
      const list=slashFiltered();
      if(ev.key==='ArrowDown'){ev.preventDefault();setSlashSel(s=>Math.min(list.length-1,s+1));return;}
      if(ev.key==='ArrowUp'){ev.preventDefault();setSlashSel(s=>Math.max(0,s-1));return;}
      if(ev.key==='Escape'){ev.preventDefault();closeSlash();return;}
      if(ev.key==='Enter'){
        ev.preventDefault();
        const pick=list[slashSel]||list[0];
        if(pick)convertBlock(id,pick.type);
        return;
      }
    }
    if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){
      ev.preventDefault();
      insertAfter(id,{id:uid(),type:'text',text:''}); // Ctrl/Cmd+Enter: fuerza un bloque nuevo debajo, útil para salir de un bloque de código
      return;
    }
    if(ev.key==='Enter'&&!ev.shiftKey){
      if(b.type==='code')return; // salto de línea normal dentro del código
      ev.preventDefault();
      if((b.type==='bullet'||b.type==='numbered'||b.type==='todo')&&!b.text.trim()){
        patchBlock(id,{type:'text'}); // salir de la lista si la línea está vacía
        return;
      }
      const newType=(b.type==='bullet'||b.type==='numbered')?b.type:(b.type==='todo'?'todo':'text');
      const extra=b.type==='todo'?{checked:false}:{};
      insertAfter(id,{id:uid(),type:newType,text:'',...extra});
      return;
    }
    if(ev.key==='Backspace'&&!b.text){
      if(b.type==='code'&&ev.target&&ev.target.value)return; // deja borrar dentro del bloque de código normalmente
      ev.preventDefault();
      if(b.type!=='text'){patchBlock(id,{type:'text'});return;}
      if(items.length>1)removeBlock(id);
      return;
    }
  }
  function beginDrag(id,ev){ dragId.current=id; ev.dataTransfer.effectAllowed='move'; }
  function onDragOverRow(id,ev){
    if(!dragId.current||dragId.current===id)return;
    ev.preventDefault();
    const rect=ev.currentTarget.getBoundingClientRect();
    const pos=(ev.clientY-rect.top)<rect.height/2?'above':'below';
    setDragOverInfo({id,pos});
  }
  function onDropRow(id,ev){
    ev.preventDefault();
    const srcId=dragId.current;
    dragId.current=null;
    setDragOverInfo(null);
    if(!srcId||srcId===id)return;
    setItems(prev=>{
      const srcIdx=prev.findIndex(b=>b.id===srcId);
      if(srcIdx<0)return prev;
      const arr=[...prev];
      const[moved]=arr.splice(srcIdx,1);
      let tgtIdx=arr.findIndex(b=>b.id===id);
      if(dragOverInfo&&dragOverInfo.pos==='below')tgtIdx+=1;
      arr.splice(tgtIdx,0,moved);
      return arr;
    });
  }
  let numCounter=0;
  const HEADING_PH='Escribe aquí... (clic derecho para formato: títulos, checklist, imagen, etc.)';
  return e('div',{className:'nb-blocks'},
    e('input',{ref:fileInputRef,type:'file',accept:'image/*',style:{display:'none'},onChange:handleFileChosen}),
    items.map((b,i)=>{
      if(b.type==='numbered')numCounter++;else numCounter=0;
      const isOver=dragOverInfo&&dragOverInfo.id===b.id;
      const list=slashFor===b.id?slashFiltered():null;
      return e('div',{
        key:b.id,
        className:'nb-block-row'+(isOver?(dragOverInfo.pos==='above'?' drag-over-above':' drag-over-below'):'')+(dragId.current===b.id?' dragging':''),
        style:{position:'relative'},
        onDragOver:ev=>onDragOverRow(b.id,ev),
        onDrop:ev=>onDropRow(b.id,ev),
        onDragLeave:()=>setDragOverInfo(cur=>(cur&&cur.id===b.id)?null:cur),
        onContextMenu:ev=>{ev.preventDefault();openSlash(b.id,'');}
      },
        e('div',{className:'nb-block-handle',draggable:true,onDragStart:ev=>beginDrag(b.id,ev),onDragEnd:()=>{dragId.current=null;setDragOverInfo(null);},title:'Arrastra para reordenar'},'⠿'),

        b.type==='divider'
          ?e('div',{className:'nb-block-divider-wrap'},e('hr'))

        :b.type==='image'
          ?e('div',{className:'nb-block-img-wrap'},
              b.src
                ?e('img',{src:b.src,alt:''})
                :e('div',{className:'nb-block-img-empty',onClick:()=>openImagePicker(b.id)},'📎 Click para subir una imagen (o pega una con Ctrl+V en cualquier bloque de texto)'),
              b.src&&e('input',{
                className:'nb-block-img-cap',value:b.caption||'',placeholder:'Agregar una descripción...',
                onChange:ev=>patchBlock(b.id,{caption:ev.target.value})
              })
            )

        :b.type==='toggle'
          ?e('div',{className:'nb-block-toggle-wrap'},
              e('div',{className:'nb-toggle-hdr'},
                e('div',{className:'nb-toggle-caret'+(b.open?' open':''),onClick:()=>patchBlock(b.id,{open:!b.open}),title:b.open?'Contraer':'Expandir'},'▸'),
                e('textarea',{
                  ref:refFor(b.id),
                  className:'nb-block-input',rows:1,style:{fontWeight:600},
                  value:b.text,placeholder:'Título del desplegable...',
                  onChange:ev=>{handleInput(b.id,ev.target.value);autoGrow(ev.target);},
                  onKeyDown:ev=>handleKeyDown(b.id,ev),
                  onPaste:ev=>handlePaste(b.id,ev)
                })
              ),
              b.open&&e('div',{className:'nb-toggle-body'},
                e('textarea',{
                  rows:2,value:b.body||'',placeholder:'Contenido oculto...',
                  ref:refFor(b.id+'_body'),
                  onChange:ev=>{patchBlock(b.id,{body:ev.target.value});autoGrow(ev.target);}
                })
              )
            )

        :b.type==='todo'
          ?e('div',{className:'nb-block-todo-wrap'},
              e('button',{className:'nb-todo-check'+(b.checked?' on':''),onClick:()=>patchBlock(b.id,{checked:!b.checked}),title:b.checked?'Marcar como pendiente':'Marcar como hecho'},b.checked?'✓':''),
              e('textarea',{
                ref:refFor(b.id),
                className:'nb-block-input'+(b.checked?' todo-done':''),rows:1,
                value:b.text,placeholder:i===0?HEADING_PH:'',
                onChange:ev=>{handleInput(b.id,ev.target.value);autoGrow(ev.target);},
                onKeyDown:ev=>handleKeyDown(b.id,ev),
                onPaste:ev=>handlePaste(b.id,ev)
              })
            )

        :b.type==='quote'
          ?e('div',{className:'nb-block-quote-wrap'},
              e('textarea',{
                ref:refFor(b.id),
                className:'nb-block-input quote',rows:1,
                value:b.text,placeholder:'Cita...',
                onChange:ev=>{handleInput(b.id,ev.target.value);autoGrow(ev.target);},
                onKeyDown:ev=>handleKeyDown(b.id,ev),
                onPaste:ev=>handlePaste(b.id,ev)
              })
            )

        :e(React.Fragment,null,
            b.type==='bullet'&&e('div',{className:'nb-block-marker bullet'},'•'),
            b.type==='numbered'&&e('div',{className:'nb-block-marker'},numCounter+'.'),
            e('textarea',{
              ref:refFor(b.id),
              className:'nb-block-input'+(b.type!=='text'&&b.type!=='bullet'&&b.type!=='numbered'?' '+b.type:''),

              onChange:ev=>{handleInput(b.id,ev.target.value);autoGrow(ev.target);},

        list&&e('div',{className:'nb-slash-menu'},
          list.length===0&&e('div',{style:{padding:'8px',fontSize:11,color:'var(--text4)'}},'Sin resultados'),
          list.map((it,idx)=>e('div',{

        e('button',{className:'nb-block-del',title:'Eliminar bloque',onClick:()=>removeBlock(b.id)},'✕')

    })

}
function TaskNotebookPanel({task,onUpdateTask}){
  const entries=task.notebook||[];
  const[selectedId,setSelectedId]=useState(null);
  const titleRefs=useRef({});
  const bodyRefs=useRef({});

  function autoGrow(el){ if(!el)return; el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

  function update(next){onUpdateTask({notebook:next});}
  function addEntry(){
    const now=Date.now();
    const n={id:uid(),title:'',subtitle:'',text:'',createdAt:now,updatedAt:now,pinned:false};
    update([n,...entries]);
    setSelectedId(n.id);
  }
  function patchEntry(id,patch){
    update(entries.map(n=>n.id===id?{...n,...patch,updatedAt:Date.now()}:n));
  }
  function deleteEntry(id){
    if(!confirm('¿Eliminar esta entrada de la libreta? No se puede deshacer.'))return;
    update(entries.filter(n=>n.id!==id));
    if(selectedId===id)setSelectedId(null);
  }
  function togglePin(id){
    update(entries.map(n=>n.id===id?{...n,pinned:!n.pinned}:n));
  }

  function fmtWhen(ts){
    const key=dayKeyFromTs(ts);
    const label=key===dayKey()?'Hoy':key===dayKeyFromTs(Date.now()-86400000)?'Ayer':new Date(ts).toLocaleDateString('es-CL',{day:'numeric',month:'short'});
    return label+' · '+new Date(ts).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  }

  const sorted=[...entries].sort((a,b)=>{
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    return b.updatedAt-a.updatedAt;
  });
  useEffect(()=>{
    if(entries.length>0&&!entries.find(n=>n.id===selectedId))setSelectedId(sorted[0].id);
    // eslint-disable-next-line
  },[entries.length]);
  useEffect(()=>{
    const el=titleRefs.current[selectedId];
    if(el&&!el.value)el.focus();
  },[selectedId]);

  const active=entries.find(n=>n.id===selectedId)||null;

  return e('div',{className:'notebook-wrap'},
    e('div',{className:'notebook-sidebar'},
      e('div',{className:'notebook-sidebar-hdr'},
        e('button',{className:'notebook-new-btn',onClick:addEntry},e(DashIcon,{name:'plus',size:12}),'Nueva entrada')
      ),
      e('div',{className:'notebook-list'},
        sorted.length===0&&e('div',{className:'notebook-empty-list'},'Sin entradas aún.'),
        sorted.map(n=>e('div',{
          key:n.id,
          className:'notebook-list-item'+(n.id===selectedId?' active':''),
          onClick:()=>setSelectedId(n.id)
        },
          e('div',{className:'notebook-list-item-title'+(n.title?'':' untitled')},
            n.pinned&&e(DashIcon,{name:'pin',size:10}),
            n.title||'Sin título'
          ),
          n.subtitle&&e('div',{className:'notebook-list-item-sub'},n.subtitle),
          e('div',{className:'notebook-list-item-meta'},fmtWhen(n.updatedAt))
        ))
      )
    ),
    !active&&e('div',{className:'notebook-page-empty'},
      e('div',null,'Selecciona una entrada o crea una nueva.'),
      e('button',{className:'notebook-new-btn',style:{width:'auto',padding:'7px 16px'},onClick:addEntry},e(DashIcon,{name:'plus',size:12}),'Nueva entrada')
    ),
    active&&e('div',{className:'notebook-page',key:active.id},
      e('div',{className:'notebook-page-top'},
        e('span',{className:'notebook-page-meta'},fmtWhen(active.updatedAt)),
        e('div',{className:'notebook-page-actions'},
          e('button',{
            className:'nb-act-btn'+(active.pinned?' on':''),
            title:active.pinned?'Quitar de fijadas':'Fijar arriba',
            onClick:()=>togglePin(active.id)
          },e(DashIcon,{name:'pin',size:13})),
          e('button',{className:'nb-act-btn danger',title:'Eliminar entrada',onClick:()=>deleteEntry(active.id)},e(DashIcon,{name:'trash',size:13}))
        )
      ),
      e('input',{
        ref:el=>{titleRefs.current[active.id]=el;},
        className:'notebook-title-input',
        value:active.title,
        placeholder:'Sin título',
        onChange:ev=>patchEntry(active.id,{title:ev.target.value})

      e('input',{

        placeholder:'Agregar un subtítulo...',
        onChange:ev=>patchEntry(active.id,{subtitle:ev.target.value})
      }),
      e(NotebookBlockEditor,{
        key:active.id,
        blocks:active.blocks,
        legacyText:active.text,
        onChange:blocks=>patchEntry(active.id,{blocks})
      })
    )
  );

function AccountNotebookPanel({project,pTasks,onPatchProject,onUpdateTask}){
  const accountEntries=(project.notebook||[]).map(n=>({...n,_scope:'account',_tag:'Cuenta',_taskId:null}));
  const taskEntries=[];
  pTasks.forEach(t=>{
    (t.notebook||[]).forEach(n=>{
      taskEntries.push({...n,_scope:'task',_tag:t.name||'Proyecto',_taskId:t.id,_taskDone:t.status==='done'});
    });
  });
  const allEntries=[...accountEntries,...taskEntries];
  const[selectedId,setSelectedId]=useState(null);
  const[filter,setFilter]=useState('all'); // 'all' | 'account' | taskId
  const titleRefs=useRef({});
  const bodyRefs=useRef({});

  function autoGrow(el){ if(!el)return; el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

  function updateAccount(next){onPatchProject({notebook:next});}
  function updateTaskNb(taskId,next){onUpdateTask(taskId,{notebook:next});}

  function addEntry(){
    const now=Date.now();
    const n={id:uid(),title:'',subtitle:'',text:'',createdAt:now,updatedAt:now,pinned:false};
    updateAccount([n,...(project.notebook||[])]);
    setSelectedId(n.id);
    setFilter(f=>f==='all'?'all':'account');
  }
  function patchEntry(entry,patch){
    if(entry._scope==='account'){
      updateAccount((project.notebook||[]).map(n=>n.id===entry.id?{...n,...patch,updatedAt:Date.now()}:n));
    }else{
      const t=pTasks.find(x=>x.id===entry._taskId);
      if(!t)return;
      updateTaskNb(t.id,(t.notebook||[]).map(n=>n.id===entry.id?{...n,...patch,updatedAt:Date.now()}:n));
    }
  }
  function deleteEntry(entry){
    if(!confirm('¿Eliminar esta entrada de la libreta? No se puede deshacer.'))return;
    if(entry._scope==='account'){
      updateAccount((project.notebook||[]).filter(n=>n.id!==entry.id));
    }else{
      const t=pTasks.find(x=>x.id===entry._taskId);
      if(!t)return;
      updateTaskNb(t.id,(t.notebook||[]).filter(n=>n.id!==entry.id));
    }
    if(selectedId===entry.id)setSelectedId(null);
  }
  function togglePin(entry){patchEntry(entry,{pinned:!entry.pinned});}

  function fmtWhen2(ts){
    const key=dayKeyFromTs(ts);
    const label=key===dayKey()?'Hoy':key===dayKeyFromTs(Date.now()-86400000)?'Ayer':new Date(ts).toLocaleDateString('es-CL',{day:'numeric',month:'short'});
    return label+' · '+new Date(ts).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  }

  const filtered=allEntries.filter(n=>filter==='all'?true:filter==='account'?n._scope==='account':n._taskId===filter);
  const sorted=[...filtered].sort((a,b)=>{
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    return b.updatedAt-a.updatedAt;
  });
  useEffect(()=>{
    if(sorted.length>0&&!sorted.find(n=>n.id===selectedId))setSelectedId(sorted[0].id);
    if(sorted.length===0&&selectedId)setSelectedId(null);
    // eslint-disable-next-line
  },[filter,allEntries.length]);
  useEffect(()=>{
    const el=titleRefs.current[selectedId];
    if(el&&!el.value)el.focus();
  },[selectedId]);

  const active=sorted.find(n=>n.id===selectedId)||null;
  const taskChips=pTasks.filter(t=>(t.notebook||[]).length>0);

  return e('div',{className:'notebook-wrap'},
    e('div',{className:'notebook-sidebar'},
      e('div',{className:'notebook-sidebar-hdr'},
        e('button',{className:'notebook-new-btn',onClick:addEntry},e(DashIcon,{name:'plus',size:12}),'Nueva nota de cuenta')
      ),
      (taskChips.length>0)&&e('div',{className:'nb-filter-row'},
        e('button',{className:'nb-filter-chip'+(filter==='all'?' on':''),onClick:()=>setFilter('all')},'Todas'),
        e('button',{className:'nb-filter-chip'+(filter==='account'?' on':''),onClick:()=>setFilter('account')},'Cuenta'),
        taskChips.map(t=>e('button',{key:t.id,className:'nb-filter-chip'+(filter===t.id?' on':''),onClick:()=>setFilter(t.id)},t.name))
      ),
      e('div',{className:'notebook-list'},
        sorted.length===0&&e('div',{className:'notebook-empty-list'},'Sin entradas aún.'),
        sorted.map(n=>e('div',{
          key:n.id,
          className:'notebook-list-item'+(n.id===selectedId?' active':''),
          onClick:()=>setSelectedId(n.id)
        },
          e('div',{className:'notebook-list-item-title'+(n.title?'':' untitled')},
            n.pinned&&e(DashIcon,{name:'pin',size:10}),
            n.title||'Sin título'
          ),
          e('span',{className:'nb-tag'+(n._scope==='account'?' nb-tag-account':' nb-tag-task'+(n._taskDone?' done':''))},n._tag),
          n.subtitle&&e('div',{className:'notebook-list-item-sub'},n.subtitle),
          e('div',{className:'notebook-list-item-meta'},fmtWhen2(n.updatedAt))
        ))
      )
    ),
    !active&&e('div',{className:'notebook-page-empty'},
      e('div',null,'Selecciona una entrada o crea una nueva.'),
      e('button',{className:'notebook-new-btn',style:{width:'auto',padding:'7px 16px'},onClick:addEntry},e(DashIcon,{name:'plus',size:12}),'Nueva nota de cuenta')
    ),
    active&&e('div',{className:'notebook-page',key:active.id},
      e('div',{className:'notebook-page-top'},
        e('span',{className:'nb-tag'+(active._scope==='account'?' nb-tag-account':' nb-tag-task'+(active._taskDone?' done':''))},active._tag),
        e('span',{className:'notebook-page-meta'},fmtWhen2(active.updatedAt)),

            onClick:()=>togglePin(active)
          },e(DashIcon,{name:'pin',size:13})),
          e('button',{className:'nb-act-btn danger',title:'Eliminar entrada',onClick:()=>deleteEntry(active)},e(DashIcon,{name:'trash',size:13}))
        )
      ),
      e('input',{
        ref:el=>{titleRefs.current[active.id]=el;},
        className:'notebook-title-input',
        value:active.title,
        placeholder:'Sin título',
        onChange:ev=>patchEntry(active,{title:ev.target.value})
      }),
      e('input',{
        className:'notebook-subtitle-input',
        value:active.subtitle,
        placeholder:'Agregar un subtítulo...',
        onChange:ev=>patchEntry(active,{subtitle:ev.target.value})

      e(NotebookBlockEditor,{

    onUpdateTask({notebook:notebook.map(n=>n.id===entryId?{...n,...patch,updatedAt:Date.now()}:n)});
  }
  // Las imágenes de la pizarra viven como base64 DENTRO de la tarea, así que
  // pegar un screenshot a resolución completa mete varios MB al estado (y de
  // ahí a localStorage, a Supabase y a cada snapshot de undo). Se reescalan a
  // un máximo razonable antes de guardarlas: se ven igual en la pizarra y
  // pesan una fracción.
  const BOARD_IMG_MAX=1400;
  function addImage(src){
    const n=pasteCounterRef.current++;
    const off=(n%8)*22;
    function push(finalSrc){
      updateImages([...images,{id:uid(),x:40+off,y:40+off,w:320,src:finalSrc}]);
    }
    try{
      const im=new Image();
      im.onload=()=>{
        try{
          const scale=Math.min(1,BOARD_IMG_MAX/Math.max(im.width,im.height));
          if(scale>=1&&src.length<400000){push(src);return;}
          const cv=document.createElement('canvas');
          cv.width=Math.round(im.width*scale);
          cv.height=Math.round(im.height*scale);
          cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
          const out=cv.toDataURL('image/jpeg',0.82);
          push(out.length<src.length?out:src);
        }catch(err){push(src);}
      };
      im.onerror=()=>push(src);
      im.src=src;
    }catch(err){push(src);}
  }
  // Al borrar un elemento, sus conexiones también se limpian — nunca quedan
  // líneas colgando de algo que ya no existe.
  function pruneLinks(compositeId,nextLinksBase){
    return(nextLinksBase!==undefined?nextLinksBase:links).filter(l=>l[0]!==compositeId&&l[1]!==compositeId);
  }
  function deleteImage(id){
    updateImages(images.filter(i=>i.id!==id));
    updateLinks(pruneLinks('img:'+id));
  }
  function beginImgDrag(img,ev){
    if(linkMode){ev.stopPropagation();handleLinkClick('img:'+img.id);return;}
    ev.preventDefault();
    setDragImg({id:img.id,startX:ev.clientX,startY:ev.clientY,origX:img.x,origY:img.y});
  }
  useEffect(()=>{
    if(!dragImg)return;
    function onMove(ev){
      const dx=(ev.clientX-dragImg.startX)/zoom,dy=(ev.clientY-dragImg.startY)/zoom;
      updateImages(images.map(i=>i.id===dragImg.id?{...i,x:dragImg.origX+dx,y:dragImg.origY+dy}:i));
    }
    function onUp(){setDragImg(null);}
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
    // eslint-disable-next-line
  },[dragImg,zoom]);
  useEffect(()=>{
    if(!dragNote)return;
    function onMove(ev){
      const dx=(ev.clientX-dragNote.startX)/zoom,dy=(ev.clientY-dragNote.startY)/zoom;
      updateNotes(notes.map(n=>n.id===dragNote.id?{...n,x:dragNote.origX+dx,y:dragNote.origY+dy}:n));
    }
    function onUp(){setDragNote(null);}
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
    // eslint-disable-next-line
  },[dragNote,zoom]);
  useEffect(()=>{
    if(!dragCard)return;
    function onMove(ev){
      const dx=(ev.clientX-dragCard.startX)/zoom,dy=(ev.clientY-dragCard.startY)/zoom;
      updateCards(cards.map(c=>c.id===dragCard.id?{...c,x:dragCard.origX+dx,y:dragCard.origY+dy}:c));
    }
    function onUp(){setDragCard(null);}
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
    // eslint-disable-next-line
  },[dragCard,zoom]);
  useEffect(()=>{
    if(!showNbMenu)return;
    function h(ev){if(nbMenuRef.current&&!nbMenuRef.current.contains(ev.target))setShowNbMenu(false);}
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[showNbMenu]);
  useEffect(()=>{
    if(!linkMode)return;
    function onKey(ev){
      if(ev.key==='Escape'){setLinkFrom(null);setLinkMode(false);}
    }
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[linkMode]);
  useEffect(()=>{
    function onPaste(ev){
      const items=(ev.clipboardData&&ev.clipboardData.items)||[];
      for(const item of items){
        if(item.type&&item.type.startsWith('image/')){
          const file=item.getAsFile();
          if(!file)continue;
          const reader=new FileReader();
          reader.onload=()=>addImage(reader.result);
          reader.readAsDataURL(file);
        }
      }
    }
    window.addEventListener('paste',onPaste);
    return()=>window.removeEventListener('paste',onPaste);
    // eslint-disable-next-line
  },[images]);
  function onWheel(ev){
    if(!ev.altKey)return;
    ev.preventDefault();
    setZoom(z=>clampZoom(z+(ev.deltaY<0?0.1:-0.1)));
  }
  function nextSpot(counterRef){
    const scroller=canvasRef.current;
    const n=counterRef.current++;
    const off=(n%6)*26;
    const baseX=scroller?(scroller.scrollLeft/zoom)+60:60;
    const baseY=scroller?(scroller.scrollTop/zoom)+60:60;
    return{x:baseX+off,y:baseY+off};
  }
  function addNote(){
    const pos=nextSpot(noteCounterRef);
    const note={id:uid(),text:'',createdAt:Date.now(),x:pos.x,y:pos.y,w:220,h:150};
    updateNotes([note,...notes]);
  }
  function updateNoteText(id,text){updateNotes(notes.map(n=>n.id===id?{...n,text}:n));}
  function deleteNote(id){
    updateNotes(notes.filter(n=>n.id!==id));
    updateLinks(pruneLinks('note:'+id));
  }
  function beginNoteDrag(note,ev){
    if(linkMode){ev.stopPropagation();handleLinkClick('note:'+note.id);return;}
    if(ev.target.tagName==='TEXTAREA')return;
    ev.preventDefault();
    setDragNote({id:note.id,startX:ev.clientX,startY:ev.clientY,origX:note.x,origY:note.y});
  }
  function addCardFromEntry(entryId){
    const pos=nextSpot(cardCounterRef);
    const card={id:uid(),entryId,x:pos.x,y:pos.y,w:220,expanded:false};
    updateCards([card,...cards]);
    setShowNbMenu(false);
  }
  function deleteCard(id){
    updateCards(cards.filter(c=>c.id!==id));
    updateLinks(pruneLinks('card:'+id));
  }
  function toggleCardExpand(id){updateCards(cards.map(c=>c.id===id?{...c,expanded:!c.expanded}:c));}
  function beginCardDrag(card,ev){
    if(linkMode){ev.stopPropagation();handleLinkClick('card:'+card.id);return;}
    if(ev.target.tagName==='TEXTAREA'||ev.target.tagName==='INPUT')return;
    ev.preventDefault();
    setDragCard({id:card.id,startX:ev.clientX,startY:ev.clientY,origX:card.x,origY:card.y});
  }
  // Punto de anclaje de cada elemento para dibujar las líneas — se usa el
  // centro superior de su posición conocida (x,y,w), sin depender de medir
  // el DOM en vivo, así que funciona igual con cualquier alto de contenido.
  function anchorOf(compositeId){
    const[kind,id]=[compositeId.slice(0,compositeId.indexOf(':')),compositeId.slice(compositeId.indexOf(':')+1)];
    const el=kind==='img'?images.find(x=>x.id===id):kind==='note'?notes.find(x=>x.id===id):cards.find(x=>x.id===id);
    if(!el)return null;
    return{x:el.x+(el.w||220)/2,y:el.y+12};
  }
  function handleLinkClick(compositeId){
    if(!linkFrom){setLinkFrom(compositeId);return;}
    if(linkFrom===compositeId){setLinkFrom(null);return;}
    const a=linkFrom,b=compositeId;
    const exists=links.some(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a));
    if(!exists)updateLinks([...links,[a,b]]);
    setLinkFrom(a===compositeId?null:compositeId); // sigue encadenando desde el último elemento tocado
  }
  function removeLink(idx){ updateLinks(links.filter((_,i)=>i!==idx)); }

  const allElements=[
    ...images.map(i=>({...i,_kind:'img'})),
    ...notes.map(n=>({...n,_kind:'note'})),
    ...cards.map(c=>({...c,_kind:'card'}))
  ];
  const boardHasContent=images.length>0||notes.length>0||cards.length>0;

  return e('div',{className:'board-wrap'},
    e('div',{className:'board-canvas-scroll',ref:canvasRef,onWheel},
      e('div',{className:'board-zoom-ctrl'},
        e('button',{className:'tl-zoom-btn',onClick:()=>setZoom(z=>clampZoom(z-0.1))},'−'),
        e('span',{className:'tl-zoom-val'},Math.round(zoom*100)+'%'),
        e('button',{className:'tl-zoom-btn',onClick:()=>setZoom(z=>clampZoom(z+0.1))},'+'),
        e('span',{className:'divider'}),
        e('button',{className:'board-add-note-btn',onClick:addNote,title:'Agregar una tarjeta de texto libre sobre la pizarra'},
          e(DashIcon,{name:'plus',size:11}),'Tarjeta'
        ),
        e('div',{className:'board-add-nb-wrap',ref:nbMenuRef},
          e('button',{className:'board-add-note-btn',onClick:()=>setShowNbMenu(v=>!v),title:'Traer una entrada de la Libreta a la pizarra'},
            e(DashIcon,{name:'note',size:11}),'Libreta'
          ),
          showNbMenu&&e('div',{className:'board-add-nb-menu'},
            notebook.length===0&&e('div',{className:'board-add-nb-empty'},'Aún no hay entradas en la Libreta de este proyecto.'),
            notebook.map(en=>e('div',{
              key:en.id,
              className:'board-add-nb-item'+(en.title?'':' untitled'),
              onClick:()=>addCardFromEntry(en.id)
            },en.title||'Sin título'))
          )
        ),
        e('span',{className:'divider'}),
        e('button',{
          className:'board-add-note-btn board-link-btn'+(linkMode?' on':''),
          onClick:()=>{setLinkMode(v=>!v);setLinkFrom(null);},
          title:'Vincular dos elementos de la pizarra con una línea'
        },e(DashIcon,{name:'network',size:11}),'Vincular')
      ),
      linkMode&&e('div',{className:'board-hintbar'},
        linkFrom?'Click en otro elemento para conectarlo · Esc para salir':'Click en un elemento, después en otro, para conectarlos · Esc para salir'
      ),
      e('div',{className:'board-canvas',style:{transform:`scale(${zoom})`,transformOrigin:'0 0',cursor:linkMode?'crosshair':'default'}},
        !boardHasContent&&e('div',{className:'board-hint'},
          e(DashIcon,{name:'image',size:22,color:'var(--text4)'}),
          e('div',null,'Pegá una imagen con Ctrl+V, presioná "Tarjeta" para escribir directamente sobre la pizarra, "Libreta" para traer una entrada ya escrita, o "Vincular" para conectarlas entre sí.')
        ),
        e('svg',{className:'board-svg',width:2200,height:1500},
          links.map((l,idx)=>{
            const a=anchorOf(l[0]),b=anchorOf(l[1]);
            if(!a||!b)return null;
            return e('g',{key:idx},
              e('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'var(--accent2)',strokeWidth:1.6,strokeDasharray:'5 4',opacity:.75}),
              e('line',{'data-linkline':1,x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'transparent',strokeWidth:14,onDoubleClick:()=>removeLink(idx),title:'Doble click para desconectar'})
            );
          })
        ),
        images.map(img=>e('div',{
          key:img.id,className:'board-img board-linkable'+(dragImg&&dragImg.id===img.id?' dragging':'')+(linkFrom==='img:'+img.id?' linking-src':'')+(linkMode?' linkable-hover':''),
          style:{left:img.x,top:img.y,width:img.w},
          onMouseDown:ev=>beginImgDrag(img,ev)
        },
          e('img',{src:img.src,draggable:false,style:{width:'100%',display:'block',borderRadius:8,pointerEvents:'none'}}),
          !linkMode&&e('button',{className:'board-img-del',onMouseDown:ev=>ev.stopPropagation(),onClick:()=>deleteImage(img.id),title:'Eliminar imagen'},'✕')
        )),
        notes.map(n=>e('div',{
          key:n.id,className:'board-note board-linkable'+(dragNote&&dragNote.id===n.id?' dragging':'')+(linkFrom==='note:'+n.id?' linking-src':'')+(linkMode?' linkable-hover':''),
          style:{left:n.x,top:n.y,width:n.w,height:n.h},
          onMouseDown:ev=>beginNoteDrag(n,ev)
        },
          e('div',{className:'board-note-hdr'},
            !linkMode&&e('button',{className:'board-note-del',onMouseDown:ev=>ev.stopPropagation(),onClick:()=>deleteNote(n.id),title:'Eliminar tarjeta'},'✕')
          ),
          e('textarea',{
            className:'board-note-text',
            placeholder:'Escribe aquí...',
            defaultValue:n.text,
            disabled:linkMode,
            onMouseDown:ev=>{if(!linkMode)ev.stopPropagation();},
            onBlur:ev=>updateNoteText(n.id,ev.target.value)
          })
        )),
        cards.map(c=>{
          const entry=notebook.find(n=>n.id===c.entryId);
          const linkCls=' board-linkable'+(linkFrom==='card:'+c.id?' linking-src':'')+(linkMode?' linkable-hover':'');
          if(!entry){
            return e('div',{
              key:c.id,className:'board-nbcard'+linkCls+(dragCard&&dragCard.id===c.id?' dragging':''),
              style:{left:c.x,top:c.y,width:c.w},
              onMouseDown:ev=>beginCardDrag(c,ev)
            },
              e('div',{className:'board-nbcard-hdr'},
                e('span',{className:'board-nbcard-title untitled'},'Esta entrada fue eliminada'),
                !linkMode&&e('button',{className:'board-nbcard-del',onMouseDown:ev=>ev.stopPropagation(),onClick:()=>deleteCard(c.id),title:'Quitar tarjeta'},'✕')
              )
            );
          }
          return e('div',{
            key:c.id,className:'board-nbcard'+linkCls+(dragCard&&dragCard.id===c.id?' dragging':''),
            style:{left:c.x,top:c.y,width:c.expanded?Math.max(c.w,280):c.w},
            onMouseDown:ev=>beginCardDrag(c,ev)
          },
            e('div',{
              className:'board-nbcard-hdr',
              onDoubleClick:()=>!linkMode&&toggleCardExpand(c.id),
              title:'Doble clic para '+(c.expanded?'contraer':'expandir')
            },
              e('span',{className:'board-nbcard-icon'},e(DashIcon,{name:'note',size:12})),
              e('span',{className:'board-nbcard-title'+(entry.title?'':' untitled')},entry.title||'Sin título'),
              !linkMode&&e('button',{className:'board-nbcard-del',onMouseDown:ev=>ev.stopPropagation(),onClick:()=>deleteCard(c.id),title:'Quitar tarjeta de la pizarra (no borra la nota)'},'✕')
            ),
            !c.expanded&&e('div',{className:'board-nbcard-hint'},'doble clic para abrir · vista miniatura de la nota'),
            // Vista en miniatura: el editor real de la Libreta (con sus bloques,
            // checklist, imágenes, etc.), embebido y con scroll, para editar sin
            // salir de la pizarra.
            c.expanded&&e('div',{className:'board-nbcard-mini',onMouseDown:ev=>ev.stopPropagation()},
              e('input',{
                className:'notebook-subtitle-input',
                style:{fontSize:11.5,marginBottom:0,marginTop:10},
                value:entry.subtitle,
                placeholder:'Agregar un subtítulo...',
                onChange:ev=>patchNotebookEntry(entry.id,{subtitle:ev.target.value})
              }),
              e(NotebookBlockEditor,{
                key:entry.id,
                blocks:entry.blocks,
                legacyText:entry.text,
                onChange:blocks=>patchNotebookEntry(entry.id,{blocks})
              })
            )
          );
        })
      )
    )
  );
}

// Bitácora de experimentos propia de este lanzamiento/proyecto — vive dentro de la task,
// nunca toca los Sistemas compartidos de la cuenta. Solo sirve para anotar "estoy probando
// tal cosa con tal sistema" sin necesidad de cerrar ciclos ni duplicar nada.

    const t=text.trim();
    if(!t)return;
    onUpdateTask({experiments:[{id:uid(),system:sysName||null,text:t,createdAt:Date.now()},...experiments]});
